---
# Each domain's AppRole env-var pair is DERIVED by the reader, not
# listed here: OPENBAO_APPROLE_<CREDENTIAL_DOMAIN>_{ROLE,SECRET}_ID, where
# credential_domain defaults to name, upper-cased with non-alphanumerics -> '_'.
# A legacy <CREDENTIAL_DOMAIN>_VAULT_{ROLE,SECRET}_ID pair is tried second.
# Domains declaring workstation_issuer_role use the per-call issuer client
# when the approle-issuer pair is set and flow-lock resolves on the
# controller; every other caller keeps its stored pair.
openbao_secrets_domains:
  - name: observability
    workstation_issuer_role: observability-workstation
    paths:
      # The store holds the `/main` keys, and the policy grants
      # `platform/<app>/*` — the bare `platform/splunk` is a 403, not a 404.
      - platform/splunk/main
      - platform/cribl/main
  - name: local-cloud
    workstation_issuer_role: local-cloud-workstation
    paths:
      # As above: the policy grants `platform/object-storage/*` only, so the
      # bare key is a 403 even though it exists. optional: true -- no role or
      # playbook in this repo reads bao_local_cloud_secrets, so a failed fetch
      # is reported as an isolated domain failure and the other domains still
      # resolve.
      - path: platform/object-storage/main
        optional: true
      # platform/compute is not declared: the path holds no keys at all.
  - name: monitoring
    workstation_issuer_role: monitoring-workstation
    paths:
      # The policy grants `apps/monitoring/*`; the bare path is a 403.
      - apps/monitoring/main
      # Off-site deadman ping URL (service_deadman role) -- third-party SaaS,
      # so it is secrets-external, not secret/apps. optional: true -- not yet
      # seeded; the off-site ping simply no-ops until an operator populates it.
      - mount: secrets-external
        path: platform/healthchecks-offsite
        optional: true
  - name: media
    workstation_issuer_role: media-workstation
    paths:
      # One path per KV ENTRY. `vault_kv2_get` reads a single entry and does not
      # walk a subtree, and the media policy grants `apps/media/*` — which does
      # NOT match the bare `apps/media`, so that entry is a 403. Its fields are
      # duplicated under the per-app subkeys below, which are the ones declared.
      - apps/media/sonarr
      - apps/media/radarr
      - apps/media/seerr
      - apps/media/plex
      - apps/media/prowlarr
      - apps/media/qbittorrent
      - apps/media/sortarr
      - apps/media/autobrr
      - apps/media/autobrr-private
      - apps/media/autobrr-priority
  - name: apps
    # Keep core/client out of this shared path list: its exact read policy is
    # attached to the apps AppRole, not apps-workstation. The Authelia play
    # selects it through a controller-side override using the apps AppRole.
    workstation_issuer_role: apps-workstation
    paths:
      # The dispatcher uses the write-only ntfy ai-jobs publisher token
      # created by the ntfy role (#2334) when OpenBao AppRole login is refused.
      - apps/open-llm
      # Nautobot IPAM/DCIM (issue #138). The apps/nautobot KV path carries the
      # fields db_password, secret_key, superuser_password (the #138 secret
      # contract WS-C seeds), merged flat into bao_apps_secrets. Future apps
      # sharing the Postgres instance (Vikunja P3, EspoCRM P4) add their own
      # `apps/<app>` path here; because the merge is flat, their fields MUST be
      # app-namespaced (e.g. vikunja_db_password) or given a separate domain,
      # so they never collide with Nautobot's bare field names.
      - apps/nautobot
      # Zammad ITSM/ticketing (incident-management system of record). Fields are
      # app-namespaced (zammad_db_password, zammad_admin_password) so the flat
      # merge into bao_apps_secrets never collides with Nautobot's bare names.
      # The Hermes API token is NOT here — it lives in ai/hermes (local-llm
      # domain) so the one token has a single home shared by both sides.
      - apps/zammad
      # Vikunja task-management (issue #141). Fields come from the SOPS->bao
      # promotion map (roles/openbao openbao_promoted_app_secrets.vikunja): vikunja_db_password
      # (app-namespaced, matches the postgres + vikunja_group consumers) plus the
      # MCP svc-account passwords + API tokens. Merged flat into bao_apps_secrets.
      - apps/vikunja
      # Homebox inventory app. Fields are app-namespaced (homebox_db_password,
      # homebox_restic_password, homebox_api_key_pepper) for the flat merge into
      # bao_apps_secrets. homebox_api_key_pepper is consumed as
      # HBOX_AUTH_API_KEY_PEPPER: a random 64-character alphanumeric value.
      # Seeded once by the operator, so optional: true -- a not-yet-seeded 404
      # must not fail the whole apps prefetch.
      - path: apps/homebox
        optional: true
      # OpenProject's stable Rails signing key is promoted into this path and
      # read by its app role from the prefetched apps domain.
      - apps/openproject
      # MCP gateway (IBM mcp-context-forge) — single HTTP/SSE endpoint every
      # MCP client reaches. SQLite-backed, no shared Postgres cluster, so no
      # db_password field. Fields generated at source by roles/openbao
      # openbao_generated_app_secrets.mcp-gateway.
      - apps/mcp-gateway
      # Shared-apps Postgres replication credential (generated at source by
      # roles/openbao openbao_generated_app_secrets.postgres); consumed by the
      # postgres role on both the primary and the standby.
      - apps/postgres
      # Hindsight agent-memory (ai VLAN): DB + replication credentials for its
      # dedicated Postgres cluster and the Control Plane access key (generated
      # at source by openbao_generated_app_secrets.hindsight; app-namespaced).
      - apps/hindsight
      # LiteLLM router DB login on the ai-VLAN cluster (llm_router_db_password,
      # generated at source by openbao_generated_app_secrets.llm-router).
      # Consumed here by inventory/group_vars/postgres_ai_group.yml, and in
      # ansible-proxmox-ai by roles/llm_router — one field, both ends, so the
      # two cannot drift.
      - apps/llm-router
      # Console-account fields are target-prefixed to avoid collisions in the
      # apps domain's flat merge. Both target paths are optional and may be
      # absent until their target is enabled.
      - path: apps/idrac-kvm-r410
        optional: true
      - path: apps/idrac-kvm-r710
        optional: true
      # Metrics scraper's router bearer (prometheus_llm_router_key, generated
      # at source by openbao_generated_app_secrets.prometheus). Consumed here
      # by inventory/group_vars/prometheus_group.yml; the same field is
      # registered on the router by ansible-proxmox-ai roles/llm_router.
      - apps/prometheus
      # Dashboard deployment-profile tile's router bearer (glance_llm_router_key,
      # generated at source by openbao_generated_app_secrets.glance). Consumed
      # here by inventory/group_vars/glance_group.yml; the same field is
      # registered on the router by ansible-proxmox-ai roles/llm_router.
      - apps/glance
      # Workflow engine: n8n_db_password (generated at source for its role on
      # the shared cluster) + n8n_encryption_key (PROMOTED — the key that
      # decrypts the credentials already stored in its database, so it must
      # never be regenerated). App-namespaced for the flat bao_apps_secrets
      # merge. Consumed by inventory/group_vars/{n8n_group,postgres_group}.yml.
      - apps/n8n
      - path: apps/homeassistant
        optional: true
      # OpenHands agent server: router key, backend API key, secret key and
      # webhook secret, all generated at source by
      # openbao_generated_app_secrets.openhands. App-namespaced for the flat
      # bao_apps_secrets merge. optional: true -- the path exists only once the
      # generation converge has seeded it, so a first-run 404 must not fail the
      # whole apps prefetch.
      - path: apps/openhands
        optional: true
      # Hatchet batch-job scheduler: DB + admin + cookie fields (generated at
      # source, 01c) and the three encryption keysets (promoted, 01b). Consumed
      # by inventory/group_vars/docker_ai_group.yml in ansible-proxmox-apps.
      - apps/hatchet
      # Hatchet worker API token (hatchet_worker_token), written only by
      # the human-unlocked hatchet-token-publisher. optional: true -- absent until
      # the first publish run.
      - path: apps/hatchet/worker-token
        optional: true
      # Hatchet eval worker credentials (hatchet_eval_*), published by converges
      # through the shared seeding modules. optional: true -- absent until then.
      - path: apps/hatchet/eval
        optional: true
      # Homarr dashboard: its own admin service account, API key and — most
      # importantly — homarr_encryption_key, which is PROMOTED, not generated.
      # That key decrypts every stored integration credential; regenerating it
      # does not invalidate them, it makes them permanently unreadable. All
      # fields are app-namespaced for the flat merge. The API keys of the
      # services Homarr integrates WITH are not here: they stay in the media
      # domain, owned by the media-stack automation repo.
      - apps/homarr
      # The second Homarr guest's own credentials (homarr_v2_* fields).
      # optional: the role publishes them on that guest's first converge.
      - path: apps/homarr-v2
        optional: true
      # Authelia: the OIDC client secrets it shares with its relying parties
      # (authelia_oidc_{homarr,langfuse}_client_secret). The secret's home is
      # Authelia — it hashes the plaintext into its own config while Homarr and
      # Langfuse consume the plaintext — so it is seeded and read here rather
      # than under each consumer. Without this path the fields never reach
      # bao_apps_secrets and Authelia's mandatory() default fails the converge.
      - apps/authelia
      # prometheus-pve-exporter's read-only PVE API token (pve_exporter_token_id,
      # pve_exporter_token_secret — minted and published by ansible-proxmox's
      # pve_api_tokens). Consumed by roles/prometheus_pve_exporter; absent
      # skips deploying the exporter rather than rendering a container with no
      # credential. optional: true -- the path exists only once that converge
      # has published the token, so a 404 must not fail the whole apps
      # prefetch.
      - path: apps/pve-exporter
        optional: true
      # Cribl Stream management API (:9000) admin password
      # (cribl_admin_password, generated at source by
      # openbao_generated_app_secrets.cribl-stream). Consumed by
      # inventory/group_vars/cribl_stream_group.yml. optional: true — the
      # path exists only once the generation converge has seeded it, so a
      # first-run 404 must not fail the whole apps prefetch.
      - path: apps/cribl-stream
        optional: true
      # unpoller's read-only UniFi controller account password
      # (unpoller_controller_password, generated at source by
      # openbao_generated_app_secrets.unpoller). Consumed by
      # inventory/group_vars/cribl_stream_group.yml. optional: true — the
      # path exists only once the generation converge has seeded it.
      - path: apps/unpoller
        optional: true
      # ARC pilot's dedicated GitHub App id/installation_id/private_key
      # (github_runner_arc_*, PROMOTED at source by
      # roles/openbao openbao_promoted_app_secrets.github-runner-arc).
      # Consumed by roles/github_runner_arc. optional: true — the path
      # exists only once the operator has created the dedicated App and
      # promoted its credentials; until then the role's own assert fails
      # loud on the empty values rather than the KV prefetch failing here.
      - path: apps/github-runner-arc
        optional: true
      # UniFi controller connection (issue: unpoller/unifi_metrics silently
      # rendered an empty controller URL under Semaphore, which never exports
      # UNIFI_API into the run's environment). secret/infrastructure/unifi is
      # the single source of truth the network IaC repo's Terraform provider
      # also reads; its fields are
      # UPPERCASE (UNIFI_API, UNIFI_USERNAME, UNIFI_PASSWORD, ...), unlike the
      # app-namespaced lowercase fields elsewhere in this flat "apps" merge —
      # no collision either way. The apps AppRole's policy carries the read
      # grant for this exact path (roles/openbao templates/apps-policy.hcl.j2),
      # so this reuses the domain already fetched for cribl_stream_group
      # rather than minting a dedicated AppRole for one controller URL.
      - infrastructure/unifi
      # SMB share account fields (generated at source by openbao_generated_app_secrets.nas).
      - apps/nas
      # hermes-ui companion service: workspace password and mission-control auth pair.
      - apps/hermes-ui
      # Router caller keys: generated at source (openbao_generated_app_secrets) or
      # published (openbao_apps_read_published_apps). optional: true -- a not-yet-seeded
      # 404 must not fail the whole apps prefetch.
      - path: apps/github-actions-oss
        optional: true
      - path: apps/benchmark
        optional: true
      - path: apps/hermes-orchestrator
        optional: true
      - path: apps/hermes-eval
        optional: true
      - path: apps/docs-router-snapshot
        optional: true
      # YouTrack and Leantime app secrets (generated at source by
      # openbao_generated_app_secrets.youtrack / .leantime). optional: true -- the
      # path exists only once the generation converge has seeded it, so a
      # first-run 404 must not fail the whole apps prefetch.
      - path: apps/youtrack
        optional: true
      - path: apps/leantime
        optional: true
  - name: postgres_backup_s3
    credential_domain: apps
    paths:
      # pgBackRest consumes AWS_ENDPOINT_URL, AWS_ACCESS_KEY_ID, and
      # AWS_SECRET_ACCESS_KEY from this record; AWS_REGION is also returned
      # and the consumer retains its existing region default. Keep the data
      # domain separate while reusing the apps AppRole credentials.
      - path: rustfs/dryvist-homelab-backups/rw
        optional: true
  - name: homebox_backup_s3
    credential_domain: apps
    paths:
      # Own domain so its AWS_* fields stay under their own key in
      # openbao_secrets_by_domain, apart from postgres_backup_s3. Reuses the
      # apps AppRole credentials. optional: true -- the keys are seeded later.
      - path: rustfs/dryvist-homebox-backups/rw
        optional: true
  - name: homebox_backup_b2
    credential_domain: apps
    paths:
      # Backblaze B2 keys for the Homebox backup bucket. Internet-reachable SaaS
      # credentials, so they live on secrets-external. Read with the apps reader
      # through an exact-path grant (apps-policy.hcl.j2). optional: true -- the
      # keys are created and seeded by the bucket step, not here.
      - mount: secrets-external
        path: backblaze/dryvist-homebox-backups/rw
        optional: true
  - name: nautobot_backup_b2
    credential_domain: apps
    paths:
      # Backblaze B2 keys for the Nautobot backup bucket, a bucket of its own
      # with a key limited to it. Internet-reachable SaaS credentials, so they
      # live on secrets-external. Read with the apps reader through an
      # exact-path grant (apps-policy.hcl.j2). optional: true -- the keys are
      # created and seeded by the bucket step, not here.
      - mount: secrets-external
        path: backblaze/dryvist-nautobot-backups/rw
        optional: true
  - name: grafana-alerts
    credential_domain: apps
    paths:
      # Reads the bot token and channel ID from the Slack ops leaf. The apps
      # reader reads that leaf through an exact-path grant (apps-policy.hcl.j2).
      - mount: secrets-external
        path: slack/homelab-ops/rw
        optional: true
  - name: ntfy
    paths:
      # Slack incoming-webhook URLs keyed by topic, for the ntfy alert hub's
      # Slack fan-out (ntfy_docker role). Post-only webhooks live on the
      # ext-notify mount. Paths merge in order and later paths win, so the
      # ext-notify leaf overrides the transitional secrets-external leaf,
      # which stays until the consumer is proven on the ext-notify leaf.
      # optional: true so the prefetch never fails on it; the ntfy_docker
      # role itself fails the converge while a webhook it needs is unseeded.
      - mount: secrets-external
        path: slack/webhooks/rw
        optional: true
      - mount: ext-notify
        path: slack/webhooks/rw
        optional: true
  - name: local-llm
    paths:
      - ai/llm         # LLM_ROUTER_MASTER_KEY, LLM_LARGE_BEARER_TOKEN (single seeded KV path)
      - ai/qdrant      # QDRANT_API_KEY
      - ai/open-webui  # OPEN_WEBUI_SECRET_KEY, OPEN_WEBUI_OPENAI_API_KEY
      - ai/hermes      # GH_PAT_WRITE_PROJECT_ISSUES, HERMES_GITHUB_APP_{ID,INSTALLATION_ID}.
      - ai/mcp/splunk  # SPLUNK_MCP_URL, SPLUNK_MCP_TOKEN; merged into the same
                       #   bao_local_llm_secrets fact consumed by Hermes
      - ai/langfuse    # LANGFUSE_{POSTGRES_PASSWORD,CLICKHOUSE_PASSWORD,REDIS_AUTH,
                       #   S3_ACCESS_KEY_ID,S3_SECRET_ACCESS_KEY,PUBLIC_KEY,SECRET_KEY,
                       #   INIT_USER_EMAIL,INIT_USER_PASSWORD} — fully seeded 2026-07-05
      - ai/phoenix     # PHOENIX_INGEST_API_KEY — the bearer key cribl_stream's
                       #   phoenix_otlp output presents to Arize Phoenix. Seeded
                       #   after the Phoenix guest's first boot (ansible-proxmox-ai
                       #   roles/phoenix_docker); the same path also holds the
                       #   guest's own bootstrap secrets, read only over there.
      - ai/langflow    # LANGFLOW_{SUPERUSER,SUPERUSER_PASSWORD,DB_PASSWORD}
      - ai/llm-router  # LLM_ROUTER_REDIS_PASSWORD (router spend-store AUTH)
      - ai/dify        # DIFY_SECRET_KEY
      # Optional until the publisher writes its scoped JWT.
      - path: ai/mcp/qdrant  # QDRANT_MEMORY_MCP_JWT
        optional: true
      - ai/mcp/vikunja # VIKUNJA_MCP_URL, VIKUNJA_MCP_TOKEN_RO/_RW
      - ai/mcp/zammad  # ZAMMAD_MCP_URL, ZAMMAD_MCP_TOKEN
      # Read-only IPAM/DCIM token, published opt-in; an absent token is skipped.
      - path: ai/mcp/nautobot  # NAUTOBOT_MCP_URL, NAUTOBOT_MCP_TOKEN
        optional: true
  - name: clickhouse
    paths:
      - ai/clickhouse  # APP_PASSWORD, GRAFANA_PASSWORD, HYPERDX_PASSWORD, SPLUNK_PASSWORD
      - ai/clickhouse-ingest  # CRIBL_PASSWORD (ClickHouse ingest writer)
      - ai/clickhouse-wall  # WALL_READER_PASSWORD (ClickHouse wall reader)
  - name: clickhouse-ingest
    paths:
      - ai/clickhouse-ingest  # CRIBL_PASSWORD (ClickHouse ingest writer)
  - name: clickhouse-wall
    paths:
      - ai/clickhouse-wall  # WALL_READER_PASSWORD (ClickHouse wall reader)

# `community.hashi_vault.vault_kv2_get` distinguishes the two cases cleanly in
# its own failure message, and only this one means the path is genuinely absent:
#   absent -> "Invalid or missing path ['<p>'] with secret version 'latest'. ..."
#   DENIED -> "Forbidden: Permission Denied to path ['<p>']."
# A read-before-write that swallows both turns its own anti-clobber merge INTO
# the clobber, because a denied read yields no siblings to preserve.
openbao_secrets_absent_msg_marker: Invalid or missing path

# Domains an OPERATOR_VAULT_ROLE_ID / _SECRET_ID pair may serve when the
# domain's own pair is unset: the operator identity's policies cover these.
openbao_secrets_operator_domains:
  - apps
  - local-llm
  - clickhouse
  - media
  - monitoring
  - local-cloud
  - observability

# Optional per-run scoping (see playbooks/site/00-load-and-telemetry.yml,
# whose pre-fetch play is the only current caller that sets these): a domain
# is skipped only when BOTH are true -- openbao_secrets_domain_groups names
# at least one consumer group for it, AND none of those groups appear in
# openbao_secrets_active_groups. Left at their empty defaults, every domain
# in openbao_secrets_domains above is fetched, exactly as before this became
# configurable -- this is the contract every OTHER caller of this role
# relies on.
openbao_secrets_domain_groups: {}
openbao_secrets_active_groups: []

# Mirrors openbao_roster_agent_owned_slugs in roles/openbao/defaults/main/05k-roster-agents.yml.
openbao_secrets_roster_owned_slug_names: >-
  {{ (tofu_data | default({})).agents | default({})
     | dict2items | map(attribute='value.owns', default=[])
     | flatten | unique | list }}
