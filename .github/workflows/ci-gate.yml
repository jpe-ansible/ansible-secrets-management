---
# CI Gate — wrapper around the shared ansible CI gate.
#
# ansible-lint and the standardized change filter live in
# JacobPEvans/.github/.github/workflows/_ansible-ci.yml so lint runs identically
# across the dryvist Ansible repositories.
#
# Molecule uses the shared execution workflow. The shared Ansible CI workflow
# runs lint only (molecule: false), while a parallel changes call runs the same
# filter. Molecule consumes its scenario output; other local jobs retain their
# existing CI dependencies. The local "Merge Gate" aggregates every job.
#
# Lint, Role tests, Role pytest suite and Molecule restore the Galaxy content cache under the key
# ansible-galaxy-v2-<os>-<hash of requirements.yml>. Runs on pushes to develop
# and main save it, and pull request runs restore it.

name: CI Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Runs on develop and main save the dependency caches that pull request runs
  # restore; a cache saved from a pull request ref is readable by that pull
  # request only.
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  conformance:
    permissions:
      contents: read
    uses: dryvist/.github/.github/workflows/agent-platform-conformance.yml@198f25d695819a48e73f5a7723b47c5bd4839a7c

  ci:
    permissions:
      contents: read
      pull-requests: read
    uses: JacobPEvans/.github/.github/workflows/_ansible-ci.yml@v1
    with:
      # Molecule runs in the shared workflow below; this shared workflow runs lint only.
      molecule: false
      # Each filter lists the roles its converge play includes, the scenario
      # directory, and the workflow/discovery files that select and execute it.
      molecule_scenario_filters: &molecule_scenario_filters |
        openbao:
          - 'roles/openbao/**'
          - 'molecule/openbao/**'
          - '.github/workflows/ci-gate.yml'
        openbao_voter_health:
          - 'roles/openbao_voter_health/**'
          - 'molecule/openbao_voter_health/**'
          - '.github/workflows/ci-gate.yml'

  changes:
    name: Detect Changes
    uses: JacobPEvans/.github/.github/workflows/_ansible-changes.yml@v1
    with:
      molecule: false
      molecule_scenario_filters: *molecule_scenario_filters

  molecule:
    name: Molecule
    needs: changes
    # v1.11 reports molecule=true with an empty scenario list when no
    # scenario's files changed; an empty matrix would fail the job.
    if: >-
      ${{ needs.changes.outputs.molecule == 'true' &&
      needs.changes.outputs.molecule_scenarios != '[]' &&
      needs.changes.outputs.tiny != 'true' }}
    uses: JacobPEvans/.github/.github/workflows/_molecule.yml@v1
    with:
      scenarios: ${{ needs.changes.outputs.molecule_scenarios }}
      scenario_discovery: directories
      scenario_require_molecule_yml: true
      scenario_name_profile: lower_underscore
      runner_label: ubuntu-latest
      discover_timeout_minutes: 360
      pull_request_discover_timeout_minutes: 1
      timeout_minutes: 360
      pull_request_timeout_minutes: 7
      python_version: "3.14"
      python_install_mode: uv_packages
      uv_cache: false
      ansible_home_mode: shared
      molecule_roles_path: roles
      galaxy_cache_enabled: true
      galaxy_cache_prefix: ansible-galaxy-v2-
      galaxy_install_mode: requirements
      galaxy_retry_attempts: 1
      galaxy_retry_wait_seconds: 0
      galaxy_step_timeout_minutes: 360
      galaxy_server_timeout_seconds: 60
      galaxy_refresh_contracts_v5: on_cache_hit
      fail_fast: false
      docker_timeout_seconds: 180
      molecule_args: --destroy never
      molecule_workdir_mode: repo_root
      molecule_scenario_arg: matrix

  # Role tests moved from the consuming repository, run with the same
  # invocations that repository used: the verify playbooks here, the full pytest
  # suite in the pytest job below.
  tests:
    name: Role tests
    needs: changes
    if: ${{ needs.changes.outputs.tiny != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 10 }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"

      - name: Install Ansible, pytest, PyYAML and Jinja2
        run: uv pip install --system 'ansible-core>=2.16' pytest pyyaml jinja2

      - name: Verify the Backblaze account-admin identity
        run: python3 -m pytest -q tests/test_openbao_backblaze_admin_identity.py

      - name: Verify the rendered Authelia configuration with Authelia's validator
        run: ansible-playbook -i localhost, -c local tests/authelia_validate_config/verify.yml

      # Exact cache hits force-refresh only the floating homelab-contracts v5
      # tag; misses run the forced install for the full requirement set.
      # Same path and key as the shared Ansible CI and _molecule.yml, so one
      # saved cache serves every job.
      - name: Cache Ansible Galaxy content
        id: galaxy-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.ansible/collections
            ~/.ansible/roles
          key: ansible-galaxy-v2-${{ runner.os }}-${{ hashFiles('requirements.yml') }}

      - name: Install the collection's dependencies
        if: steps.galaxy-cache.outputs.cache-hit != 'true'
        run: ansible-galaxy collection install -r requirements.yml

      - name: Refresh homelab-contracts major tag
        if: steps.galaxy-cache.outputs.cache-hit == 'true'
        run: >-
          ansible-galaxy collection install
          'git+https://github.com/jpe-ansible/homelab-contracts.git#/ansible/,v5' --force
        env:
          ANSIBLE_GALAXY_SERVER_TIMEOUT: "60"

      - name: Verify the AppRole source-address class map
        run: ansible-playbook tests/approle_cidr_class/verify.yml

      - name: Verify the execution plane's credential is bounded elsewhere
        run: ansible-playbook tests/plane_identity_bounds/verify.yml

      - name: Verify every non-expiring secret_id has a compensating control
        run: ansible-playbook tests/nonexpiring_secret_ids/verify.yml

      - name: Verify the rotate and secret-age script fixtures
        run: |
          for play in tests/openbao_rotate/verify_*.yml tests/openbao_secret_age/verify_*.yml; do
            ansible-playbook -i localhost, -c local "$play"
          done

  # The full pytest suite runs in its own job so each job stays inside the
  # pull-request timeout policy.
  pytest:
    name: Role pytest suite (${{ matrix.shard }}/2)
    needs: changes
    if: ${{ needs.changes.outputs.tiny != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 10 }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"

      - name: Install Ansible, pytest, PyYAML and Jinja2
        run: uv pip install --system 'ansible-core>=2.16' pytest pytest-xdist pyyaml jinja2

      # Exact cache hits force-refresh only the floating homelab-contracts v5
      # tag; misses run the forced install for the full requirement set.
      # Same path and key as the shared Ansible CI and _molecule.yml, so one
      # saved cache serves every job.
      - name: Cache Ansible Galaxy content
        id: galaxy-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.ansible/collections
            ~/.ansible/roles
          key: ansible-galaxy-v2-${{ runner.os }}-${{ hashFiles('requirements.yml') }}

      - name: Install the collection's dependencies
        if: steps.galaxy-cache.outputs.cache-hit != 'true'
        run: ansible-galaxy collection install -r requirements.yml

      - name: Refresh homelab-contracts major tag
        if: steps.galaxy-cache.outputs.cache-hit == 'true'
        run: >-
          ansible-galaxy collection install
          'git+https://github.com/jpe-ansible/homelab-contracts.git#/ansible/,v5' --force
        env:
          ANSIBLE_GALAXY_SERVER_TIMEOUT: "60"

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1 # v3

      - name: Run the pytest shard
        env:
          PYTEST_SHARD: ${{ matrix.shard }}
        run: |
          # Every other test module by sorted path; the count check proves both shards together cover tests/ exactly.
          mapfile -t files < <(find tests -type f \( -name 'test_*.py' -o -name '*_test.py' \) | LC_ALL=C sort)
          mine=(); other=()
          for i in "${!files[@]}"; do
            if (( i % 2 == PYTEST_SHARD - 1 )); then mine+=("${files[i]}"); else other+=("${files[i]}"); fi
          done
          count() { python3 -m pytest --collect-only -q "$@" | grep -c '::'; }
          all=$(count tests/); a=$(count "${mine[@]}"); b=$(count "${other[@]}")
          echo "shard ${PYTEST_SHARD}/2: ${a} tests, other shard ${b}, unsharded ${all}"
          test $((a + b)) -eq "${all}"
          nix shell --inputs-from . nixpkgs#openbao --command python3 -m pytest -q -n auto "${mine[@]}"

  gate:
    name: Merge Gate
    needs: [conformance, ci, changes, molecule, tests, pytest]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check all results
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          allowed-skips: ${{ needs.ci.outputs.tiny == 'true' && 'molecule,tests,pytest' || 'molecule' }}
          jobs: ${{ toJSON(needs) }}
