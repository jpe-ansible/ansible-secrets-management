---
- name: Reset generated app-secret seed filter state
  ansible.builtin.set_fact:
    openbao_seed_apps_with_absent_fields: []
  no_log: true

- name: Read generated app-secret field names from KV v2 subkeys
  ansible.builtin.command:
    cmd: >-
      bao read -format=json
      {{ openbao_seed_app_mount }}/subkeys/{{ openbao_seed_app_path }}
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
    openbao_seed_app: "{{ item.key }}"
  register: openbao_seed_subkeys_reads
  failed_when: >-
    openbao_seed_subkeys_reads.rc != 0
    and openbao_absent_stderr_marker not in (openbao_seed_subkeys_reads.stderr | default(''))
  changed_when: false
  check_mode: false
  no_log: true
  loop: "{{ openbao_seeded_generated_app_secrets | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: openbao_seed_absent_only | bool

- name: Collect generated app leaves with absent fields
  ansible.builtin.set_fact:
    openbao_seed_apps_with_absent_fields: >-
      {%- set _absent = [] -%}
      {%- for read in openbao_seed_subkeys_reads.results -%}
      {%- if read.rc != 0 -%}
      {%- set _ = _absent.append(read.item.key) -%}
      {%- else -%}
      {%- set _response_data = (read.stdout | from_json).data -%}
      {%- set _present = _response_data.subkeys
          if 'subkeys' in _response_data
          else _response_data.data
          if 'data' in _response_data and 'metadata' in _response_data
          else _response_data -%}
      {%- if read.item.value | difference(_present.keys() | list) | length > 0 -%}
      {%- set _ = _absent.append(read.item.key) -%}
      {%- endif -%}
      {%- endif -%}
      {%- endfor -%}
      {{ _absent }}
  no_log: true
  when: openbao_seed_absent_only | bool

- name: Find apps with fields requested for rotation
  ansible.builtin.set_fact:
    openbao_seed_apps_with_rotated_fields: >-
      {%- set _apps = [] -%}
      {%- for app, fields in openbao_seeded_generated_app_secrets.items() -%}
      {%- if fields | intersect(openbao_seed_rotate_list) | length > 0 -%}
      {%- set _ = _apps.append(app) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ _apps }}

- name: Select generated app-secret leaves by name
  ansible.builtin.set_fact:
    openbao_seed_apps_selected_by_name: >-
      {{ openbao_seeded_generated_app_secrets.keys() | list
         if openbao_seed_only_apps | length == 0
         else openbao_seeded_generated_app_secrets.keys() | list
              | select('in', openbao_seed_only_apps
                       + openbao_seed_required_apps
                       + openbao_seed_apps_with_rotated_fields)
              | list }}

- name: Select generated app-secret leaves to seed
  ansible.builtin.set_fact:
    openbao_seed_apps_to_seed: >-
      {{ (openbao_seeded_generated_app_secrets | dict2items
          | selectattr('key', 'in', openbao_seed_apps_selected_by_name)
          | list)
         if not (openbao_seed_absent_only | bool)
         else openbao_seeded_generated_app_secrets | dict2items
              | selectattr('key', 'in', openbao_seed_apps_selected_by_name)
              | selectattr('key', 'in', openbao_seed_apps_with_absent_fields
                          + openbao_seed_required_apps
                          + openbao_seed_apps_with_rotated_fields)
              | list }}
