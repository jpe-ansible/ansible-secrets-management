---
# Promote one app's EXISTING service credentials into secret/apps/<app> so
# OpenBao becomes their canonical home. Values come from the converge
# environment, mapped field -> env var by openbao_promoted_app_secrets. Called
# per app from init.yml with openbao_promote_app + openbao_promote_fields.
# The source-value lookup below checks an Ansible var of that name first,
# falling back to an OS env var of the same name — so a mapped field may name
# either a converge env var (the common case) or a plain Ansible var computed
# from one (e.g. a URL derived from a domain var), with no other code change.
#
# Promotion, not generation: these are values that already exist and MUST keep
# their current value. Anything that may simply be created fresh belongs in
# openbao_generated_app_secrets instead.
#
# MERGE-PRESERVING: the desired map is the CURRENTLY-STORED fields overlaid with
# whatever env-derived keys this converge actually carries. A converge that
# exposes only SOME of the mapped env vars therefore updates just those fields
# and can never wipe the siblings a partial run doesn't know about. Idempotent:
# no env var present, or all present values already stored -> desired == current,
# so no write.
- name: Read the app's currently-stored secret fields
  ansible.builtin.command:
    argv:
      - bao
      - kv
      - get
      - "-format=json"
      - "{{ _promote_mount }}/{{ _promote_path }}"
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  # Controller-side (openbao_cli_host, init/02): this file is included once
  # per promoted app, so each read was its own remote module execution.
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
    _promote_mount: "{{ openbao_promote_mount | default(openbao_kv_mount) }}"
    _promote_path: "{{ openbao_promote_path | default('apps/' ~ openbao_promote_app) }}"
  register: openbao_promote_current
  # A DENIED read is not an ABSENT path. Collapsing a denial to {} makes the
  # write below carry only the env-derived fields, wiping every sibling -- the
  # exact outcome the MERGE-PRESERVING contract above promises is impossible.
  # That contract holds only when this read SUCCEEDED, so tolerate genuine
  # absence ONLY and fail on a denial.
  failed_when:
    - openbao_promote_current.rc != 0
    - openbao_absent_stderr_marker not in (openbao_promote_current.stderr | default(''))
  changed_when: false
  no_log: true

- name: Capture the stored fields (empty map when the path is absent)
  ansible.builtin.set_fact:
    openbao_promote_current_data: >-
      {{ (openbao_promote_current.stdout | default('{}', true) | from_json).data.data
         | default({}, true)
         if (openbao_promote_current.rc | default(1)) == 0 else {} }}
    openbao_promote_desired: >-
      {{ (openbao_promote_current.stdout | default('{}', true) | from_json).data.data
         | default({}, true)
         if (openbao_promote_current.rc | default(1)) == 0 else {} }}
  no_log: true

- name: Overlay the converge-env (or plain Ansible var) values onto the stored fields
  ansible.builtin.set_fact:
    openbao_promote_desired: >-
      {{ openbao_promote_desired
         | combine({item.key: lookup('vars', item.value, default=lookup('env', item.value))}) }}
  loop: "{{ openbao_promote_fields | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true
  when: (lookup('vars', item.value, default=lookup('env', item.value))) | length > 0

- name: Remove retired fields from the promoted secret leaf
  ansible.builtin.set_fact:
    openbao_promote_desired: >-
      {{ openbao_promote_desired | dict2items
         | rejectattr('key', 'in', openbao_promote_remove_fields | default([]))
         | items2dict }}
  no_log: true
  when: openbao_promote_remove_fields | default([]) | length > 0

- name: Seed or update the app secrets in OpenBao (merge-preserving, write-if-changed)
  ansible.builtin.uri:
    unix_socket: "{{ openbao_cli_unix_socket }}"
    url: >-
      {{ openbao_cli_http_addr }}/v1/{{ openbao_promote_mount
      | default(openbao_kv_mount) }}/data/{{ openbao_promote_path
      | default('apps/' ~ openbao_promote_app) }}
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_bootstrap_token }}"
    body_format: json
    body:
      data: "{{ openbao_promote_desired }}"
    status_code: [200, 204]
  no_log: true
  changed_when: true
  when: openbao_promote_desired != openbao_promote_current_data
  # Same host and address as the read above: the provisioning token is
  # source-bound to the controller, so a write sent from the store node 403s.
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
