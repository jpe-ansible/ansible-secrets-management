    - openbao_ci_benchmark_lanes_repository | length > 0
    - >-
      (openbao_github_oidc_ci_benchmark_lanes_role_current.rc | default(1)) != 0
      or (_ci_benchmark_lanes_role_live.bound_audiences | default([]))
         != [openbao_ci_benchmark_lanes_audience]
