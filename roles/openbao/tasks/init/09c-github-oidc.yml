    ansible_become: "{{ openbao_cli_become }}"
    _ci_ai_review_role_claims:
      job_workflow_ref: "{{ openbao_ci_ai_review_job_workflow_ref }}"
      enterprise_id: "{{ openbao_ci_ai_review_enterprise_id }}"
      runner_environment: "{{ openbao_ci_ai_review_runner_environment }}"
    _ci_ai_review_role_live: >-
      {{ (openbao_github_oidc_ci_ai_review_role_current.stdout | default('{}') | from_json).data
         | default({}, true) }}
    _ci_ai_review_token_ttl_s: "{{ openbao_ci_ai_review_token_ttl | community.general.to_seconds | int }}"
    _ci_ai_review_token_max_ttl_s: >-
      {{ openbao_ci_ai_review_token_max_ttl | community.general.to_seconds | int }}
  ansible.builtin.command:
    cmd: >-
      bao write
      auth/{{ openbao_github_oidc_auth_path }}/role/{{ openbao_ci_ai_review_policy_name }} -
    stdin: >-
      {{ {'role_type': 'jwt',
            'user_claim': 'job_workflow_ref',
            'bound_audiences': [openbao_ci_ai_review_audience],
            'bound_claims': _ci_ai_review_role_claims,
            'bound_claims_type': 'string',
            'token_policies': [openbao_ci_ai_review_policy_name],
            'token_ttl': openbao_ci_ai_review_token_ttl,
            'token_max_ttl': openbao_ci_ai_review_token_max_ttl} | to_json }}
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  no_log: true
  changed_when: true
  when:
    - openbao_select | default({}) | length == 0
    - openbao_bootstrap_token is defined
    - openbao_ci_ai_review_enterprise_id | length > 0
    - >-
      (openbao_github_oidc_ci_ai_review_role_current.rc | default(1)) != 0
      or (_ci_ai_review_role_live.bound_audiences | default([]))
         != [openbao_ci_ai_review_audience]
      or (_ci_ai_review_role_live.bound_claims | default({}, true))
         != _ci_ai_review_role_claims
      or (_ci_ai_review_role_live.bound_claims_type | default(''))
         != 'string'
      or (_ci_ai_review_role_live.user_claim | default(''))
         != 'job_workflow_ref'
      or (_ci_ai_review_role_live.token_policies | default([]) | sort)
         != [openbao_ci_ai_review_policy_name]
      or (_ci_ai_review_role_live.token_ttl | default(0) | int)
         != (_ci_ai_review_token_ttl_s | int)
      or (_ci_ai_review_role_live.token_max_ttl | default(0) | int)
         != (_ci_ai_review_token_max_ttl_s | int)

- name: Validate the ci-benchmark-lanes OIDC role inputs
  ansible.builtin.assert:
    that:
      - openbao_ci_benchmark_lanes_workflow_ref | length > 0
      - openbao_ci_benchmark_lanes_ref | length > 0
      - >-
        openbao_ci_benchmark_lanes_workflow_ref.startswith(
          openbao_ci_benchmark_lanes_repository ~ '/.github/workflows/')
    fail_msg: >-
      ci-benchmark-lanes requires a workflow ref and ref that match the configured repository.
  no_log: true
  when:
    - openbao_select | default({}) | length == 0
    - openbao_ci_benchmark_lanes_repository | length > 0

