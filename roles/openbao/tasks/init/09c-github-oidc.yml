  ansible.builtin.command:
    cmd: >-
      bao write
      auth/{{ openbao_github_oidc_auth_path }}/role/{{ openbao_ci_benchmark_lanes_policy_name }} -
    stdin: >-
      {{ {'role_type': 'jwt',
            'user_claim': 'workflow_ref',
            'bound_audiences': [openbao_ci_benchmark_lanes_audience],
