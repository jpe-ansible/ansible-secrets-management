---
# Each Terrakube workspace policy references its workspace BY LIST INDEX
# (openbao_terrakube_workspaces[N]) while carrying the workspace's name in its
# own `name`. Nothing structural keeps the two in step: inserting a workspace
# anywhere but the end, or mistyping an index, silently points a policy at a
# DIFFERENT workspace — which grants that workspace's KV paths to the wrong
# job identity and reads as a working converge.
#
# Compare the two ORDERED lists rather than their sets: a set comparison passes
# on exactly the swap this is guarding against, since both names are still
# present.
- name: Assert every Terrakube workspace policy names the workspace it points at
  ansible.builtin.assert:
    that:
      - _tk_policy_names == _tk_workspace_derived_names
    fail_msg: >-
      A Terrakube workspace policy references the wrong entry in
      openbao_terrakube_workspaces. Declared policy names:
      {{ _tk_policy_names }}; names derived from the workspaces each one
      actually points at: {{ _tk_workspace_derived_names }}.
    success_msg: "All {{ _tk_policy_names | length }} Terrakube workspace policies point at their own workspace."
  vars:
    _tk_policies: "{{ openbao_base_policies | selectattr('workspace', 'defined') | list }}"
    _tk_policy_names: "{{ _tk_policies | map(attribute='name') | list }}"
    _tk_workspace_derived_names: >-
      {{ _tk_policies | map(attribute='workspace.name')
         | map('regex_replace', '^', 'terrakube-') | list }}
  run_once: true
  delegate_to: localhost
  become: false

# The per-service apply-role names are generated from openbao_ai_domains. A
# domain named `all` or containing a glob character would render a policy path
# that matches ai-apply-all, which the untrusted tier must never reach. Checked
# before any policy is written.
- name: Assert no AI domain name is a wildcard or the all rollup
  ansible.builtin.assert:
    that:
      - openbao_ai_domains | select('search', '^all$|[*]') | list | length == 0
    fail_msg: >-
      openbao_ai_domains contains "all" or a "*" glob: {{ openbao_ai_domains }}.
      Rendered ai-apply-<svc> policy paths would match ai-apply-all.
    success_msg: "No AI domain name is a wildcard or the all rollup."
  run_once: true
  delegate_to: localhost
  become: false

# The rotation policy template builds read, create and update paths from each
# KV rotation target's mount and path. A glob or a ".." segment there would
# widen the rotator's grant, so the converge stops here, before any policy is
# rendered or written.
- name: Assert every KV rotation target renders only exact policy paths
  ansible.builtin.assert:
    that:
      - openbao_kv_rotation_targets is sequence
      - openbao_kv_rotation_targets is not string
      - openbao_kv_rotation_targets is not mapping
      - >-
        _kv_rotation_policy_segments | map('string')
        | reject('match', '^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$') | list | length == 0
      - >-
        _kv_rotation_policy_segments | map('string') | map('split', '/') | flatten
        | select('equalto', '..') | list | length == 0
    fail_msg: >-
      A KV rotation target has a mount or path (its own or its admin
      credential's) that is not slash-separated safe segments. No policy was
      written.
    success_msg: "KV rotation targets render only exact policy paths."
  vars:
    _kv_rotation_policy_rows: >-
      {{ openbao_kv_rotation_targets
         if (openbao_kv_rotation_targets is sequence
             and openbao_kv_rotation_targets is not string
             and openbao_kv_rotation_targets is not mapping)
         else [] }}
    _kv_rotation_policy_segments: >-
      {%- set out = [] -%}
      {%- for row in _kv_rotation_policy_rows -%}
      {%- set admin = ((row.generate | default({})).admin_credential | default({}))
           if (row is mapping and (row.generate | default({})) is mapping) else {} -%}
      {%- set _ = out.extend([(row.mount | default('')) if row is mapping else '',
                              (row.path | default('')) if row is mapping else '']) -%}
      {%- if row is mapping and (row.generate | default({})) is mapping
            and (row.generate | default({})).get('kind', '') == 'vendor_roll' -%}
      {%- set _ = out.extend([admin.get('mount', '') if admin is mapping else '',
                              admin.get('path', '') if admin is mapping else '']) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}
  run_once: true
  delegate_to: localhost
  become: false
