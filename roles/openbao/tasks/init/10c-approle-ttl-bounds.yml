---
# In-place TTL / num_uses / token-TTL / bound-CIDR tune for AppRoles that
# already exist.
# Included from 10-approles.yml after policy reconcile and before 10b mint.
# Split to stay inside the per-file token budget; the seam is DECLARE (there)
# vs TUNE BOUNDS (here). 10b still ISSUES secret_ids for newly created roles
# only — this file never mints.
#
# Same zip/loop and the same complete field set as "Create the missing
# AppRoles". A partial `bao write auth/approle/role/<name>` resets omitted
# fields to defaults. Break-glass roles are not in openbao_manageable_approles
# during reconcile and are not retuned here BY DESIGN. Runs on
# openbao_cli_host, like the existence check whose results it compares against.

# The retune below is a command, which check mode skips; this reports the same drift by name and counts only.
- name: Report AppRoles whose TTL or bounds would be retuned in check mode
  vars: &approle_bounds_vars
    ansible_become: "{{ openbao_cli_become }}"
    approle_cli_parameters: "{{ openbao_approle_cli_parameters[item.0.name] }}"
    approle_cidr_class: "{{ openbao_approle_cidr_class_map[item.0.name] }}"
    approle_bound_cidrs: "{{ approle_cli_parameters.secret_id_bound_cidrs }}"
    live: "{{ (item.1.stdout | default('{}') | from_json).data | default({}) }}"
    token_type_drift: >-
      {{ (live.token_type | default('default')) != approle_cli_parameters.token_type }}
    token_explicit_max_ttl_drift: >-
      {{ (live.token_explicit_max_ttl | default(0) | int)
         != (approle_cli_parameters.token_explicit_max_ttl
             | community.general.to_seconds | int) }}
    desired_secret_id_ttl_s: >-
      {{ approle_cli_parameters.secret_id_ttl | community.general.to_seconds }}
    desired_token_ttl_s: >-
      {{ approle_cli_parameters.token_ttl | community.general.to_seconds }}
    desired_token_max_ttl_s: >-
      {{ approle_cli_parameters.token_max_ttl | community.general.to_seconds }}
    desired_bound_cidrs: >-
      {{ approle_bound_cidrs | split(',') | map('trim')
         | reject('equalto', '') | sort | list }}
    # An empty desired list means "unbound" ONLY for the class that declares
    # itself unbound. Everywhere else empty means the CIDR env vars were not
    # supplied on this run -- the documented allow-unbound bootstrap mode --
    # and treating that as drift would make a routine converge STRIP the
    # bindings off every existing role, which is the opposite of this gate's
    # job. `default([], true)` and not `default([])`: OpenBao returns JSON null
    # for an unset bound-CIDR field, which is defined and would slip through.
    # OpenBao stores a single-address /32 token bind as the bare address, so
    # both sides compare with a trailing /32 removed.
    desired_bound_cidrs_cmp: >-
      {{ desired_bound_cidrs | map('regex_replace', '/32$', '') | sort | list }}
    cidr_drift: >-
      {{ (desired_bound_cidrs | length > 0 or approle_cidr_class == 'unbound')
         and ((live.secret_id_bound_cidrs | default([], true) | map('trim')
               | map('regex_replace', '/32$', '') | sort | list != desired_bound_cidrs_cmp)
              or (live.token_bound_cidrs | default([], true) | map('trim')
                  | map('regex_replace', '/32$', '') | sort | list != desired_bound_cidrs_cmp)) }}
    ttl_or_uses_drift: >-
      {{ (live.secret_id_ttl | default(0) | int != desired_secret_id_ttl_s | int)
         or (live.secret_id_num_uses | default(0) | int
             != approle_cli_parameters.secret_id_num_uses | int)
         or (live.token_ttl | default(0) | int != desired_token_ttl_s | int)
         or (live.token_max_ttl | default(0) | int != desired_token_max_ttl_s | int) }}
    approle_bounds_drift: >-
      {{ (ttl_or_uses_drift | bool)
         or (token_explicit_max_ttl_drift | bool)
         or (token_type_drift | bool)
         or (cidr_drift | bool) }}
  ansible.builtin.debug:
    msg: >-
      {{ item.0.name }},
      live_secret_id_bound_entries={{ live.secret_id_bound_cidrs | default([], true) | length }},
      live_token_bound_entries={{ live.token_bound_cidrs | default([], true) | length }},
      declared_bound_entries={{ desired_bound_cidrs | length }},
      ttl_or_uses={{ 'true' if (ttl_or_uses_drift | bool) else 'false' }},
      token_type={{ 'true' if (token_type_drift | bool) else 'false' }},
      token_explicit_max_ttl={{ 'true' if (token_explicit_max_ttl_drift | bool) else 'false' }},
      bound_ranges={{ 'true' if (cidr_drift | bool) else 'false' }}
  changed_when: true
  loop: >-
    {{ (openbao_approle_config_targets | default(openbao_manageable_approles))
       | zip(openbao_approle_checks.results | default([])) | list }}
  loop_control:
    # Load-bearing: without this label, debug prints the full loop item, including the read's stdout.
    label: "{{ item.0.name }}"
  when:
    - ansible_check_mode
    - openbao_bootstrap_token is defined
    - (item.1.rc | default(1)) == 0
    - approle_bounds_drift | bool

- name: Reconcile AppRole TTL and token bounds on existing AppRoles
  vars: *approle_bounds_vars
  ansible.builtin.command:
    cmd: >-
      bao write auth/approle/role/{{ item.0.name }}
      token_policies={{ approle_cli_parameters.token_policies }}
      bind_secret_id={{ approle_cli_parameters.bind_secret_id }}
      token_ttl={{ approle_cli_parameters.token_ttl }}
      token_max_ttl={{ approle_cli_parameters.token_max_ttl }}
      token_explicit_max_ttl={{ approle_cli_parameters.token_explicit_max_ttl }}
      token_type={{ approle_cli_parameters.token_type }}
      secret_id_ttl={{ approle_cli_parameters.secret_id_ttl }}
      secret_id_num_uses={{ approle_cli_parameters.secret_id_num_uses }}
      {{ ('secret_id_bound_cidrs=' ~ approle_cli_parameters.secret_id_bound_cidrs ~
          ' token_bound_cidrs=' ~ approle_cli_parameters.token_bound_cidrs)
         if (approle_cli_parameters.secret_id_bound_cidrs | length > 0) else '' }}
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  loop: >-
    {{ (openbao_approle_config_targets | default(openbao_manageable_approles))
       | zip(openbao_approle_checks.results | default([])) | list }}
  loop_control:
    label: "{{ item.0.name }}"
  no_log: true
  changed_when: true
  when:
    - openbao_bootstrap_token is defined
    - (item.1.rc | default(1)) == 0
    - approle_bounds_drift | bool
