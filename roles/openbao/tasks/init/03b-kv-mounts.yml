---
- name: Select declared KV mount objects
  ansible.builtin.import_tasks: select-objects.yml
  vars:
    openbao_select_kind: kv_mounts
    openbao_select_candidates: "{{ openbao_select_profiles.kv_mounts.candidates }}"

- name: Keep the selected KV mount objects
  ansible.builtin.set_fact:
    openbao_kv_mount_targets: "{{ openbao_object_targets }}"

- name: Assert the declared KV mounts are distinct and outside the control plane
  ansible.builtin.assert:
    that:
      - (openbao_kv_mounts | map(attribute='path') | list | unique | length)
        == (openbao_kv_mounts | length)
      # Restricted mounts come from the run environment: one lowercase segment each.
      - openbao_kv_mounts | map(attribute='path')
        | reject('match', '^[a-z0-9][a-z0-9-]*$') | list | length == 0
      - openbao_kv_mounts | map(attribute='path') | map('lower')
        | select('in', openbao_ai_forbidden_subtrees) | list | length == 0
      - openbao_github_enterprise_owner_mount not in
        (openbao_kv_mounts | map(attribute='path') | list)
      - openbao_agent_tier_mount not in
        (openbao_kv_mounts | map(attribute='path') | list)
      - openbao_agent_tier_mount != openbao_github_enterprise_owner_mount
      - openbao_agent_tier_mount not in openbao_ai_forbidden_subtrees
    fail_msg: >-
      openbao_kv_mounts declares a duplicate mount path, a path that is not one
      lowercase segment, or a control-plane path, or a dedicated mount overlaps
      a shared KV mount or control-plane path.
      Refusing to enable — a duplicate would make one tier's policies reach
      another's data, which is the whole reason these are separate mounts.
    success_msg: "KV mounts are distinct and the enterprise-owner mount is isolated."

- name: Report KV mounts that would be enabled in check mode
  ansible.builtin.debug:
    msg: "KV v2 mount {{ item.path }} would be enabled."
  loop: "{{ openbao_kv_mounts }}"
  loop_control:
    label: "{{ item.path }}"
  when:
    - ansible_check_mode
    - item.path in (openbao_kv_mount_targets | map(attribute='name') | list)
    - (item.path ~ '/') not in (openbao_mounts_raw.stdout | from_json).keys()

- name: Enable the declared KV v2 mounts (add-if-missing)
  ansible.builtin.command:
    cmd: "bao secrets enable -path={{ item.path }} -version=2 kv"
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  loop: "{{ openbao_kv_mounts }}"
  loop_control:
    label: "{{ item.path }}"
  no_log: true
  changed_when: true
  when:
    - item.path in (openbao_kv_mount_targets | map(attribute='name') | list)
    - (item.path ~ '/') not in (openbao_mounts_raw.stdout | from_json).keys()

# Version retention, for the mounts that declare one. Runs AFTER the enable
# above so a mount created in this same run is tuned immediately rather than
# spending its first converge on the KV v2 default.
- name: Read the current version-retention config of each tuned KV mount
  ansible.builtin.command:
    cmd: "bao read -format=json {{ item.path }}/config"
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  loop: "{{ openbao_kv_tuned_mounts }}"
  loop_control:
    label: "{{ item.path }}"
  register: openbao_kv_config_checks
  no_log: true
  changed_when: false
  check_mode: false
  failed_when: false
  when: item.path in (openbao_kv_mount_targets | map(attribute='name') | list)

# A DENIED read is not an UNSET retention. Both return a non-zero rc under the
# `failed_when: false` above, and the write below treats any non-zero rc as
# "retention not configured" -- firing a privileged write against a mount this
# identity cannot read.
- name: FAIL -- the retention read was DENIED, so "unset" cannot be concluded
  vars:
    _denied: >-
      {{ openbao_kv_config_checks.results | default([])
         | rejectattr('skipped', 'defined')
         | selectattr('rc', 'defined') | rejectattr('rc', 'equalto', 0)
         | rejectattr('stderr', 'search', openbao_absent_stderr_marker)
         | map(attribute='item') | map(attribute='path') | list }}
  ansible.builtin.fail:
    msg: >-
      The version-retention read failed for these mounts without saying
      "{{ openbao_absent_stderr_marker }}", so their retention is NOT known to
      be unset: {{ _denied | join(', ') }}. A denied read says NOTHING about the
      stored config, and concluding "unset" from it fires a privileged write
      against a mount this identity cannot read.
  when: _denied | length > 0

# delete_version_after is left alone on purpose: its default of 0 means
# versions never time-expire, and history that silently ages out cannot be
# rolled back to. max_versions alone bounds the growth.
- name: Set KV v2 version retention on the tuned mounts (write-if-changed)
  ansible.builtin.command:
    cmd: "bao write {{ item.0.path }}/config max_versions={{ item.0.max_versions | int }}"
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  loop: >-
    {{ openbao_kv_tuned_mounts
       | zip(openbao_kv_config_checks.results | default([])) | list }}
  loop_control:
    label: "{{ item.0.path }}"
  no_log: true
  changed_when: true
  when:
    # A skipped read belongs to an unselected mount and must not be written.
    - item.0.path in (openbao_kv_mount_targets | map(attribute='name') | list)
    # absence only -- a denied read is caught by the arm above and must never
    # reach a privileged write
    - >-
      (item.1.rc | default(1)) == 0
      or openbao_absent_stderr_marker in (item.1.stderr | default(''))
    - >-
      (item.1.rc | default(1)) != 0
      or ((item.1.stdout | default('{}', true) | from_json).data.max_versions
          | default(0, true) | int) != (item.0.max_versions | int)
