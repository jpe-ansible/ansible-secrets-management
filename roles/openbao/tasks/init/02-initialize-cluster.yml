---
- name: Parse workstation SSH key reader declarations before object composition
  ansible.builtin.import_tasks: 00-validate-workstation-ssh-key-hosts.yml

- name: Initialize OpenBao (recovery keys via static-key auto-unseal)
  ansible.builtin.command:
    cmd: >-
      bao operator init
      -recovery-shares={{ openbao_recovery_shares }}
      -recovery-threshold={{ openbao_recovery_threshold }}
      -format=json
  environment:
    BAO_ADDR: "{{ openbao_api_addr }}"
  register: openbao_init_raw
  no_log: true
  changed_when: true
  when: openbao_do_fresh_init

- name: Capture init result
  ansible.builtin.set_fact:
    openbao_init: "{{ openbao_init_raw.stdout | from_json }}"
  no_log: true
  when: openbao_do_fresh_init

# Break-glass: write recovery shares + root token to a 0600 file ON THE
# CONTROLLER (gitignored), then shout at the operator to move it to paper.
- name: Write break-glass recovery material to controller (0600)
  ansible.builtin.copy:
    content: "{{ openbao_init | to_nice_json }}\n"
    dest: "{{ openbao_recovery_file }}"
    mode: "0600"
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  no_log: true
  when: openbao_do_fresh_init

- name: WARN — copy recovery material to paper, then delete the file
  ansible.builtin.debug:
    msg: >-
      ============================================================
      OpenBao cluster INITIALIZED on the bootstrap node
      {{ inventory_hostname }}. Recovery shares + the initial root
      token were written to:
        {{ openbao_recovery_file }}
      (0600, on this controller, gitignored). COPY the
      recovery shares to PAPER, store them offline split across
      custodians, then SECURELY DELETE this file. With static-key
      auto-unseal the recovery shares are the break-glass path if
      the seal key is ever lost. Do NOT commit it. Do NOT leave it
      on disk.
      ============================================================
  when: openbao_do_fresh_init

# Root token: from this run's init output on the FIRST bootstrap. On a cluster
# that's already initialized, provisioning (new policies/AppRoles) only runs
# if the operator supplies a privileged token out-of-band via
# OPENBAO_PROVISIONING_TOKEN — without one, every step below skips
# cleanly, so a routine converge that isn't adding RBAC stays a no-op.
- name: Set the bootstrap token for provisioning (first init)
  ansible.builtin.set_fact:
    openbao_bootstrap_token: "{{ openbao_init.root_token }}"
  no_log: true
  when: openbao_do_fresh_init

- name: Use the supplied provisioning token against a live cluster
  ansible.builtin.set_fact:
    openbao_bootstrap_token: "{{ openbao_provisioning_token }}"
  no_log: true
  when:
    - openbao_status.initialized
    - openbao_provisioning_token | length > 0

- name: Keep the admin-window identity out of the token environment
  ansible.builtin.set_fact:
    openbao_bootstrap_token: ""
  changed_when: false
  when:
    - openbao_status.initialized
    - openbao_window_proxy_mode | default(false) | bool

# A supplied ai-admin-session token is distinguishable by its existing policy
# set. Read only this token's own metadata; a partial/legacy guarded session
# must fail closed instead of falling through to the broad provisioning path.
- name: Look up the supplied token's own policies
  ansible.builtin.command:
    cmd: bao read -format=json auth/token/lookup-self
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  register: openbao_supplied_token_lookup
  no_log: true
  check_mode: false
  changed_when: false
  failed_when: false
  when:
    - openbao_status.initialized
    - openbao_provisioning_token | length > 0 or openbao_window_proxy_mode | default(false) | bool

- name: FAIL — the supplied provisioning token policy set could not be verified
  ansible.builtin.fail:
    msg: >-
      OpenBao could not verify the supplied token with auth/token/lookup-self.
      No provisioning or selected RBAC writes were attempted.
  when:
    - openbao_supplied_token_lookup is defined
    - not (openbao_supplied_token_lookup.skipped | default(false))
    - (openbao_supplied_token_lookup.rc | default(1)) != 0

- name: Resolve whether the supplied token is the ai-admin-session window
  ansible.builtin.set_fact:
    openbao_ai_admin_window_policies: "{{ _lookup.get('data', {}).get('policies', []) }}"
    openbao_ai_admin_window_mode: >-
      {{ openbao_ai_admin_guard_policy_name in _lookup.get('data', {}).get('policies', [])
         and openbao_ai_admin_window_policy_name in _lookup.get('data', {}).get('policies', [])
         and openbao_ai_admin_policy_name in _lookup.get('data', {}).get('policies', [])
         and openbao_tofu_state_admin_policy_name in _lookup.get('data', {}).get('policies', []) }}
  vars:
    _lookup: "{{ openbao_supplied_token_lookup.stdout | from_json }}"
  no_log: true
  changed_when: false
  when:
    - openbao_supplied_token_lookup is defined
    - not (openbao_supplied_token_lookup.skipped | default(false))
    - (openbao_supplied_token_lookup.rc | default(1)) == 0

- name: FAIL — a partial admin-window policy set is present
  ansible.builtin.assert:
    that:
      - >-
        (openbao_ai_admin_guard_policy_name not in openbao_ai_admin_window_policies
         and openbao_ai_admin_window_policy_name not in openbao_ai_admin_window_policies)
        or (openbao_ai_admin_guard_policy_name in openbao_ai_admin_window_policies
            and openbao_ai_admin_window_policy_name in openbao_ai_admin_window_policies
            and openbao_ai_admin_policy_name in openbao_ai_admin_window_policies
            and openbao_tofu_state_admin_policy_name in openbao_ai_admin_window_policies)
    fail_msg: >-
      This token carries only part of the current ai-admin-session policy set.
      Re-open ai-admin-session after its role policy attachment has been
      reconciled; this token cannot take the selected RBAC path.
    quiet: true
  when:
    - openbao_ai_admin_window_policies is defined
    - >-
      openbao_ai_admin_guard_policy_name in openbao_ai_admin_window_policies
      or openbao_ai_admin_window_policy_name in openbao_ai_admin_window_policies

# In proxy mode the window itself is the identity; do not mint a reconcile token.
# Routine reconciliation. A change to the CONTENT of an already-declared policy
# needs no operator: openbao-reconcile owns exactly the names this repo declares
# and cannot reach the break-glass tiers or its own policy. Each routine run
# obtains a fresh target secret_id from approle-issuer and destroys it after the
# target login. Missing issuer credentials on an initialized cluster are fatal.
# Delegated, like every other vault_login in this repo (see
# the shared publish task): community.hashi_vault needs hvac, which
# lives in the controller's dev shell and NOT on the guests. Run on the guest it
# fails to import, and `failed_when: false` then turns that into a silent "ok"
# with no .login key -- indistinguishable from a rejected credential.
#
# openbao_api_addr is the node's own bind address and is not reachable from the
# controller, so a delegated login must use the ambient BAO_ADDR the runner
# already exports.
#
# ansible_become: false because a delegated task inherits the PLAY's become
# regardless of any task-level setting, and would otherwise try to escalate on
# the control node.
#
# check_mode: false on this chain: under --check vault_login returns an empty
# token, and the preview's check_mode: false reads below need a real one.
- name: Authenticate to the AppRole issuer for routine reconciliation
  community.hashi_vault.vault_login:
    url: "{{ openbao_reconcile_addr }}"
    auth_method: approle
    role_id: "{{ openbao_approle_issuer_role_id }}"
    secret_id: "{{ openbao_approle_issuer_secret_id }}"
  delegate_to: localhost
  vars:
    ansible_become: false
  register: openbao_reconcile_issuer_login
  no_log: true
  check_mode: false
  ignore_errors: true
  when:
    - openbao_status.initialized
    - openbao_provisioning_token | length == 0
    - not (openbao_window_proxy_mode | default(false) | bool)

- name: FAIL — the AppRole issuer could not authenticate
  ansible.builtin.fail:
    msg: >-
      AppRole issuer login failed on {{ inventory_hostname }}. No reconcile
      credential was minted; check the issuer declaration and caller source
      class before retrying.
  when:
    - openbao_reconcile_issuer_login is defined
    - not (openbao_reconcile_issuer_login.skipped | default(false))
    - (openbao_reconcile_issuer_login.login | default({})).auth is not defined

- name: Read the declared reconcile role_id through the issuer
  community.hashi_vault.vault_read:
    url: "{{ openbao_reconcile_addr }}"
    auth_method: token
    path: "auth/approle/role/{{ openbao_reconcile_approle_name }}/role-id"
    token: "{{ openbao_reconcile_issuer_login.login.auth.client_token }}"
  delegate_to: localhost
  vars:
    ansible_become: false
  register: openbao_reconcile_role_id_read
  no_log: true
  check_mode: false
  when:
    - openbao_status.initialized
    - openbao_provisioning_token | length == 0
    - not (openbao_window_proxy_mode | default(false) | bool)

- name: Mint a single-use reconcile secret_id through the issuer
  community.hashi_vault.vault_write:
    url: "{{ openbao_reconcile_addr }}"
    auth_method: token
    path: "auth/approle/role/{{ openbao_reconcile_approle_name }}/secret-id"
    data: {}
    token: "{{ openbao_reconcile_issuer_login.login.auth.client_token }}"
  delegate_to: localhost
  vars:
    ansible_become: false
  register: openbao_reconcile_secret_id_mint
  no_log: true
  check_mode: false
  when:
    - openbao_status.initialized
    - openbao_provisioning_token | length == 0
    - not (openbao_window_proxy_mode | default(false) | bool)

- name: Log in as openbao-reconcile with the single-use secret_id
  community.hashi_vault.vault_login:
    url: "{{ openbao_reconcile_addr }}"
    auth_method: approle
    role_id: "{{ openbao_reconcile_role_id_read.data.data.role_id }}"
    secret_id: "{{ openbao_reconcile_secret_id_mint.data.data.secret_id }}"
  delegate_to: localhost
  vars:
    ansible_become: false
  register: openbao_reconcile_login
  no_log: true
  check_mode: false
  ignore_errors: true
  when:
    - openbao_status.initialized
    - openbao_provisioning_token | length == 0
    - not (openbao_window_proxy_mode | default(false) | bool)

- name: Destroy the single-use reconcile secret_id by accessor
  ansible.builtin.uri:
    url: >-
      {{ openbao_reconcile_addr }}/v1/auth/approle/role/{{ openbao_reconcile_approle_name }}/secret-id-accessor/destroy
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_reconcile_issuer_login.login.auth.client_token }}"
    body_format: json
    body:
      secret_id_accessor: "{{ openbao_reconcile_secret_id_mint.data.data.secret_id_accessor }}"
    # The login above spent this num_uses=1 secret_id, and OpenBao has already
    # removed it with its accessor, so there is nothing left to destroy. That
    # one 500 is success; any other status or body still fails. failed_when
    # replaces the module's own status check, so a module failure is re-raised.
    status_code: [204, 500]
    return_content: true
  delegate_to: localhost
  vars:
    ansible_become: false
  register: openbao_reconcile_destroy
  changed_when: openbao_reconcile_destroy.status == 204
  failed_when: >-
    (openbao_reconcile_destroy.failed | default(false))
    or (openbao_reconcile_destroy.status | default(0) == 500
        and 'failed to find accessor entry for secret_id_accessor'
        not in (openbao_reconcile_destroy.content | default('')))
  no_log: true
  check_mode: false
  when:
    - openbao_status.initialized
    - openbao_provisioning_token | length == 0
    - not (openbao_window_proxy_mode | default(false) | bool)

- name: FAIL — the per-call reconcile credential could not authenticate
  ansible.builtin.fail:
    msg: >-
      The per-call openbao-reconcile login failed on {{ inventory_hostname }}.
      Its secret_id was revoked after the attempt. Check the issuer grant and
      the target role bounds for this caller.
  when:
    - openbao_reconcile_login is defined
    - not (openbao_reconcile_login.skipped | default(false))
    - (openbao_reconcile_login.login | default({})).auth is not defined

- name: Use the per-call reconcile token when it authenticated
  ansible.builtin.set_fact:
    openbao_bootstrap_token: "{{ openbao_reconcile_login.login.auth.client_token }}"
    openbao_reconcile_mode: true
  no_log: true
  when:
    - openbao_reconcile_login is defined
    - not (openbao_reconcile_login.skipped | default(false))
    - (openbao_reconcile_login.login | default({})).auth is defined

# Secret-zero presence IS the discriminator, so no marker file is needed:
#   creds absent  -> never bootstrapped        -> skip loudly (debug, below)
#   creds present -> login MUST succeed        -> anything else is a regression
# Failing red here is the point. A warn-and-continue leaves RBAC silently
# unreconciled while the recap still reads failed=0 — the exact false green
# this whole path exists to remove.
- name: FAIL — the reconcile identity was configured but could not authenticate
  ansible.builtin.fail:
    msg: >-
      OpenBao reconcile login returned no token on {{ inventory_hostname }},
      so RBAC was NOT reconciled. A configured AppRole pair failed to
      authenticate.
      What the store actually said:
      {{ (openbao_reconcile_login.msg | default('(no message -- the module did not run)'))
         | regex_replace('\\s+', ' ') }}
      Read that message first; it distinguishes a rejected credential from an
      endpoint the CONTROLLER cannot reach, which is where this login is
      delegated. A rejection on source-address grounds is the CIDR class doing
      its job and means this identity may not reconcile from HERE -- do not add
      a range to get past it.
      The stored reconcile pair is not read. Check this CONVERGE pair or the
      per-call approle-issuer credentials for this controller.
  when:
    - openbao_reconcile_login is defined
    - not (openbao_reconcile_login.skipped | default(false))
    - (openbao_reconcile_login.login | default({})).auth is not defined

- name: Resolve whether this run uses the bounded RBAC path
  ansible.builtin.set_fact:
    openbao_bounded_rbac_mode: >-
      {{ (openbao_reconcile_mode | default(false) | bool)
         or (openbao_ai_admin_window_mode | default(false) | bool) }}
  changed_when: false

# Resolve the identity-specific candidates before policy-sync. The session's
# first selection pass is deliberately early: it validates every requested
# target and capability before the reconcile policy can be written.
- name: Resolve the RBAC set this run's identity may manage
  ansible.builtin.set_fact:
    openbao_manageable_policies: >-
      {{ openbao_ai_admin_window_manageable_policies
         if (openbao_ai_admin_window_mode | default(false) | bool)
         else (openbao_policies
               if not (openbao_reconcile_mode | default(false))
               else (openbao_policies
                     | rejectattr('name', 'in', openbao_reconcile_policy_excluded_names)
                     | list)) }}
    openbao_manageable_approles: >-
      {{ openbao_ai_admin_window_manageable_approles
         if (openbao_ai_admin_window_mode | default(false) | bool)
         else (openbao_approles
               if not (openbao_reconcile_mode | default(false))
               else (openbao_approles
                     | rejectattr('manage_secret_id', 'defined')
                     | rejectattr('name', 'in', openbao_reconcile_excluded_policies)
                     | list)) }}
  when: openbao_bootstrap_token is defined

- name: Require an explicit bounded selection for ai-admin-session
  ansible.builtin.assert:
    that:
      - openbao_select | default({}) is mapping
      - openbao_select | default({}) | length > 0
      - >-
        openbao_select | default({}) | difference([
          'policies', 'approles', 'reconcile_policy', 'kv_mounts', 'ssh_roles',
          'github_app_mounts', 'github_oidc_roles'])
        | length == 0
    fail_msg: >-
      ai-admin-session accepts only a nonempty openbao_select containing
      policies, approles, reconcile_policy, kv_mounts, ssh_roles,
      github_app_mounts, and/or github_oidc_roles. It cannot run the full
      provisioning path.
    quiet: true
  when: openbao_ai_admin_window_mode | default(false) | bool

- name: Resolve ai-admin-session selections and grants before policy-sync
  ansible.builtin.import_tasks: selection-preflight.yml
  when: openbao_ai_admin_window_mode | default(false) | bool

# The policy-sync render reads openbao_policies, which includes the
# arrangement policies only once the arrangement document is loaded.
- name: Load the arrangement document before the policy-sync render
  ansible.builtin.import_tasks: 07z-load-arrangement.yml

# Resolves openbao_write_addr (the Raft leader) and runs the policy-sync
# ask-and-rewrite pair, right after the reconcile login above -- BEFORE any
# other init step consumes a reconcile grant for a newly declared name (see
# init/02b-policy-sync.yml for the full reasoning). Split into its own file
# purely to keep this file under the repo's per-file token-limit gate.
- name: Resolve the Raft leader and sync the reconcile policy before any grant consumer runs
  ansible.builtin.import_tasks: 02b-policy-sync.yml

- name: Resolve all object selections before phase writes
  ansible.builtin.import_tasks: selection-preflight.yml
  when:
    - openbao_bootstrap_token is defined
    - not (openbao_ai_admin_window_mode | default(false) | bool)

- name: Report that this run reconciles as the least-privilege identity
  ansible.builtin.debug:
    msg: >-
      OpenBao RBAC reconciling on {{ inventory_hostname }} as openbao-reconcile
      (no operator token): {{ openbao_manageable_policies | length }} of
      {{ openbao_policies | length }} policies and
      {{ openbao_manageable_approles | length }} of
      {{ openbao_approles | length }} AppRoles are in scope. The remainder are
      the break-glass and inert human-gated tiers, which this identity cannot
      write BY DESIGN -- a change to one of those needs a run with
      OPENBAO_PROVISIONING_TOKEN.
  when: openbao_reconcile_mode | default(false)

# Skipping provisioning is the intended default for a routine converge, but it
# is indistinguishable from having provisioned: every gated step below reports
# neither ok nor changed, and the play recap is green either way. That silence
# is what makes a NEWLY DECLARED policy, AppRole or generated app secret look
# applied when it was never written -- the consumer then fails somewhere else
# entirely, pointing at OpenBao rather than at the converge that skipped.
#
# One line, always, naming what was not reconciled. Cheap on a routine run and
# the only signal on the run that mattered.
- name: Report that provisioning was skipped for want of a token
  ansible.builtin.debug:
    msg: >-
      OpenBao provisioning SKIPPED on {{ inventory_hostname }}: no
      OPENBAO_PROVISIONING_TOKEN and this is not a fresh init, so policies,
      AppRoles and app secrets were NOT reconciled
      ({{ openbao_seeded_generated_app_secrets | length }} generated-secret
      apps, {{ openbao_promoted_app_secrets | default({}) | length }} promoted,
      {{ openbao_policies | default([]) | length }} policies left untouched).
      Routine reconciliation is supposed to happen WITHOUT a provisioning token,
      as the per-call openbao-reconcile identity. Reaching this message on an
      initialized cluster means issuer credentials were not supplied; this run
      cannot reconcile declarations and must not be treated as successful.
  when: openbao_bootstrap_token is not defined

# --- KV v2 mount (add-if-missing) -------------------------------------------
# (openbao_write_addr is resolved earlier in this file, right after the
# reconcile login -- the policy-sync pair needs it too.)

# --- Where the bao CLI runs ----------------------------------------------------
# Every `bao` invocation from here on is one module execution against the
# target, and each one pays the flat per-task transport cost ansible.cfg
# documents (~6s on proxmox_pct_remote). The provisioning loops below run
# ~150 of them on a single host on a converge that changes nothing --
# measured at 559s for the policy reads and 328s for the AppRole checks
# alone. The controller has the same `bao` binary (scripts/run-ansible.sh
# drives it) and, via BAO_ADDR, reaches the ingress name that health-checks
# to the ACTIVE node, so a delegated call also skips the standby-forward hop
# openbao_write_addr exists to work around. Same CLI, same rc/stdout/stderr,
# so every changed_when, when and denied-vs-absent guard reads unchanged.
#
# The switch itself (openbao_cli_host / _addr / _become) is a role default,
# not a fact -- see defaults/main/00-install-and-node.yml for why.
- name: Report where this run's bao invocations run from
  ansible.builtin.debug:
    msg: >-
      OpenBao provisioning for {{ inventory_hostname }} runs the bao CLI on
      {{ openbao_cli_host }} against {{ openbao_cli_addr }}.
