---
- name: Assert RBAC policy declaration invariants
  ansible.builtin.import_tasks: 08-policy-declaration-assertions.yml

# The policy-sync pair (ask capability + rewrite the reconcile policy from
# the declared set) now runs in init/02-initialize-cluster.yml, immediately
# after the reconcile login succeeds -- BEFORE init/07 (SSH signing roles)
# and init/10 (AppRoles) consume a reconcile grant for a newly declared name.
# Running it here, after those steps, was the chicken-and-egg this repo hit
# live: a 403 in init/07 against a stale reconcile policy aborted the play
# before this pair ever got a chance to bring that policy up to date.
#
# A reconcile-mode run may manage only what its OWN policy grants. That policy
# is excluded from the set reconcile can rewrite (it cannot widen its own
# grants), so the live policy drifts BEHIND the declared set the moment a new
# policy is declared -- and every read/write of the new name then 403s.
#
# Ask the server what this token can actually do rather than inferring it from
# the declared set, and fail LOUDLY naming the shortfall. Silently narrowing to
# what happens to work is the exact false green this block exists to prevent:
# a declared policy would never be written and nothing would say so.
# The prefix is added by matching '^' rather than capturing the whole name and
# substituting \1. A backreference does not survive the trip: YAML, Jinja and
# `command`'s shlex.split each get a say in what a backslash means, and the net
# effect was that all 60 paths rendered as the single literal
# `sys/policies/acl/1` -- a policy that does not exist, so the server answered
# `deny` and the gate concluded the identity could write nothing. It had never
# once asked about a real path.
- name: Ask the server which declared policies this identity may actually write
  ansible.builtin.command:
    cmd: >-
      bao write -format=json sys/capabilities-self
      {{ openbao_manageable_policies
         | map(attribute='name')
         | map('regex_replace', '^', 'paths=sys/policies/acl/')
         | join(' ') }}
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  register: openbao_policy_capabilities
  check_mode: false
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - openbao_bootstrap_token is defined
    - openbao_bounded_rbac_mode | default(false) | bool

# sys/capabilities-self returns the per-path capability lists BOTH at the top
# level and under `data`, and which of the two a given client surfaces is not
# something to bet a hard failure on. Reading only `data` yielded an empty dict
# against a live policy that demonstrably grants create/read/update on every
# path asked about -- and an empty dict reads as "denied everything", so the
# gate blocked a converge that should have proceeded.
- name: Resolve what the server said this identity may write
  ansible.builtin.set_fact:
    openbao_policy_caps: >-
      {{ (_body.get('data', {}) | combine(_body)) | dict2items
         | selectattr('key', 'match', '^sys/policies/acl/') | items2dict }}
  vars:
    _body: "{{ openbao_policy_capabilities.stdout | default('{}') | from_json }}"
  # Keep only real policy paths, rather than removing a hand-listed set of
  # envelope keys. The response also carries `capabilities`, `mount_type`,
  # `mount_class` and friends, and any future field would join them -- a
  # denylist would have to grow to stay correct. A stray key surviving here
  # would be compared against declared policy NAMES below (the prefix is
  # stripped, not filtered, at that point), so a collision would mark a policy
  # writable that is not: a false green in the guard built to prevent one.
  when:
    - openbao_bootstrap_token is defined
    - openbao_bounded_rbac_mode | default(false) | bool
    - (openbao_policy_capabilities.rc | default(1)) == 0

# An uninformative probe is NOT a denial. If the response carried capability
# entries for FEWER paths than were asked about, the probe itself is broken (a
# shape change, a malformed request) and reading the gap as a permission finding
# would be a confident false red -- the same absent-vs-denied confusion this
# whole block exists to eliminate. Fail, but say which failure it is.
#
# The count, not merely zero: the backreference bug asked about one literal path
# and got ONE well-formed entry back, so a `== 0` arm did not fire and the gate
# went on to report a unanimous false denial. A short answer is the direct
# signature of a probe that asked the wrong question, and neither a zero-check
# nor a type-check sees it -- the values were valid capability lists, just for a
# path nobody declared.
- name: FAIL -- the capability probe did not answer about every path it asked about
  ansible.builtin.fail:
    msg: >-
      Asked sys/capabilities-self about
      {{ openbao_manageable_policies | length }} policy paths and the response
      carried a capability entry for only
      {{ openbao_policy_caps | default({}) | length }} of them. That is a broken
      probe, not a permission finding -- do not read a short answer as "this
      identity may write nothing". Check the request shape and the response
      envelope before concluding anything about grants.
  when:
    - openbao_bootstrap_token is defined
    - openbao_bounded_rbac_mode | default(false) | bool
    - (openbao_policy_capabilities.rc | default(1)) == 0
    - openbao_manageable_policies | length > 0
    - >-
      (openbao_policy_caps | default({}) | length)
      < (openbao_manageable_policies | length)

- name: Resolve which declared policies this identity may actually write
  ansible.builtin.set_fact:
    openbao_ungranted_policy_names: >-
      {{ openbao_manageable_policies | map(attribute='name') | reject('in',
         (_caps | dict2items
                | selectattr('value', 'contains', 'update')
                | map(attribute='key')
                | map('regex_replace', '^sys/policies/acl/', '')
                | list)) | list | sort }}
  vars:
    _caps: "{{ openbao_policy_caps | default({}) }}"
  when:
    - openbao_bootstrap_token is defined
    - openbao_bounded_rbac_mode | default(false) | bool
    - (openbao_policy_capabilities.rc | default(1)) == 0

# Everything that is NOT ungranted, so the render/write steps below act on
# only what this identity may actually write -- one ungranted name (e.g. a
# newly declared policy the live openbao-reconcile grant hasn't caught up
# with yet) no longer blocks the content update of every OTHER declared
# policy. Derived from the same ungranted list above, plus the policies that
# render no grants until their gating input is set (openbao_unscheduled_empty_policy_names).
- name: Resolve the RBAC policies this identity may actually write
  ansible.builtin.set_fact:
    openbao_reachable_policies: >-
      {{ openbao_manageable_policies
         | rejectattr('name', 'in', (openbao_ungranted_policy_names | default([]))
                                    + (openbao_unscheduled_empty_policy_names | default([])))
         | list }}
  when: openbao_bootstrap_token is defined

- name: Select RBAC policy objects
  ansible.builtin.import_tasks: select-objects.yml
  vars:
    openbao_select_kind: policies
    openbao_select_declared_candidates: "{{ openbao_policies }}"
    openbao_select_candidates: >-
      {{ openbao_reachable_policies | default(openbao_manageable_policies | default(openbao_policies)) }}

- name: Keep the selected RBAC policy objects
  ansible.builtin.set_fact:
    openbao_rbac_policy_targets: "{{ openbao_object_targets }}"

# Rendered on the CONTROLLER, not the target. The previous shape wrote each
# policy to the guest with `template`, read it back with `slurp`, and deleted it
# again -- three remote round trips per policy purely to move content this
# process already had in memory. Over 60 policies that is 180 operations on a
# proxmox_pct_remote connection, and each one is a full paramiko connect plus a
# `pct exec`: the render step alone measured 776 SECONDS (12.9 min, ~13s per
# policy) writing a few KB per file.
#
# `lookup('template', ...)` resolves against the same role templates/ directory
# the module used and renders with the same variable context, so the content is
# identical -- it just never leaves the controller. The write below feeds it to
# `bao policy write` on stdin, so no file is created and none has to be cleaned
# up. Remote operations for this phase: 180 -> 0.
# A per-item `combine` here re-copies the whole accumulated dict on every
# iteration (O(n^2) over ~60 policies). Appending {key, value} pairs to a
# plain list is O(1) per item; items2dict builds the final dict once.
#
# `item` inside the for-loop below is a Jinja loop variable local to THIS
# expression's own render pass -- it is never added to the task's vars, which
# is the context `lookup('template', ...)` hands to the sub-template it
# renders. A policy template that references `item` (terrakube-workspace-
# policy.hcl.j2 does, for `item.workspace.name`) therefore renders against a
# context where `item` was never set, failing with "'item' is undefined".
# `template_vars` injects it into that sub-render explicitly.
- name: Render the RBAC policies on the controller
  ansible.builtin.set_fact:
    openbao_rendered_policy_map: "{{ _openbao_rendered_policy_pairs | items2dict }}"
  vars:
    _openbao_rendered_policy_pairs: >-
      {%- set _pairs = [] -%}
      {%- for item in openbao_rbac_policy_targets -%}
      {%- set _rendered = lookup('template', item.template, template_vars={'item': item}) | trim -%}
      {%- set _ = _pairs.append({'key': item.name, 'value': _rendered}) -%}
      {%- endfor -%}
      {{ _pairs }}
  no_log: true
  when: openbao_bootstrap_token is defined

# The docs-publisher permission set only materializes when its repository
# list is non-empty (see openbao_github_docs_publisher_permission_sets); when
# the env var is unset the set drops out of openbao_github_permission_sets
# entirely, and github-docs-publisher-policy.hcl.j2's loop then has nothing to
# emit. The assert below refuses to WRITE that empty render; this is the
# separate visibility half, naming the input so the cause is not left to be
# guessed from the assert failure alone.
- name: Warn when the docs-publisher repo list is unset (its policy set drops out of the render)
  ansible.builtin.debug:
    msg: >-
      OPENBAO_GITHUB_DOCS_PUBLISHER_REPOS is unset -- the docs-publisher
      GitHub permission set is omitted from openbao_github_permission_sets,
      so any policy template that only emits paths for that set (e.g.
      github-docs-publisher-policy.hcl.j2) renders with no grants. Set the
      env var (Doppler) to restore it, or leave it unset deliberately if the
      publisher identity is not yet meant to exist.
  when:
    - openbao_bootstrap_token is defined
    - openbao_github_docs_publisher_repos | default([]) | length == 0

- name: Warn when the media external path list is unset or has rejected entries
  ansible.builtin.debug:
    msg: >-
      OPENBAO_MEDIA_EXTERNAL_PATHS is unset or has entries that are not
      <service>/<instance>/<ro|rw|admin> ({{ openbao_media_external_paths_raw | length
      - openbao_media_external_paths | length }} rejected). media-policy.hcl.j2 grants
      only the valid entries, so the media converge cannot read the rest. Set it in
      config/platform/ansible/env.
  when:
    - openbao_bootstrap_token is defined
    - (openbao_media_external_paths | length == 0)
      or (openbao_media_external_paths_raw | length != openbao_media_external_paths | length)

- name: Warn when org-secrets extra read paths contain rejected entries
  ansible.builtin.debug:
    msg: >-
      OPENBAO_GITHUB_ORG_SECRETS_READ_PATHS has
      {{ openbao_github_org_secrets_extra_read_paths_raw | length
         - openbao_github_org_secrets_extra_read_paths | length }} rejected entries.
      The policy grants only exact <mount>/<path> leaves on the config, secret,
      and secrets-external mounts.
  when:
    - openbao_bootstrap_token is defined
    - openbao_github_org_secrets_extra_read_paths_raw | length
      != openbao_github_org_secrets_extra_read_paths | length

- name: Warn when the CI resolver repo list is unset (its policy set drops out of the render)
  ansible.builtin.debug:
    msg: >-
      OPENBAO_GITHUB_CI_RESOLVER_REPOS is unset -- the ci-resolver GitHub
      permission set is omitted from openbao_github_permission_sets, so
      github-ci-resolver-policy.hcl.j2 renders with no grants and the policy is
      not written. Set the env var to restore it, or leave it unset
      deliberately if the identity is not yet meant to exist.
  when:
    - openbao_bootstrap_token is defined
    - openbao_github_ci_resolver_repos | default([]) | length == 0

- name: Warn when PR reconcile configuration is incomplete
  ansible.builtin.debug:
    msg: >-
      The pr-reconcile-sweep role and policy are not declared until both
      OPENBAO_GITHUB_PR_RECONCILE_REPOSITORY and OPENBAO_GITHUB_PR_RECONCILE_OWNERS are set;
      an existing role and policy of that name are removed by this converge.
  when:
    - openbao_bootstrap_token is defined
    - not (openbao_github_pr_reconcile_enabled | bool)

# `bao policy write <name> -` REPLACES the whole stored ACL document; there is
# no merge. A policy template whose only content is conditional on some other
# input (a permission set, a workspace list, ...) renders as comment lines
# with no `path` stanza when that input is empty -- and the write task above
# would then happily overwrite a live policy with a document that grants
# nothing, reporting success. Refuse before that write ever runs, for EVERY
# policy scheduled to be written, not one hardcoded name: a future
# conditionally-rendered policy is covered by construction. In selective mode,
# the selection is resolved before rendering, so only selected policy templates
# are evaluated and checked.
- name: Assert no scheduled RBAC policy rendered empty
  ansible.builtin.assert:
    that:
      - _openbao_empty_rendered_policies | length == 0
    fail_msg: >-
      {{ _openbao_empty_rendered_policies | length }} RBAC polic{{ 'y' if
      _openbao_empty_rendered_policies | length == 1 else 'ies' }} rendered
      with no `path` stanza and would REPLACE the live stored policy with an
      empty document ({{ _openbao_empty_rendered_policies | join(', ') }}).
      Likely cause: a gating input this policy's template loops over (a
      permission set, workspace list, or similar, often built from an env
      var) resolved empty at render time. Fix the input, or if the policy is
      genuinely meant to grant nothing, remove it from
      openbao_reachable_policies instead of writing an empty ACL.
    success_msg: >-
      All {{ openbao_rbac_policy_targets | length }} scheduled RBAC policies
      rendered with at least one path stanza.
  vars:
    _openbao_rendered: "{{ openbao_rendered_policy_map | default({}) }}"
    _openbao_non_empty_names: >-
      {{ _openbao_rendered | dict2items
         | selectattr('value', 'search', 'path\s+"')
         | map(attribute='key') | list }}
    _openbao_empty_rendered_policies: >-
      {{ openbao_rbac_policy_targets | map(attribute='name') | list
         | reject('in', _openbao_non_empty_names) | list | sort }}
  when: openbao_bootstrap_token is defined

# The window guard denies the AppRole collection listing this audit needs.
# Keep the audit for full and reconcile runs; the window selection is validated
# against its exact grants before writes.
- name: Refuse live objects that collide with roster agent names
  ansible.builtin.import_tasks: 08a-roster-live-collisions.yml
  when:
    - openbao_ai_agents | length > 0
    - not (openbao_ai_admin_window_mode | default(false) | bool)

- name: Read the stored RBAC policies and write what differs
  ansible.builtin.import_tasks: 08b-rbac-policy-writes.yml

# The capability probe earlier in this file found every declared policy this
# identity may write; the render/write steps just above acted on exactly that
# reachable subset. Only now -- after the reachable content update has
# happened -- does an ungranted name fail the run: writing the reachable
# subset must never be silently skipped in favor of a hard stop that leaves
# it, and everything after it, unwritten.
- name: FAIL -- the reconcile identity cannot manage every declared policy
  ansible.builtin.fail:
    msg: |
      The openbao-reconcile identity is declared as managing
      {{ openbao_manageable_policies | length }} policies but the live
      openbao-reconcile policy grants update on none of these
      {{ openbao_ungranted_policy_names | length }}:
      {{ openbao_ungranted_policy_names | join(', ') }}. Every other declared policy was written above.
      Reconcile CANNOT widen its own grants --
      openbao-reconcile is in openbao_reconcile_excluded_policies by design.
      These names need the human-gated path. Select them together, then re-run the converge:
      semaphore-run-ansible.sh --rail-sec=600 ./scripts/run-ansible.sh \
        playbooks/site.yml --tags openbao_rbac --limit openbao_group,localhost \
        --diff -e '{{ {"openbao_select": {"policies": openbao_ungranted_policy_names}} | to_json }}'
  when:
    - openbao_select | default({}) | length == 0
    - openbao_bootstrap_token is defined
    - openbao_bounded_rbac_mode | default(false) | bool
    - openbao_ungranted_policy_names | default([]) | length > 0

