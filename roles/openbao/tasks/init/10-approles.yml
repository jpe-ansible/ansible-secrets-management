---
# Both maps are lazy role defaults; every per-AppRole loop below reads them many
# times per item, so resolve them once into facts for the rest of the run.
- name: Resolve the AppRole class and CLI parameter maps once
  ansible.builtin.set_fact:
    openbao_approle_cidr_class_map: "{{ openbao_approle_cidr_class_map }}"
    openbao_approle_cli_parameters: "{{ openbao_approle_cli_parameters }}"
  no_log: true

# --- CIDR binding: fail on an empty class rather than create an unbound role --
# Every declared AppRole resolves to a named CIDR class (see
# 08b-cidr-and-unlock.yml). A class whose CIDRs were never supplied would silently
# produce exactly the unbound, redeemable-from-anywhere secret_id the binding
# exists to prevent — and it would look like a clean converge. So the classes
# actually in use are asserted before anything is written.
- name: Assert every CIDR class in use has been supplied
  ansible.builtin.assert:
    that:
      - openbao_approle_unsupplied_cidr_classes | length == 0
    fail_msg: >-
      CIDR classes {{ openbao_approle_unsupplied_cidr_classes | join(', ') }}
      are used by declared AppRoles but their variables are empty, so those
      secret_ids would be redeemable from ANY source address.
      Supply them via env (OPENBAO_MANAGEMENT_CIDRS / OPENBAO_WORKSTATION_CIDRS /
      OPENBAO_CI_CIDRS, comma-separated) from the iac secret store. To bootstrap
      a cluster before the CIDRs are known, set
      OPENBAO_APPROLE_ALLOW_UNBOUND_CIDRS to accept unbound roles explicitly.
    quiet: true
  when:
    - openbao_bootstrap_token is defined
    - not (openbao_approle_allow_unbound_cidrs | bool)

- name: Warn loudly about every AppRole that will be created without a CIDR bind
  ansible.builtin.debug:
    msg: >-
      OPENBAO_APPROLE_ALLOW_UNBOUND_CIDRS is set and these CIDR classes are
      empty: {{ openbao_approle_unsupplied_cidr_classes | join(', ') }}.
      Their AppRoles' secret_ids will be accepted from ANY source address.
      This is an accepted-risk bootstrap mode, not a steady state — supply the
      CIDRs and re-converge.
  when:
    - openbao_bootstrap_token is defined
    - openbao_approle_allow_unbound_cidrs | bool

- name: Assert every AppRole this run creates has a source-address class
  vars:
    _unclassed: >-
      {{ openbao_manageable_approles | map(attribute='name')
         | reject('in', openbao_approle_cidr_class_map | list) | list }}
  ansible.builtin.assert:
    that:
      - _unclassed | length == 0
    fail_msg: >-
      AppRoles {{ _unclassed | join(', ') }} are created by this converge but
      resolve to no source-address class, so nothing decides where their
      secret_ids may be redeemed. openbao_approle_cidr_class_map is built from
      openbao_approles; a role declared anywhere else must be added to that
      list, or given the `unbound` class in
      openbao_approle_cidr_class_overrides with a one-line reason on the entry.
      Unbound is a decision that gets written down, never a default.
    quiet: true
  when: openbao_bootstrap_token is defined

- name: Assert every declared AppRole has an identity class
  vars:
    _unclassified: >-
      {{ openbao_approles | map(attribute='name')
         | reject('in', openbao_approle_class_map.keys() | list) | list }}
  ansible.builtin.assert:
    that:
      - _unclassified | length == 0
    fail_msg: >-
      AppRoles {{ _unclassified | join(', ') }} have no declared identity
      class in openbao_approle_class_map.
    quiet: true
  when: openbao_bootstrap_token is defined

# The sibling failure, and the quiet one: the class map is a `combine` of the
# defaults with the override map, so an override key that matches no declared
# role adds a phantom entry and the role it was meant to move stays on the
# machine default. Nothing errors, the converge is green, and the role is bound
# to the wrong segment until somebody reads the live roles back.
- name: Assert every CIDR class override names a declared AppRole
  ansible.builtin.assert:
    that:
      - openbao_approle_unknown_cidr_class_overrides | length == 0
    fail_msg: >-
      openbao_approle_cidr_class_overrides names
      {{ openbao_approle_unknown_cidr_class_overrides | join(', ') }}, which no
      declared AppRole matches. That override is a silent no-op: the role it was
      written for is created in the
      {{ openbao_approle_default_cidr_class }} class instead. Fix the name or
      drop the entry.
    quiet: true
  when: openbao_bootstrap_token is defined

# open-llm's bind is the dispatcher host alone.
- name: Assert the open-llm bind, when supplied, is one address as a /32
  ansible.builtin.assert:
    that:
      - openbao_open_llm_secret_id_cidr is match('^[0-9]{1,3}([.][0-9]{1,3}){3}/32$')
    fail_msg: OPENBAO_AI_SANDBOX_SECRET_ID_CIDR must be a single address as a /32.
    quiet: true
  when:
    - openbao_bootstrap_token is defined
    - openbao_open_llm_secret_id_cidr | length > 0

# openhands' bind is the OpenHands guest alone.
- name: Assert the openhands bind, when supplied, is one address as a /32
  ansible.builtin.assert:
    that:
      - openbao_openhands_secret_id_cidr is match('^[0-9]{1,3}([.][0-9]{1,3}){3}/32$')
    fail_msg: OPENBAO_OPENHANDS_SECRET_ID_CIDR must be a single address as a /32.
    quiet: true
  when:
    - openbao_bootstrap_token is defined
    - openbao_openhands_secret_id_cidr | length > 0

- name: >-
    Assert the agentgateway OpenHands mint bind, when supplied, is one address as a /32
  ansible.builtin.assert:
    that:
      - >-
        openbao_agentgateway_openhands_mint_secret_id_cidr
        is match('^[0-9]{1,3}([.][0-9]{1,3}){3}/32$')
    fail_msg: >-
      OPENBAO_AGENTGATEWAY_OPENHANDS_MINT_SECRET_ID_CIDR must be a single address as a /32.
    quiet: true
  when:
    - openbao_bootstrap_token is defined
    - openbao_agentgateway_openhands_mint_secret_id_cidr | length > 0

- name: Assert the sandbox-agent CIDRs are configured
  ansible.builtin.assert:
    that:
      - openbao_sandbox_agent_cidrs | trim | length > 0
    fail_msg: >-
      OPENBAO_SANDBOX_AGENT_CIDRS is required for the sandbox-agent AppRoles;
      they are not allowed to fall back to another CIDR class or be unbound.
    quiet: true
  when: openbao_bootstrap_token is defined

- name: Select AppRole config objects
  ansible.builtin.import_tasks: select-objects.yml
  vars:
    openbao_select_kind: approles
    openbao_select_declared_candidates: "{{ openbao_approles }}"
    openbao_select_candidates: "{{ openbao_manageable_approles | default(openbao_approles) }}"

- name: Keep the selected AppRole config objects
  ansible.builtin.set_fact:
    openbao_approle_config_targets: "{{ openbao_object_targets }}"

# Not downgraded by the escape hatch: these roles are never created unbound.
# The same normalized check rejects any selected role's declared empty bind.
- name: Refuse an unbound secret_id or token CIDR on a bound-required AppRole
  ansible.builtin.assert:
    that: openbao_approle_bound_required_unbound | length == 0
    fail_msg: >-
      AppRoles {{ openbao_approle_bound_required_unbound | join(', ') }} have an
      empty declared source-address bind or a required CIDR bind. Supply the
      declared secret_id_bound_cidrs; bound-required roles must bind both
      secret_id_bound_cidrs and token_bound_cidrs.
    quiet: true
  when: openbao_bootstrap_token is defined

# The complementary half of the two asserts above: those catch a role this
# converge CREATES with no source-address class. This one catches a role that
# exists live and this converge never even LOOPS, because it is declared
# nowhere -- split into its own file to stay under the per-file token budget;
# see 10d-approle-undeclared-live.yml for the full reasoning. The selector is
# validated first so a rejected target cannot reach its retired-role cleanup.
- name: Assert every live AppRole is either declared or a named exception
  ansible.builtin.import_tasks: 10d-approle-undeclared-live.yml
  when:
    - openbao_bootstrap_token is defined
    - not (openbao_ai_admin_window_mode | default(false) | bool)

# Runs on the controller (openbao_cli_host, resolved in init/02): measured on
# the target at 328s, one module execution per role. Same CLI, same
# rc/stderr, so the denied-vs-absent classifier below reads unchanged.
# The read carries the same parameters as the writes below, so a policy that
# pins required parameters on this path still answers it.
- name: Check whether each AppRole already exists
  vars:
    ansible_become: "{{ openbao_cli_become }}"
    approle_cli_parameters: "{{ openbao_approle_cli_parameters[item.name] }}"
  ansible.builtin.command:
    cmd: >-
      bao read -format=json auth/approle/role/{{ item.name }}
      token_policies={{ approle_cli_parameters.token_policies }}
      bind_secret_id={{ approle_cli_parameters.bind_secret_id }}
      token_ttl={{ approle_cli_parameters.token_ttl }}
      token_max_ttl={{ approle_cli_parameters.token_max_ttl }}
      token_explicit_max_ttl={{ approle_cli_parameters.token_explicit_max_ttl }}
      token_type={{ approle_cli_parameters.token_type }}
      secret_id_ttl={{ approle_cli_parameters.secret_id_ttl }}
      secret_id_num_uses={{ approle_cli_parameters.secret_id_num_uses }}
      {{ ('secret_id_bound_cidrs=' ~ approle_cli_parameters.secret_id_bound_cidrs ~
          ' token_bound_cidrs=' ~ approle_cli_parameters.token_bound_cidrs)
         if (approle_cli_parameters.secret_id_bound_cidrs | length > 0) else '' }}
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  loop: "{{ openbao_approle_config_targets | default(openbao_manageable_approles) }}"
  loop_control:
    label: "{{ item.name }}"
  register: openbao_approle_checks
  no_log: true
  changed_when: false
  check_mode: false
  failed_when: false
  when: openbao_bootstrap_token is defined

# A DENIED read is not an ABSENT role. `failed_when: false` above makes both
# return a non-zero rc, and the create below treats any non-zero rc as "this
# role does not exist yet" -- so a 403 fires a privileged create that 403s in
# turn, and the run dies reporting a create failure rather than the access gap
# that actually caused it.
#
# This is reachable by design, not only by misconfiguration. The reconcile
# policy enumerates AppRole paths BY NAME and is excluded from its own managed
# set, so a newly declared AppRole has no grant for the reconcile identity
# until an operator run rewrites that policy. Every reconcile run in between
# hits exactly this path. Name the gap instead of failing on its symptom.
- name: FAIL -- the existence check was DENIED, so absence cannot be concluded
  vars:
    _denied: >-
      {{ openbao_approle_checks.results | default([])
         | rejectattr('skipped', 'defined')
         | selectattr('rc', 'defined')
         | rejectattr('rc', 'equalto', 0)
         | selectattr('stderr', 'search', '403')
         | map(attribute='item') | map(attribute='name') | list }}
  ansible.builtin.fail:
    msg: >-
      The AppRole existence check was denied (403) for: {{ _denied | join(', ') }}.
      A denied read says NOTHING about whether the role exists, so this run must
      not conclude it is missing and attempt to create it. This identity holds
      no grant on those paths. If a role was declared recently, the reconcile
      policy enumerates AppRole paths by name and is excluded from its own
      managed set -- one run with OPENBAO_PROVISIONING_TOKEN rewrites it and
      closes the gap.
  when:
    - openbao_bootstrap_token is defined
    - _denied | length > 0

# Resolution order for each bound, most specific first:
#   1. the role's own declaration in openbao_base_approles (most visible)
#   2. the per-role override map in 08b-cidr-and-unlock.yml
#   3. the global default
# `vars:` is evaluated per loop item, so `item` is in scope here and the command
# stays readable instead of carrying three nested defaults inline.
# Runs on openbao_cli_host, like the existence check above; every write in
# this file and its includes does the same.
- name: Create the missing AppRoles bound to their policy
  vars:
    ansible_become: "{{ openbao_cli_become }}"
    approle_cli_parameters: "{{ openbao_approle_cli_parameters[item.0.name] }}"
  ansible.builtin.command:
    cmd: >-
      bao write auth/approle/role/{{ item.0.name }}
      token_policies={{ approle_cli_parameters.token_policies }}
      bind_secret_id={{ approle_cli_parameters.bind_secret_id }}
      token_ttl={{ approle_cli_parameters.token_ttl }}
      token_max_ttl={{ approle_cli_parameters.token_max_ttl }}
      token_explicit_max_ttl={{ approle_cli_parameters.token_explicit_max_ttl }}
      token_type={{ approle_cli_parameters.token_type }}
      secret_id_ttl={{ approle_cli_parameters.secret_id_ttl }}
      secret_id_num_uses={{ approle_cli_parameters.secret_id_num_uses }}
      {{ ('secret_id_bound_cidrs=' ~ approle_cli_parameters.secret_id_bound_cidrs ~
          ' token_bound_cidrs=' ~ approle_cli_parameters.token_bound_cidrs)
         if (approle_cli_parameters.secret_id_bound_cidrs | length > 0) else '' }}
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  loop: >-
    {{ (openbao_approle_config_targets | default(openbao_manageable_approles))
       | zip(openbao_approle_checks.results | default([])) | list }}
  loop_control:
    label: "{{ item.0.name }}"
  no_log: true
  changed_when: true
  when:
    - openbao_bootstrap_token is defined
    - (item.1.rc | default(0)) != 0
    # absence only -- a denied read is caught by the arm above, and must never
    # reach a privileged create
    - not (item.1.stderr | default('') is search('403'))

# Policy-attachment drift on EXISTING AppRoles is reconciled through the
# dedicated /policies sub-endpoint: it updates token_policies ONLY and does
# not mint a secret_id. TTL / num_uses / token TTL / CIDRs are a sibling
# task below; that write MUST pass the same complete field set as create,
# because a partial `bao write auth/approle/role/<name>` resets omitted
# fields to defaults. Break-glass roles are not in openbao_manageable_approles
# during reconcile and stay inert here BY DESIGN — do not widen the set
# to retune them.
- name: Reconcile token_policies on existing AppRoles
  vars:
    approle_cli_parameters: "{{ openbao_approle_cli_parameters[item.0.name] }}"
    ansible_become: "{{ openbao_cli_become }}"
  ansible.builtin.command:
    cmd: >-
      bao write auth/approle/role/{{ item.0.name }}/policies
      token_policies={{ approle_cli_parameters.token_policies }}
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  loop: >-
    {{ (openbao_approle_config_targets | default(openbao_manageable_approles))
       | zip(openbao_approle_checks.results | default([])) | list }}
  loop_control:
    label: "{{ item.0.name }}"
  no_log: true
  changed_when: true
  when:
    - openbao_bootstrap_token is defined
    - (item.1.rc | default(1)) == 0
    - >-
      ((item.1.stdout | from_json).data.token_policies | default([]) | sort)
      != ((item.0.token_policies | default([item.0.policy])) | sort)

- name: Reconcile TTL and token bounds on existing AppRoles
  ansible.builtin.import_tasks: 10c-approle-ttl-bounds.yml

# Credential issuance is a separate import from init.yml, so a targeted
# openbao_approle_config run reconciles declarations and bounds without
# creating or publishing any secret_id.
