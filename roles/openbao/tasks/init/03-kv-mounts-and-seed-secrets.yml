---
# Reads in this file run on the controller (openbao_cli_host, init/02);
# same CLI and rc/stderr, so every denied-vs-absent guard reads unchanged.
# The listing that feeds the checks below is in init/03a-list-secrets-engines.yml.
# Its `no_log` keeps the token out of the log, but it also hides why a failure
# happened, so everything below it (every KV mount, every seeded secret) is
# skipped with no stated cause
# and the run still reports the play as merely "isolated failure". Surface the
# exit code and stderr on their own: neither carries the token, which is passed
# through the environment and never appears in either, and without them the
# failure cannot be diagnosed from the run log at all.
#
# Reconcile mode gets a warning instead of this fail: templates/openbao-
# reconcile-policy.hcl.j2 already grants sys/mounts read/list, so a denied
# read here means the DEPLOYED policy is stale against the template, not that
# reconcile was never meant to have this grant. openbao_reconcile_excluded_
# policies (05d-reconcile-exclusions.yml) excludes the reconcile policy from
# its own reconciliation, so only a privileged converge can refresh it --
# failing hard here would remove the only signal that refresh is owed.
- name: Fail with the reason the secrets-engine listing did not succeed
  ansible.builtin.fail:
    msg: >-
      `bao secrets list` failed against {{ openbao_api_addr }} with rc
      {{ openbao_mounts_raw.rc | default('unset') }}:
      {{ openbao_mounts_raw.stderr | default('no stderr captured') }}
  when:
    - openbao_bootstrap_token is defined
    - not (openbao_bounded_rbac_mode | default(false) | bool)
    - openbao_mounts_raw.rc | default(1) != 0

- name: WARN -- deployed openbao-reconcile policy is stale (sys/mounts denied)
  ansible.builtin.debug:
    msg: >-
      `bao secrets list` was denied under the reconcile identity even though
      templates/openbao-reconcile-policy.hcl.j2 grants sys/mounts read/list --
      the deployed policy is stale against the template and only a privileged
      converge can refresh it. Skipping the rest of this file for this run.
  when:
    - openbao_bootstrap_token is defined
    - openbao_bounded_rbac_mode | default(false) | bool
    - openbao_mounts_raw.rc | default(1) != 0

- name: Enable the KV mounts and seed per-app service secrets (probe succeeded)
  when:
    - openbao_bootstrap_token is defined
    - openbao_mounts_raw.rc | default(1) == 0
  block:
    # The app-agent leaves use their own dedicated mount and exact per-leaf
    # policies. Keep agent-tier outside openbao_kv_mounts: broad policies derive
    # access from that shared-mount list. openbao_kv_mounts declares the shared stores —
    #   secret            internal-only service credentials
    #   secrets-external  credentials for internet-reachable vendor APIs, so a leak
    #                     is scoped to its own blast radius (literal here and in the
    #                     policy templates — see the secrets-policy split doc)
    #   config            non-secret configuration, read by exactly one AppRole
    #   ext-notify        low-impact outbound credentials (post-only webhooks,
    #                     notification endpoints)
    # — so adding a shared tier is a row of data, not another copy of this task.
    # The enterprise-owner and agent-tier token stores are enabled separately
    # below so these broad policy templates do not grant access to either.
    - name: Enable the declared KV v2 mounts and tune retention
      ansible.builtin.import_tasks: 03b-kv-mounts.yml

    # This mount is deliberately outside openbao_kv_mounts: the ai-admin and
    # openbao-reconcile policies grant broad access to every entry in that list.
    - name: Enable the GitHub Enterprise owner KV v2 mount (add-if-missing)
      ansible.builtin.command:
        cmd: "bao secrets enable -path={{ openbao_github_enterprise_owner_mount }} -version=2 kv"
      environment:
        BAO_ADDR: "{{ openbao_cli_addr }}"
        BAO_TOKEN: "{{ openbao_bootstrap_token }}"
      delegate_to: "{{ openbao_cli_host }}"
      become: "{{ openbao_cli_become }}"
      vars:
        ansible_become: "{{ openbao_cli_become }}"
      no_log: true
      changed_when: true
      when: >-
        (openbao_github_enterprise_owner_mount ~ '/') not in
        (openbao_mounts_raw.stdout | from_json).keys()

    # agent-tier is purpose-built for three credential leaves. Keeping it
    # outside openbao_kv_mounts prevents wildcard grants derived from shared
    # mounts from reaching any tier.
    - name: Enable the dedicated agent-tier KV v2 mount (add-if-missing)
      ansible.builtin.command:
        cmd: "bao secrets enable -path={{ openbao_agent_tier_mount }} -version=2 kv"
      environment:
        BAO_ADDR: "{{ openbao_cli_addr }}"
        BAO_TOKEN: "{{ openbao_bootstrap_token }}"
      delegate_to: "{{ openbao_cli_host }}"
      become: "{{ openbao_cli_become }}"
      vars:
        ansible_become: "{{ openbao_cli_become }}"
      no_log: true
      changed_when: true
      when: >-
        (openbao_agent_tier_mount ~ '/') not in
        (openbao_mounts_raw.stdout | from_json).keys()

    - name: Seed the external Context7 key if absent
      ansible.builtin.include_tasks:
        file: ../seed_context7_key.yml
        apply:
          tags:
            - openbao_kv_seed
      when: not (openbao_bounded_rbac_mode | default(false) | bool)

    # --- App-secret promotion (merge-preserving, write-if-changed) -----------
    # Promote each app's EXISTING service credentials into secret/apps/<app> so
    # OpenBao is their canonical home. Values come from the converge environment,
    # mapped field -> env var by openbao_promoted_app_secrets. Runs only on the
    # bootstrap host under the admin token. See promote_app_secret.yml for the
    # merge-preserving contract.
    # Stays `include_tasks` (needs `loop:`, which `import_tasks` cannot take);
    # `apply` is what re-tags the templated content each iteration, since a
    # plain `tags:` on a dynamic include only tags the include statement
    # itself, never the tasks it loads at runtime.
    - name: Promote external service secrets into OpenBao (write-if-changed)
      ansible.builtin.include_tasks:
        file: ../promote_app_secret.yml
        apply:
          tags:
            - openbao_kv_seed
      loop: "{{ openbao_promoted_external_secrets | default({}) | dict2items }}"
      loop_control:
        loop_var: openbao_promote_item
        label: "secrets-external/{{ openbao_promote_item.key }}"
      vars:
        openbao_promote_app: "{{ openbao_promote_item.key }}"
        openbao_promote_mount: secrets-external
        openbao_promote_path: "{{ openbao_promote_item.key }}"
        openbao_promote_fields: "{{ openbao_promote_item.value }}"

    # The internal copy is retired only once the external leaf holds the key.
    # Until then the converge keeps it and carries on.
    - name: Check whether the external Z.ai leaf holds its key
      ansible.builtin.set_fact:
        openbao_zai_external_ready: >-
          {{ 'zai-coding' in (openbao_promoted_external_secrets | default({}))
             and (openbao_promote_current_data.ZAI_SUBSCRIPTION_KEY | default('') | length > 0) }}
      no_log: true

    - name: Report that the internal Z.ai copy is kept
      ansible.builtin.debug:
        msg: secrets-external/zai-coding has no key yet; the internal copy stays until it is seeded.
      when: not openbao_zai_external_ready

    - name: Promote per-app service secrets into OpenBao (write-if-changed)
      ansible.builtin.include_tasks:
        file: ../promote_app_secret.yml
        apply:
          tags:
            - openbao_kv_seed
      loop: "{{ openbao_promoted_app_secrets | dict2items }}"
      loop_control:
        loop_var: openbao_promote_item
        label: "{{ openbao_promote_item.key }}"
      vars:
        openbao_promote_app: "{{ openbao_promote_item.key }}"
        openbao_promote_fields: "{{ openbao_promote_item.value }}"
        openbao_promote_remove_fields: >-
          {{ (openbao_promoted_app_secret_removals | default({})).get(openbao_promote_item.key, [])
             + ((openbao_promoted_app_secret_removals_after_external | default({})).get(openbao_promote_item.key, [])
                if openbao_zai_external_ready else []) }}

    - name: Promote AI review configuration into OpenBao (write-if-changed)
      ansible.builtin.include_tasks:
        file: ../promote_app_secret.yml
        apply:
          tags:
            - openbao_kv_seed
      loop: "{{ openbao_promoted_config_values | dict2items }}"
      loop_control:
        loop_var: openbao_promote_item
        label: "{{ openbao_config_mount }}/{{ openbao_promote_item.key }}"
      vars:
        openbao_promote_app: "{{ openbao_promote_item.key }}"
        openbao_promote_mount: "{{ openbao_config_mount }}"
        openbao_promote_path: "{{ openbao_promote_item.key }}"
        openbao_promote_fields: "{{ openbao_promote_item.value }}"

    # --- App-secret generation (generate-if-absent) --------------------------
    # Generate + seed each app's service credentials directly in OpenBao, replacing
    # the retired terraform-proxmox vault-secrets root. Human-gated: runs only on
    # the bootstrap host under the admin token. Each secret is created ONCE when
    # absent and never rewritten, so a live credential is never rotated (same
    # create-once contract the tofu root had via random_password + ignore_changes).
    - name: Require the rotate request to name only generated fields
      ansible.builtin.assert:
        that:
          - openbao_seed_rotate_list is sequence
          - openbao_seed_rotate_list is not string
          - openbao_seed_rotate_list is not mapping
          - openbao_seed_rotate_list | difference(openbao_seed_rotate_known_fields) | length == 0
        fail_msg: >-
          openbao_seed_rotate_fields must be a list of generated field names. Unknown:
          {{ (openbao_seed_rotate_list if openbao_seed_rotate_list is sequence
              and openbao_seed_rotate_list is not string else [openbao_seed_rotate_list])
             | difference(openbao_seed_rotate_known_fields) }}
        quiet: true
      tags:
        - openbao_kv_seed

    - name: Remove migrated agent credentials from shared app leaves
      ansible.builtin.include_tasks:
        file: ../remove_app_agent_legacy_fields.yml
        apply:
          tags:
            - openbao_kv_seed
      loop: "{{ openbao_app_agent_tier_readers }}"
      loop_control:
        loop_var: openbao_agent_tier_reader
        label: "{{ openbao_agent_tier_reader.tier }}"
      tags:
        - openbao_kv_seed

    - name: Generate + seed per-app service secrets in OpenBao (generate-if-absent)
      ansible.builtin.include_tasks:
        file: ../seed_generated_app_secret.yml
        apply:
          tags:
            - openbao_kv_seed
      loop: "{{ openbao_seeded_generated_app_secrets | dict2items }}"
      loop_control:
        loop_var: openbao_seed_item
        label: "{{ openbao_seed_item.key }}"
      vars:
        openbao_seed_app: "{{ openbao_seed_item.key }}"
        openbao_seed_fields: "{{ openbao_seed_item.value }}"

    - name: Seed roster agent key leaves in OpenBao (owner-checked, generate-if-absent)
      ansible.builtin.include_tasks:
        file: ../seed_roster_agent_leaf.yml
        apply:
          tags:
            - openbao_kv_seed
      loop: "{{ openbao_roster_agent_generated_app_secrets | dict2items }}"
      loop_control:
        loop_var: openbao_seed_item
        label: "{{ openbao_seed_item.key }}"
      vars:
        openbao_seed_app: "{{ openbao_seed_item.key }}"
        openbao_seed_fields: "{{ openbao_seed_item.value }}"
        openbao_seed_owner_metadata: "{{ openbao_roster_agent_leaf_metadata[openbao_seed_item.key] }}"

    - name: Seed registry caller gateway key leaves in OpenBao (owner-checked, generate-if-absent)
      ansible.builtin.include_tasks:
        file: ../seed_roster_agent_leaf.yml
        apply:
          tags:
            - openbao_kv_seed
      loop: "{{ openbao_caller_gateway_generated_app_secrets | dict2items }}"
      loop_control:
        loop_var: openbao_seed_item
        label: "{{ openbao_seed_item.key }}"
      vars:
        openbao_seed_app: "{{ openbao_seed_item.key }}"
        openbao_seed_fields: "{{ openbao_seed_item.value }}"
        openbao_seed_owner_metadata: "{{ openbao_caller_gateway_leaf_metadata[openbao_seed_item.key] }}"

    - name: Capture generated router keys for the open-llm merge
      ansible.builtin.set_fact:
        openbao_zcode_router_key_source: >-
          {{ openbao_seeded_app_secret_values['zcode']['zcode_llm_router_key'] }}
        openbao_opencode_router_key_source: >-
          {{ openbao_seeded_app_secret_values['opencode']['opencode_llm_router_key'] }}
        openbao_opencode_local_router_key_source: >-
          {{ openbao_seeded_app_secret_values['sandbox-agent-router']['sandbox_agent_local_router_llm_router_key'] }}
        openbao_qwen_code_router_key_source: >-
          {{ openbao_seeded_app_secret_values['qwen-code']['qwen_code_llm_router_key'] }}
      no_log: true

    - name: Merge generated router keys into open-llm
      ansible.builtin.include_tasks:
        file: ../promote_app_secret.yml
        apply:
          tags:
            - openbao_kv_seed
      vars:
        openbao_promote_app: open-llm
        openbao_promote_fields:
          ZCODE_ROUTER_KEY: openbao_zcode_router_key_source
          OPENCODE_ROUTER_KEY: openbao_opencode_router_key_source
          OPENCODE_LOCAL_ROUTER_KEY: openbao_opencode_local_router_key_source
          QWEN_CODE_ROUTER_KEY: openbao_qwen_code_router_key_source

# --- AWS secrets engine (external plugin: register + enable, add-if-missing) -
# Dynamic STS creds for role/tf-proxmox — replaces the laptop's static
# aws-vault base key. The engine is NOT builtin: main.yml staged the plugin
# binary on every node; here the bootstrap host registers it in the
# cluster-replicated catalog (pinned to the staged binary's sha256), then
# mounts it. See defaults/main.yml for the var docs.
