---
# OpenBao bootstrap — runs ONLY on the bootstrap host (gated by the include in
# main.yml: inventory_hostname == openbao_bootstrap_host). It initializes the
# cluster, then provisions the KV mount, the RBAC policies, and the AppRoles
# (terraform-apply / Terrakube JWT / ansible-converge / observability /
# local-cloud / monitoring / media / local-llm / public / ai-readonly /
# ai-elevated / snapshot — see docs/SECRETS_HIERARCHY.md). The other Raft
# peers never run this: they join the leader automatically (retry_join in
# openbao.hcl) and self-unseal via the static seal. Every step is guarded so
# re-runs are no-ops: nothing is created if it already exists, and break-glass
# material is only emitted for AppRoles that were newly created THIS run —
# whether that's the very first bootstrap or a later run against an
# already-live cluster (supplied a privileged BAO_TOKEN) that only grows the
# RBAC surface with a few more identities.
#
# Break-glass safety: recovery shares + root token (and every new AppRole's
# role_id/secret_id) are written ONLY to 0600 files on the Ansible CONTROLLER
# under playbook_dir, and a LOUD warning tells the operator to copy to
# paper / load into the right store and delete. These values are NEVER
# written into the repo or onto a target host, and the `bao` invocations that
# touch them run with no_log: true.

- name: Refuse a retired single-object input beside a different openbao_select
  ansible.builtin.assert:
    that:
      - openbao_select_retired_inputs | length == 0 or openbao_select == openbao_select_retired_inputs
    fail_msg: >-
      Use openbao_select alone. openbao_rbac_policy_name and openbao_approle_config_name
      are retired names for its policies and approles kinds.
    quiet: true
  tags: always

- name: Reject caller IDs that also belong to the tofu roster
  ansible.builtin.import_tasks: init/00-caller-roster-collision-guard.yml
  tags:
    - always

# Tagged `always`: every phase below reads openbao_bootstrap_token /
# openbao_cli_host / openbao_cli_addr, all resolved here. A scoped run
# (e.g. `--tags openbao_rbac`) that skipped this phase would leave
# openbao_bootstrap_token undefined, and every downstream task's own
# `when: openbao_bootstrap_token is defined` guard would then silently skip
# the very phase that was asked for.
- name: Refuse stale break-glass material and probe peers for a live cluster (data-loss guard)
  ansible.builtin.import_tasks: init/01-preflight-and-cluster-probe.yml
  tags:
    - always

- name: Initialize the cluster and resolve the provisioning token
  ansible.builtin.import_tasks: init/02-initialize-cluster.yml
  tags:
    - always

# Registers openbao_mounts_raw for the readers below. Every tag those readers run
# under is listed here, so a scoped run such as --tags github gets the listing
# without pulling in the KV seed in init/03. Each reader is also gated on the
# full-run or matching-selection condition for its phase; 03b is the one
# selective reader, and only runs for kv_mounts.
- name: List the enabled secrets engines
  ansible.builtin.import_tasks: init/03a-list-secrets-engines.yml
  tags:
    - openbao_kv_seed
    - openbao_kv_mounts
    - openbao_engines
    - aws
    - azure
    - oauth
    - github
    - openbao_github_mounts
    - openbao_ssh_ca
    - etcd_pki
  when: >-
    openbao_select | default({}) | length == 0
    or 'kv_mounts' in (openbao_select | default({}))

# Plugin registration is deliberately OUTSIDE the openbao-reconcile grant: its
# policy carries no sys/plugins/catalog path at all, because registering a
# plugin is break-glass.
#
# These three files probe with `bao plugin read` under `failed_when: false` and
# treat a non-zero rc as "not registered". Under reconcile that read is DENIED,
# which is also non-zero, so the probe concludes the plugin is absent and
# attempts the privileged register -- failing the run partway through. A denied
# read is not an absent object.
#
# Unlike 04/05/06/09, this include is NOT gated on reconcile mode:
# templates/openbao-reconcile-policy.hcl.j2 already grants sys/mounts
# read/list, so the reconcile identity is meant to run this file. The file's
# own tasks handle a denied sys/mounts read (a stale deployed policy --
# 05d-reconcile-exclusions.yml excludes the reconcile policy from its own
# reconciliation, so only a privileged converge refreshes it) by warning and
# skipping its own KV-mount and app-secret work, instead of this include
# skipping blind.
- name: Enable the KV mounts and seed per-app service secrets
  ansible.builtin.import_tasks: init/03-kv-mounts-and-seed-secrets.yml
  tags:
    - openbao_kv_seed
  when: openbao_select | default({}) | length == 0

- name: Fail when the secrets-engine listing failed for selected KV mounts
  ansible.builtin.fail:
    msg: >-
      `bao secrets list` failed against {{ openbao_api_addr }} with rc
      {{ openbao_mounts_raw.rc | default('unset') }}:
      {{ openbao_mounts_raw.stderr | default('no stderr captured') }}
  when:
    - "'kv_mounts' in (openbao_select | default({}))"
    - openbao_bootstrap_token is defined
    - openbao_mounts_raw.rc | default(1) != 0
  tags:
    - openbao_kv_seed
    - openbao_kv_mounts

- name: Selectively enable declared KV v2 mounts
  ansible.builtin.import_tasks: init/03b-kv-mounts.yml
  tags:
    - openbao_kv_seed
    - openbao_kv_mounts
  when:
    - "'kv_mounts' in (openbao_select | default({}))"
    - openbao_bootstrap_token is defined
    - openbao_mounts_raw.rc | default(1) == 0

- name: Register and configure the AWS secrets engine
  ansible.builtin.import_tasks: init/04-aws-engine.yml
  tags:
    - openbao_engines
    - aws
  when:
    - not (openbao_bounded_rbac_mode | default(false) | bool)
    - openbao_select | default({}) | length == 0

- name: Register and configure the Azure secrets engine
  ansible.builtin.import_tasks: init/04b-azure-engine.yml
  tags:
    - openbao_engines
    - azure
  when:
    - not (openbao_bounded_rbac_mode | default(false) | bool)
    - openbao_azure_engine_enabled | bool
    - openbao_select | default({}) | length == 0

- name: Configure the Transit secrets engine for OpenTofu state encryption
  ansible.builtin.import_tasks: init/04c-transit-engine.yml
  tags:
    - openbao_engines
  when: openbao_select | default({}) | length == 0

- name: Register and configure the GitHub secrets engine
  ansible.builtin.import_tasks: init/05-github-engine.yml
  tags:
    - openbao_engines
    - github
  when:
    - not (openbao_bounded_rbac_mode | default(false) | bool)
    - openbao_select | default({}) | length == 0

- name: Register and configure the OAuthapp secrets engine
  ansible.builtin.import_tasks: init/06-oauth-engine.yml
  tags:
    - openbao_engines
    - oauth
  when:
    - not (openbao_bounded_rbac_mode | default(false) | bool)
    - openbao_select | default({}) | length == 0

- name: Configure the SSH CA and its signing roles
  ansible.builtin.import_tasks: init/07-ssh-ca-engine.yml
  tags:
    - openbao_ssh_ca

# openbao_pki_etcd_engines is empty by default (05g-etcd-pki-engine.yml) — a
# no-op on every existing converge until a Patroni-mode cluster cutover adds
# an entry.
- name: Configure etcd PKI engines for Patroni HA clusters
  ansible.builtin.include_tasks:
    file: init/07b-etcd-pki-engine.yml
    apply:
      tags:
        - etcd_pki
  tags:
    - etcd_pki
  when: openbao_select | default({}) | length == 0

- name: Render and reconcile the RBAC policies
  ansible.builtin.import_tasks: init/08-rbac-policies.yml
  tags:
    - openbao_rbac

- name: Reconcile selected GitHub permission sets
  ansible.builtin.import_tasks: init/05-github-permission-sets.yml
  tags:
    - openbao_rbac
  when:
    - "'github_permission_sets' in (openbao_select | default({}))"

- name: Reconcile the two human-gated AppRole policy attachments
  ansible.builtin.import_tasks: init/08c-human-gated-approle-policies.yml
  tags:
    - openbao_rbac
  when:
    - openbao_select | default({}) | length == 0
    - openbao_bootstrap_token is defined
    - openbao_reconcile_mode | default(false) | bool

# After 08: a new mount's path reaches the provisioning policy only once 08
# rewrites it. Dynamic includes: the tag reaches the loaded tasks only via
# `apply:` (see the rotation-exempt include below). `--tags
# openbao_github_mounts,openbao_rbac` scopes a run to these includes and the
# policies, without the rest of the bootstrap phases.
- name: Configure the per-App GitHub mounts
  ansible.builtin.include_tasks:
    file: init/05b-github-app-mount.yml
    apply:
      tags:
        - openbao_github_mounts
        - github
  tags:
    - openbao_github_mounts
    - github
  loop: "{{ openbao_github_app_mounts }}"
  loop_control:
    loop_var: gm
    label: "{{ gm.mount }}"
  no_log: true
  vars:
    _policy_sync_capabilities: "{{ openbao_policy_sync_capability_map | default({}) }}"
    _policy_sync_update_paths: >-
      {{ _policy_sync_capabilities | dict2items
         | selectattr('key', 'in', _per_app_mount_paths)
         | selectattr('value', 'contains', 'update') | map(attribute='key') | list }}
    _per_app_mount_paths: >-
      {{ openbao_github_app_mounts | default([]) | map(attribute='mount')
         | map('regex_replace', '^', 'sys/mounts/') | list }}
  when:
    - openbao_select | default({}) | length == 0
    - openbao_bootstrap_token is defined
    - openbao_github_engine_enabled | bool
    - >-
      not (openbao_bounded_rbac_mode | default(false) | bool)
      or ((openbao_policy_sync_caps.rc | default(1)) == 0
          and 'update' in _policy_sync_capabilities
          .get('sys/policies/acl/' ~ openbao_reconcile_policy_name, [])
          and (_per_app_mount_paths | difference(_policy_sync_update_paths) | length) == 0)

# Runs on the controller: it already holds the App keys, and the store host
# has no Python cryptography for the JWT signature. ansible_become is a
# connection variable, so it is set as a var (the become keyword loses to the
# inventory's ansible_become on a delegated task).
- name: Check each GitHub App with a key in this run for exposure
  ansible.builtin.include_tasks:
    file: init/05c-github-app-exposure.yml
    apply:
      delegate_to: localhost
      vars:
        ansible_become: false
      tags:
        - openbao_github_mounts
        - github
  tags:
    - openbao_github_mounts
    - github
  loop: "{{ openbao_github_app_exposure_targets }}"
  loop_control:
    loop_var: ga
    label: "{{ ga.app_id }}"
  no_log: true
  when:
    - not (openbao_bounded_rbac_mode | default(false) | bool)
    - openbao_select | default({}) | length == 0

- name: Enable AppRole/JWT auth and reconcile Terrakube workspace JWT roles
  ansible.builtin.import_tasks: init/09-auth-methods-and-terrakube-jwt.yml
  tags:
    - openbao_auth_methods
  # templates/openbao-reconcile-policy.hcl.j2 grants sys/auth read/list, but
  # the deployed reconcile policy can be stale against it the same way 03's
  # sys/mounts grant was (05d-reconcile-exclusions.yml excludes the reconcile
  # policy from its own reconciliation). A denied READ returns rc != 0 under
  # failed_when: false — which reads as "absent" and triggers exactly the
  # privileged create that cannot succeed. Enabling an auth method is bootstrap
  # work; it needs OPENBAO_PROVISIONING_TOKEN.
  when:
    - not (openbao_bounded_rbac_mode | default(false) | bool)
    - openbao_select | default({}) | length == 0

- name: Declare AppRoles and reconcile their policy and TTL bounds
  ansible.builtin.import_tasks: init/10-approles.yml
  tags:
    - openbao_approle
    - openbao_approle_config

# The per-call liveness probe must stay after RBAC and AppRole declarations.
# The first scoped converge selects openbao_rbac and openbao_approle, so the
# issuer grants exist before this probe runs.
- name: Probe the per-call reconcile issuer liveness path
  ansible.builtin.import_tasks: init/10a-approle-issuer-liveness.yml
  tags:
    - openbao_approle
  when: openbao_select | default({}) | length == 0

- name: Issue per-call and stored AppRole credentials
  ansible.builtin.import_tasks: init/10b-approle-secret-ids.yml
  tags:
    - openbao_approle
  when: openbao_select | default({}) | length == 0

# --- Rotation-exempt tagging (idempotent, write-if-changed) ------------------
# Stamp custom_metadata.rotation=exempt on every operator-declared
# encryption/signing path (openbao_rotation_exempt) so the secret-age auditor
# never flags it "overdue" for a rotation that would destroy already-stored
# data. Runs LAST, after the RBAC/AppRole reconcile above, so a metadata patch
# this identity is not yet granted (a stale reconcile policy) cannot fail the
# run before the policies and AppRoles it depends on are reconciled. It still
# runs after promotion/generation (init/03) so a path declared exempt in the
# same converge that creates it is tagged immediately rather than waiting for
# a second converge.
# Stays `include_tasks` (dynamic): it needs `loop:` on the include itself,
# which `import_tasks` (a parse-time, not runtime, construct) cannot take.
# Tags on a dynamic include reach the tasks it loads only via `apply:`, not
# via a plain `tags:` on the include statement -- `apply: {tags: [...]}` is
# the mechanism, and it re-tags the templated content at the moment this
# include actually runs, once per loop iteration.
- name: Select rotation-exempt metadata objects
  ansible.builtin.import_tasks: init/select-objects.yml
  vars:
    openbao_select_kind: rotation_exempt
    openbao_select_candidates: "{{ openbao_select_profiles.rotation_exempt.candidates }}"
  tags:
    - openbao_rotation_exempt

- name: Tag operator-declared rotation-exempt paths (write-if-changed)
  ansible.builtin.include_tasks:
    file: tag_rotation_exempt.yml
    apply:
      tags:
        - openbao_rotation_exempt
  loop: "{{ openbao_selected_objects.rotation_exempt | map(attribute='name') | list }}"
  loop_control:
    loop_var: openbao_rotation_exempt_entry
  tags:
    - openbao_rotation_exempt
  # This legacy helper runs on the OpenBao guest and uses openbao_write_addr.
  # The bounded window profile does not include rotation-exempt metadata.
  when:
    - openbao_bootstrap_token is defined
    - not (openbao_cli_proxy_active | default(false) | bool)

# --- Disclosure-denylist metadata declaration (idempotent, write-if-changed) -
# Declares owner/reader/docs/rotation custom_metadata on the disclosure-
# denylist KV-v2 entry (05c-terrakube-and-remaining-domain-names.yml) --
# metadata only, never the term list itself. Runs LAST for the same reason as
# the rotation-exempt tagging above: a metadata patch this identity is not
# yet granted must not fail the run before the policies it depends on are
# reconciled. This node-local helper is excluded from bounded window runs.
- name: Declare the disclosure-denylist entry's custom_metadata (write-if-changed)
  ansible.builtin.include_tasks: declare_disclosure_denylist_metadata.yml
  when:
    - openbao_bootstrap_token is defined
    - openbao_select | default({}) | length == 0
    - not (openbao_cli_proxy_active | default(false) | bool)
