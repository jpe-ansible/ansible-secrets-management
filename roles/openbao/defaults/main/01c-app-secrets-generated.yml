---
# App service secrets GENERATED (random, generate-if-absent) in OpenBao itself,
# replacing the retired terraform-proxmox vault-secrets root. Each app maps to
# its field list; every field gets a random alnum value created once at
# secret/apps/<app> (or its declared internal path). Stored fields are kept
# unless explicitly rotated or rejected by their field's validity pattern
# (router keys require the sk- prefix).
# openbao_secrets then exposes these paths to the nautobot/zammad roles.
#
# Split out of 01b-app-secrets.yml, which was at its token budget. See that
# file's header for the promote-vs-generate distinction; this file only holds
# the generated side.
openbao_router_key_catalog: >-
  {{ llm_router_key_catalog_facts.openbao_router_key_catalog }}

openbao_generated_app_secrets:
  nautobot: [db_password, secret_key, superuser_password]
  # Zammad fields are app-namespaced (zammad_*) so the flat merge into
  # bao_apps_secrets (openbao_secrets reads apps/nautobot + apps/zammad +
  # apps/vikunja into one dict) never collides with Nautobot's bare
  # db_password. The consumers already read the namespaced names
  # (inventory/group_vars/{zammad_group,postgres_group}.yml).
  zammad:
    - zammad_db_password
    - zammad_admin_password
    - zammad_hermes_api_token
    - zammad_splunk_api_token
    - zammad_ntfy_api_token
    - zammad_cribl_api_token
  # Streaming-replication credential for the shared-apps Postgres pair (the
  # postgres role's primary creates the replicator login with it; the standby
  # puts it in .pgpass). Bare name is safe in the flat bao_apps_secrets merge —
  # no other app path carries a replication_password field.
  postgres: [replication_password]
  # MCP gateway (IBM mcp-context-forge): admin basic-auth password, JWT signing
  # secret, and the AES encryption key for its stored per-upstream auth
  # headers. No db_password — it defaults to SQLite. Any upstream MCP server's
  # own API key (e.g. Hugging Face, Postman) is a pre-existing external
  # credential, NOT generated here; it belongs in secrets-external/ and is
  # referenced by the gateway's per-server config, never written to this map.
  mcp-gateway: [mcp_gateway_admin_password, mcp_gateway_jwt_secret, mcp_gateway_encryption_secret]
  hindsight:
    - hindsight_db_password
    - hindsight_replication_password
    - hindsight_cp_access_key
    - hindsight_llm_router_key
    - hindsight_etcd_root_password
    - hindsight_patroni_api_password
    - hindsight_patroni_superuser_password
    - hindsight_api_key
  # LiteLLM router login on the SAME ai-VLAN cluster Hindsight uses. The router
  # keeps its learned per-model quality estimates in Postgres; without them it
  # restarts onto cold-start priors and behaves like a working router that is
  # permanently worse. GENERATED, not promoted: this creates a new role on an
  # existing cluster, so no stored data depends on the previous value.
  # App-namespaced for the flat bao_apps_secrets merge. The router's master key
  # and Redis password are NOT here — they live at ai/llm and ai/llm-router in
  # the local-llm domain, hand-seeded, and must keep their current values.
  llm-router: [llm_router_db_password]
  # Per-caller virtual keys for the router. Generated HERE so the router never
  # mints or distributes a credential — it registers a value it merely READS
  # (ansible-proxmox-ai, roles/llm_router/tasks/seed-keys.yml), and reads are
  # pre-authorized. Replaces these two consumers' use of the shared router
  # master key for router calls, which made spend unattributable and made
  # revoking one tool a rotation for everyone. App-namespaced for the flat
  # bao_apps_secrets merge, same as every other field here.
  open-webui: [open_webui_llm_router_key]
  langgraph: [langgraph_llm_router_key]
  homeassistant: [homeassistant_llm_router_key]
  # Langflow router key for ansible-proxmox-ai's langflow_docker role.
  langflow: [langflow_llm_router_key]
  # Same shape: one field, generated here, read by ansible-proxmox-ai's
  # llm_router role (56-virtual-keys.yml) and each consumer's own role
  # (agentgateway_docker, dify_docker, llamaindex), replacing their prior use
  # of the shared router master key.
  agentgateway: [agentgateway_llm_router_key]
  dify: [dify_llm_router_key]
  # Grafana plugin router key for ansible-proxmox-ai's llm_router role.
  grafana-llm: [grafana_llm_router_key]
  llamaindex: [llamaindex_llm_router_key]
  # Same shape again: Langfuse's own "litellm-router" LLM connection, replacing
  # its prior use of the shared router master key.
  langfuse: [langfuse_llm_router_key]
  # Router caller key for the decisions app.
  decisions: [decisions_llm_router_key]
  # ClickHouse application and integration passwords.
  # Generated at ai/clickhouse with the normal password format.
  clickhouse: [APP_PASSWORD, GRAFANA_PASSWORD, HYPERDX_PASSWORD, SPLUNK_PASSWORD]
  # ClickHouse ingest writer password, generated at ai/clickhouse-ingest with
  # the normal password format. One field, read by its own domain.
  clickhouse-ingest: [CRIBL_PASSWORD]
  # ClickHouse wall reader password, generated at ai/clickhouse-wall with
  # the normal password format. One field, read by its own domain.
  clickhouse-wall: [WALL_READER_PASSWORD]
  # Crawl4AI's API bearer token is generated here and read through the apps domain.
  crawl4ai: [crawl4ai_api_token]
  # Classifier API bearer key generated at ai/llm.
  laya: [laya_api_key]
  # CI's router key. Generated here like the two above; the workflows that use
  # it read it as an Actions secret, so an operator copies the value into the
  # org secret sync once. Scoped to the delegated-work aliases only, so CI
  # cannot spend on the lead tier and revoking it touches nothing else.
  github-actions: [github_actions_llm_router_key]
  # Separate local-only event workflows receive independent router keys;
  # their OpenBao OIDC roles each read only the matching app path.
  github-actions-ci-fix: [github_actions_ci_fix_llm_router_key]
  github-actions-pr-review: [github_actions_pr_review_llm_router_key]
  # Open-source-repository CI review key ("oss" is the scope word; never
  # "public" in a credential name). The consumer declares apps/github-actions-oss
  # in ansible-proxmox-ai roles/openbao_secrets (apps domain, optional) and
  # registers it as the `github-actions-oss` virtual key in roles/llm_router.
  github-actions-oss: [github_actions_oss_llm_router_key]
  # Scheduled local eval benchmark's router key (JacobPEvans-ai/llm-prompt-evals,
  # .github/workflows/scheduled-local-benchmark.yml). The workflow reads it at
  # job time through its OpenBao OIDC role (09c), which also reads the CI
  # base-URL config leaf — no Actions-secret copy exists to drift.
  evals: [evals_llm_router_key]
  # The metrics scraper's router key, same contract as the two above. Lands at
  # secret/apps/prometheus. TWO readers, both of which read this exact field:
  # roles/prometheus_stack here (inventory/group_vars/prometheus_group.yml puts
  # it in the scrape job's bearer) and ansible-proxmox-ai's roles/llm_router
  # (defaults/main/56-virtual-keys.yml registers it as the `prometheus-scrape`
  # virtual key, scoped to no model). One field, both ends, so the credential
  # the scraper presents and the one the router accepts cannot drift.
  prometheus: [prometheus_llm_router_key]
  # The dashboard deployment-profile tile's router key, same contract as the
  # scraper above. Lands at secret/apps/glance. TWO readers of this exact
  # field: inventory/group_vars/glance_group.yml (the tile's bearer) and
  # ansible-proxmox-ai roles/llm_router (registers it as the `glance` virtual
  # key, limited to the health and model-info routes).
  glance: [glance_llm_router_key]
  # The docs site's router snapshot key, same contract as glance above. Lands at
  # secret/apps/docs-router-snapshot. TWO readers of this exact field: the
  # `docs-router-snapshot` GitHub OIDC role (07c-base-policies.yml) and
  # ansible-proxmox-ai roles/llm_router (registers it as the
  # `docs-router-snapshot` virtual key, limited to the health and model-info
  # routes).
  docs-router-snapshot: [docs_router_snapshot_llm_router_key]
  # HTTP basic-auth password for the read-only Git mirror guest. Generated here
  # at secret/apps/git-mirror in the normal password format.
  git-mirror: [all_password]
  # Gatus external-endpoint bearer token, read via the monitoring domain
  # (roles/openbao_secrets) by status_stack and service_deadman.
  monitoring/main: [GATUS_EXTERNAL_TOKEN]
  # Cribl Stream management API (:9000) local admin password — rotated off
  # the vendor default by roles/cribl_stream tasks/rotate_admin_password.yml.
  # Consumed by inventory/group_vars/cribl_stream_group.yml.
  cribl-stream: [cribl_admin_password]
  # Cribl Edge admin credentials. Workstation buckets use dedicated readers
  # and are excluded from the shared apps reader.
  cribl-edge: [cribl_admin_password]
  cribl-edge-macbook: [cribl_admin_password]
  cribl-edge-mac-studio: [cribl_admin_password]
  # unpoller's read-only UniFi controller account password. The account
  # itself is created by hand in the controller UI (neither UniFi Terraform
  # provider exposes a controller-admin-user resource — see the UniFi
  # infrastructure repo's provider-gap tracking doc); only the password is
  # generated here and read by roles/unpoller. Consumed by
  # inventory/group_vars/cribl_stream_group.yml.
  unpoller: [unpoller_controller_password]
  # Router keys for the public consumers that are part of this catalog.
  agy: [agy_llm_router_key]
  zcode: [zcode_llm_router_key]
  qwen-code: [qwen_code_llm_router_key]
  # Same shape as the four entries above: one field per app.
  opencode: [opencode_llm_router_key]
  raycast: [raycast_llm_router_key]
  codex: [codex_llm_router_key]
  cursor: [cursor_llm_router_key]
  litellm-local: [litellm_local_llm_router_key]
  # The primary workstation's own proxy key, registered as the zdr_only
  # `litellm-local-workstation` virtual key in ansible-proxmox-ai
  # roles/llm_router.
  litellm-local-workstation: [litellm_local_workstation_llm_router_key]
  # Claude Code launcher keys share this app leaf and its existing readers.
  claude-code:
    - claude_code_llm_router_key
    - claude_llm_router_key
    - claude_ocg_router_key
    - claude_homelab_llm_router_key
  sandbox-agent-router: [sandbox_agent_router_llm_router_key, sandbox_agent_local_router_llm_router_key]
  # Lane-walk probe caller key (ansible-proxmox-ai playbooks/verify/lane-walk.yml).
  lane-walk-probe: [lane_walk_probe_llm_router_key]
  hermes-default: [hermes_default_llm_router_key]
  hermes-splunk-admin: [hermes_splunk_admin_llm_router_key]
  hermes-homelab-admin: [hermes_homelab_admin_llm_router_key]
  hermes-github-maint: [hermes_github_maint_llm_router_key]
  hermes-tracker-reporter: [hermes_tracker_reporter_llm_router_key]
  hermes-vikunja-pm: [hermes_vikunja_pm_llm_router_key]
  hermes-orchestrator: [hermes_orchestrator_llm_router_key]
  hermes-eval: [hermes_eval_llm_router_key, hermes_eval_api_server_key]
  hermes-private: [hermes_private_llm_router_key]
  pepper: [pepper_llm_router_key]
  donna: [donna_llm_router_key, donna_a2a_token]
  # hermes-ui companion web guest (ai VLAN): hermes-workspace's bind password
  # plus mission-control's auth pair. App-namespaced for the flat
  # bao_apps_secrets merge. hermes_ui_hermes_api_token is deliberately NOT
  # here — it must MATCH hermes_agent's HERMES_API_SERVER_KEY rather than be
  # generated independently, and the consumer treats it as optional (empty
  # just means the workspace UI dials the gateway unauthenticated).
  hermes-ui: [hermes_ui_workspace_password, hermes_ui_mission_control_auth_user, hermes_ui_mission_control_auth_pass]
  ai-sessions:
    - claude_ro_secret
    - claude_rw_secret
    - codex_ro_secret
    - codex_rw_secret
    - gemini_ro_secret
    - gemini_rw_secret
  # Workflow-engine login for the shared Postgres cluster. Generated, not
  # promoted: the cutover creates a NEW role on the shared cluster, so nothing
  # depends on the previous value. The encryption key for the same app is in
  # openbao_promoted_app_secrets — the two must not be confused.
  # App-namespaced for the flat bao_apps_secrets merge.
  #
  # n8n_llm_router_key: n8n's LiteLLM Request node, scoped to the one model
  # it calls (roles/n8n_docker n8n_docker_seed_model) in ansible-proxmox-ai's
  # roles/llm_router `n8n` virtual key.
  n8n: [n8n_db_password, n8n_llm_router_key]
  # OpenHands agent server. openhands_llm_router_key is the router key for the
  # `openhands` virtual key in ansible-proxmox-ai roles/llm_router;
  # openhands_backend_api_key is the backend API key every OpenHands API call
  # carries; openhands_secret_key is the key the agent server encrypts its
  # stored secrets with (rotating it makes stored secrets unreadable); and
  # openhands_webhook_secret is the signing secret shared by the Vikunja
  # webhook and the OpenHands event source. App-namespaced for the flat
  # bao_apps_secrets merge, same as every other field here.
  openhands:
    [
      openhands_llm_router_key,
      openhands_backend_api_key,
      openhands_secret_key,
      openhands_webhook_secret,
    ]
  # Hatchet (batch-job scheduler, hatchet-lite on the shared Postgres cluster).
  # DB login, admin login and the auth cookie secret are plain random values.
  # The three encryption keysets are NOT here: they are Tink keyset JSON, not
  # random strings, so they are promoted (01b) from a one-time
  # `hatchet-admin keyset create-local-keys` run.
  hatchet:
    [
      hatchet_db_password,
      hatchet_admin_password,
      hatchet_server_auth_cookie_secrets,
    ]
  # Only the admin password is generated so the role can mint a Homarr API key.
  # The role publishes that key and adopts the existing on-disk encryption key;
  # generating a new encryption key would make stored integration credentials
  # unreadable. Keeping the app here grants the apps AppRole read access to both.
  homarr: [homarr_admin_password]
  # Second Homarr guest (2.x). Same shape; its fields carry the instance
  # prefix (roles/homarr homarr_secret_prefix) for the flat merge.
  homarr-v2: [homarr_v2_admin_password]
  # Local Vikunja login password for each Hermes bridge identity, the AI Jobs
  # identity, and the openhands bot user — openhands_login_password is the
  # local login for the Vikunja bot user named openhands. The app-agent
  # credentials live on the dedicated agent-tier mount. converge, same as the
  # other fields at this path.
  vikunja:
    - donna_login_password
    - hermes_login_password
    - ai_jobs_login_password
    - openhands_login_password
    - svc_mcp_clerk_password
  # YouTrack admin password, generated at source and read through the apps
  # domain (apps/youtrack). App-namespaced for the flat bao_apps_secrets merge.
  youtrack: [youtrack_admin_password]
  # Leantime database and session secrets, generated at source (apps/leantime).
  leantime: [leantime_db_password, leantime_session_password]
  # Samba accounts for the per-node SMB shares (ansible-proxmox nas_storage).
  # Two accounts, named by ROLE rather than by person: a service account and a
  # human-facing one. BOTH the username and the password are generated, because
  # a login name is half of a credential and cannot be rotated once published --
  # so it is never written into the desired-state object or into converge logs,
  # and the role resolves it from here at converge time.
  #
  # The *_username fields take the login-safe alphabet and length (see
  # openbao_app_secret_username_suffix); the passwords take the normal one.
  nas:
    - smb_service_account_username
    - smb_service_account_password
    - smb_user_username
    - smb_user_password
  # Shared static token both the Semaphore server and its runner read as
  # SEMAPHORE_RUNNER_REGISTRATION_TOKEN, letting the runner self-register.
  semaphore: [semaphore_runner_registration_token]
  # Confidential OIDC client secrets for apps that need a real shared secret
  # rather than Hermes/Donna's public-PKCE pattern (Homarr, Langfuse, Phoenix,
  # Semaphore, terrakube-dex, Grafana, LiteLLM, YouTrack, Leantime and Vikunja).
  # Authelia hashes the plaintext into its own config; the consuming app reads
  # it via bao_apps_secrets. Elevation client secrets use the dedicated path below.
  authelia:
    [
      authelia_uicheck_password,
      authelia_oidc_homarr_client_secret,
      authelia_oidc_langfuse_client_secret,
      authelia_oidc_phoenix_client_secret,
      authelia_oidc_semaphore_client_secret,
      authelia_oidc_terrakube_dex_client_secret,
      authelia_oidc_grafana_client_secret,
      authelia_oidc_litellm_client_secret,
      authelia_oidc_openbao_ui_client_secret,
      authelia_oidc_youtrack_client_secret,
      authelia_oidc_leantime_client_secret,
      authelia_oidc_vikunja_client_secret,
    ]
  client:
    - authelia_oidc_bao_elevate_trusted_client_secret
    - authelia_oidc_bao_elevate_policy_sync_client_secret
openbao_app_agent_tier_generated_app_secrets: >-
  {%- set _secrets = {} -%}
  {%- for reader in openbao_app_agent_tier_readers | default([]) -%}
  {%- if reader.generated_fields | default([]) | length > 0 -%}
  {%- set _ = _secrets.update({'agent-tier-' ~ reader.tier: reader.generated_fields}) -%}
  {%- endif -%}
  {%- if reader.login_fields | default([]) | length > 0 -%}
  {%- set _ = _secrets.update({'agent-tier-login-' ~ reader.tier: reader.login_fields}) -%}
  {%- endif -%}
  {%- endfor -%}
  {{ _secrets }}
