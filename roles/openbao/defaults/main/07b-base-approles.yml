---
openbao_base_approles_core:
  # terraform-apply is the OpenTofu identity, and OpenTofu authors config —
  # so it composes config-write onto its own policy rather than carrying a
  # second credential for the same job.
  - name: "{{ openbao_terraform_apply_approle_name }}"
    token_policies:
      - "{{ openbao_terraform_apply_policy_name }}"
      - "{{ openbao_config_write_policy_name }}"
  # flow-lock receives a fresh secret_id from approle-issuer for each command;
  # there is no standing host or workstation secret_id to age out.
  - name: "{{ openbao_flow_lock_approle_name }}"
    policy: "{{ openbao_flow_lock_policy_name }}"
    secret_id_issuance: per_call
    secret_id_ttl: "{{ openbao_approle_per_call_secret_id_ttl }}"
    secret_id_num_uses: "{{ openbao_approle_per_call_secret_id_num_uses }}"
  - name: "{{ openbao_ai_sessions_backup_approle_name }}"
    policy: "{{ openbao_ai_sessions_backup_policy_name }}"
  - name: "{{ openbao_packer_approle_name }}"
    policy: "{{ openbao_packer_policy_name }}"
  # ansible-converge additionally signs automation-ansible SSH certs: the
  # pre-play mint in each repo's run-ansible.sh replaces the shared static key.
  # It is also the Ansible config author, so it composes config-write too.
  - name: "{{ openbao_ansible_converge_approle_name }}"
    token_policies: >-
      {{ [openbao_ansible_converge_policy_name, openbao_config_write_policy_name]
         + (['ssh-sign-automation-ansible'] if openbao_ssh_engine_enabled else []) }}
  # The unattended execution plane. Attaches ansible-converge (the shared
  # consumer inventory) plus its own delta, and signs SSH certificates under
  # ssh-sign-automation-semaphore rather than ...-ansible, so the principal on
  # the wire says which caller ran the converge.
  #
  # Unlimited secret_id, with the reason 08a-admin-and-ttls.yml requires: nothing
  # re-mints this one. It is written once into the execution plane's stored
  # environment, so a finite bound retires a credential nothing replaces and
  # every scheduled run then fails reporting an expired login. What bounds this
  # identity is its grant — enumerated read on named paths — not its lifetime.
  # Give it a lifetime back when something re-mints on a schedule.
  # "0s" not 0: 10c compares via to_seconds, which splits its input.
  # No config-write: that capability belongs to the systems that AUTHOR config
  # (see config-write-policy.hcl.j2), and this one only runs them. Attaching it
  # would make a third holder of a deliberately two-holder capability.
  #
  # It also carries the RECONCILE policy: without it an unattended converge
  # skips the whole provisioning path and still reports success. On the
  # existing holder, never a second identity — see the test named below.
  # tests/plane_identity_bounds/verify.yml asserts what keeps this safe.
  - name: "{{ openbao_semaphore_approle_name }}"
    secret_id_ttl: "0s"
    secret_id_num_uses: 0
    token_policies: >-
      {{ [openbao_ansible_converge_policy_name, openbao_semaphore_policy_name,
          openbao_reconcile_policy_name]
         + (['ssh-sign-automation-semaphore'] if openbao_ssh_engine_enabled else []) }}
  # These six are the converge-domain prefetch identities (same
  # openbao_secrets_domains loop noted at their machine_or_workstation CIDR
  # entries in 08b). The 24h default secret_id_ttl once meant each pair went
  # stale within a day with nothing to re-mint it, isolating the domain's
  # hosts on the next converge (Vikunja 3197) -- that is what made these
  # non-expiring. playbooks/openbao-rotate-approles.yml (scheduled, every
  # 12h) is now the thing that re-mints them, so a finite bound no longer
  # reproduces that failure; bounded by both the machine_or_workstation
  # source class and the rotation schedule's own margin.
  #
  # secret_id_ttl is declared in openbao_approle_secret_id_ttl_overrides
  # (08a-admin-and-ttls.yml, openbao_rotated_domain_secret_id_ttl), not
  # inline here: playbooks/openbao-rotate-approles.yml reads that override
  # map directly to learn each domain's bound without a live
  # `auth/approle/role/<name>` read, so the ttl must live somewhere a
  # standalone playbook can include without pulling in this whole file's
  # other item fields (several reference vars, such as
  # openbao_read_all_policies, that playbook never loads).
  - name: "{{ openbao_observability_approle_name }}"
    policy: "{{ openbao_observability_policy_name }}"
    secret_id_num_uses: 0
  - name: "{{ openbao_local_cloud_approle_name }}"
    policy: "{{ openbao_local_cloud_policy_name }}"
    secret_id_num_uses: 0
  - name: "{{ openbao_monitoring_approle_name }}"
    policy: "{{ openbao_monitoring_policy_name }}"
    secret_id_num_uses: 0
  - name: "{{ openbao_media_approle_name }}"
    policy: "{{ openbao_media_policy_name }}"
    secret_id_num_uses: 0
  - name: "{{ openbao_ntfy_approle_name }}"
    policy: "{{ openbao_ntfy_policy_name }}"
    secret_id_num_uses: 0
  - name: "{{ openbao_apps_approle_name }}"
    token_policies:
      - "{{ openbao_apps_policy_name }}"
      - "{{ openbao_bao_elevate_client_policy_name }}"
    secret_id_num_uses: 0
  # local-llm additionally attaches the exact external provider-key leaves.
  # Model selection and limits remain in LiteLLM configuration; adding a
  # provider to the inventory does not enable a model or require the leaf to
  # be seeded.
  # Unlimited uses like the domains above: every converge and router start
  # redeems it, so a use cap empties it between rotations.
  - name: "{{ openbao_local_llm_approle_name }}"
    token_policies: >-
      {{ [openbao_local_llm_policy_name] + openbao_ai_api_key_policy_names
         + ([openbao_roster_owned_mcp_deny_policy_name]
            if openbao_roster_owned_slug_names | length > 0 else []) }}
    secret_id_num_uses: 0
  # local-llm-workstation: workstation reads of secret/ai/llm. Separate from
  # local-llm so workstation logins cannot exhaust the plane's secret_id.
  # 36h ttl (rotated-domain margin); 100 uses per secret_id, replaced every 12h.
  - name: "{{ openbao_local_llm_workstation_approle_name }}"
    policy: "{{ openbao_local_llm_workstation_policy_name }}"
    secret_id_num_uses: 100
  # agent-ssh-sign: workstation signing of non-root SSH certificates for the
  # roles in openbao_agent_ssh_sign_roles (automation-ai, 2h; automation-ai-diag,
  # 15m). No read policy. Token lives at most as long as one certificate.
  # 36h ttl (rotated-domain margin); 100 uses per secret_id.
  - name: "{{ openbao_agent_ssh_sign_approle_name }}"
    token_policies: >-
      {{ openbao_agent_ssh_sign_roles | map('regex_replace', '^', 'ssh-sign-') | list }}
    token_ttl: 30m
    token_max_ttl: 2h
    secret_id_num_uses: 100
  # hermes / ai-donna: rotated domains redeemed on every converge and agent
  # start; unlimited uses, bounded by the machine class and the rotated ttl.
  - name: "{{ openbao_hermes_approle_name }}"
    policy: "{{ openbao_hermes_policy_name }}"
    secret_id_num_uses: 0
  - name: "{{ openbao_hermes_write_approle_name }}"
    policy: "{{ openbao_hermes_write_policy_name }}"
  # llm-router-write: single-purpose writer for the llm-router Redis credential,
  # same shape as hermes-write above — standing secret_id in Doppler (NOT inert),
  # so the seed mints a short-lived writer token without a superuser unlock.
  - name: "{{ openbao_llm_router_write_approle_name }}"
    policy: "{{ openbao_llm_router_write_policy_name }}"
  - name: "{{ openbao_ai_donna_approle_name }}"
    policy: "{{ openbao_ai_donna_policy_name }}"
    secret_id_num_uses: 0
  # config-read: sole consumer identity on the non-secret `config` mount.
  # Read + list everywhere in that mount, nothing outside it. Like `public`,
  # leaking it costs nothing — the mount holds no exploitable value by
  # construction — so it is shipped ambiently rather than human-gated.
  - name: "{{ openbao_config_read_approle_name }}"
    policy: "{{ openbao_config_read_policy_name }}"
  # approle-audit: standing, ambient read-only identity like config-read —
  # read + list can never mint or reveal a secret_id value (see the policy
  # template header), so leaking this one costs nothing exploitable.
  # Nothing re-mints it; bounded by address class and a read-only grant.
  - name: "{{ openbao_approle_audit_approle_name }}"
    policy: "{{ openbao_approle_audit_policy_name }}"
    secret_id_ttl: "0s"
    secret_id_num_uses: 0
  # ai-public: read-only fabric-brain domain, held by the brain-sync timers and
  # now the lower-trust harness tier. Nothing re-mints it; its read-only grant
  # is the bound.
  - name: "{{ openbao_ai_public_approle_name }}"
    policy: "{{ openbao_ai_public_policy_name }}"
    secret_id_ttl: "0s"
    secret_id_num_uses: 0
  # GitHub token tiers: engine mints, tokens never stored. github-read and
  # github-write are standing ambient identities consumed by nix-darwin's
  # `openbao-github-creds` (role_id/secret_id operator-held in Doppler,
  # injected as ambient env, same shape as ai-orchestrator). github-write is
  # bounded by the App installation's repository selection + the write-lease
  # lock rather than a human gate (ambient write, operator decision).
  # github-admin is INERT break-glass like ai-admin: no standing secret_id; a
  # human wraps a single-use secret_id per elevation.
  # secret_id_ttl "0s" + num_uses 0: nothing re-mints these, so a finite bound
  # expires a credential nothing replaces. Same reason as semaphore above and
  # the three in 07d. "0s" not 0: 10c compares via to_seconds.
  - name: "{{ openbao_github_read_approle_name }}"
    policy: "{{ openbao_github_read_policy_name }}"
    secret_id_ttl: "0s"
    secret_id_num_uses: 0
  - name: "{{ openbao_github_write_approle_name }}"
    policy: "{{ openbao_github_write_policy_name }}"
    token_ttl: 30m  # write identity gets a short token TTL
    secret_id_ttl: "0s"
    secret_id_num_uses: 0
  # github-repo-create: standing ambient identity, ceiling administration:write
  # only — no per-repo allowlist to pin; boundary is dryvist-repo-create's map.
  - name: "{{ openbao_github_repo_create_approle_name }}"
    policy: "{{ openbao_github_repo_create_policy_name }}"
    token_ttl: 30m  # short TTL like github-write
    secret_id_ttl: "0s"
    secret_id_num_uses: 0
  - name: "{{ openbao_github_admin_approle_name }}"
    policy: "{{ openbao_github_admin_policy_name }}"
    token_ttl: "{{ openbao_ai_admin_token_ttl }}"
    token_max_ttl: "{{ openbao_ai_admin_token_ttl }}"
    manage_secret_id: false
    secret_id_ttl: "{{ openbao_ai_elevated_secret_id_ttl }}"
    secret_id_num_uses: 1
  - name: "{{ openbao_github_runner_approle_name }}"
    policy: "{{ openbao_github_runner_policy_name }}"
    token_ttl: 15m
  # The CI telemetry collector: runner state from its exporter set, and runs,
  # jobs and pull requests for every owner through the exporter policy's
  # pinned metadata-only map. No other policy: OpenBao unions parameter
  # constraints across policies, so a second grant on github/token widens it.
  - name: "{{ openbao_github_exporter_approle_name }}"
    policy: "{{ openbao_github_exporter_policy_name }}"
    token_ttl: 15m
  # Hatchet eval status reporting mints its one repository-scoped set per run.
  - name: "{{ openbao_hatchet_eval_status_approle_name }}"
    policy: "{{ openbao_hatchet_eval_status_policy_name }}"
    token_ttl: 15m
  - name: "{{ openbao_reconcile_approle_name }}"
    policy: "{{ openbao_reconcile_policy_name }}"
    token_ttl: "{{ openbao_reconcile_approle_token_ttl }}"
    token_max_ttl: "{{ openbao_reconcile_approle_token_ttl }}"
    # This role receives one secret_id per call through approle-issuer. It is
    # never probed, rotated, or published as stored secret-zero.
    secret_id_issuance: per_call
    secret_id_ttl: "{{ openbao_approle_per_call_secret_id_ttl }}"
    secret_id_num_uses: "{{ openbao_reconcile_approle_secret_id_num_uses }}"
  # approle-issuer: mints secret_ids for the enumerated non-break-glass roles
  # and does nothing else. Its own token TTL is short because a mint is a
  # single operation, not a session — nothing legitimate holds this for hours.
  # Its secret_id must not expire: this is the only identity that may mint a
  # secret_id, and its policy excludes its own role, so nothing but the human
  # tier can replace it. Bounded by its address class and a mint-only policy.
  - name: "{{ openbao_approle_issuer_approle_name }}"
    policy: "{{ openbao_approle_issuer_policy_name }}"
    token_ttl: 15m
    token_max_ttl: 30m
    secret_id_ttl: "0s"
    secret_id_num_uses: 0
  # ai-orchestrator: role_id/secret_id are operator-held in Doppler tier-0
  # (services BAO_AI_ORCHESTRATOR_ROLE_ID / _SECRET_ID), consumed as ambient env.
  # This AppRole already exists LIVE with a non-expiring secret_id in active
  # use; init.yml only creates + mints creds for AppRoles missing this run, so
  # a converge leaves the live role and its secret_id untouched (existence-only).
  - name: "{{ openbao_ai_orchestrator_approle_name }}"
    policy: "{{ openbao_ai_orchestrator_policy_name }}"
    token_ttl: 30m  # demoted: broad-write identity gets a short token TTL
  # open-llm: the untrusted-tier dispatcher. Machine class, bound to the
  # dispatcher host's /32. Its secret_id takes the rotated-domain ttl with
  # unlimited uses (08a overrides); tests/plane_identity_bounds/verify.yml pins both.
  # 15m token, renewed up to a 60m job budget through the default policy's
  # renew-self.
  - name: "{{ openbao_open_llm_approle_name }}"
    policy: "{{ openbao_open_llm_policy_name }}"
    secret_id_bound_cidrs: "{{ openbao_open_llm_secret_id_cidr }}"
    token_ttl: 15m
    token_max_ttl: 60m
  # ci-resolver: dispatcher-side mint identity, on the same machine class and
  # source-address bound as open-llm, with the same short renewable token.
  - name: "{{ openbao_github_ci_resolver_approle_name }}"
    policy: "{{ openbao_github_ci_resolver_policy_name }}"
    secret_id_bound_cidrs: "{{ openbao_open_llm_secret_id_cidr }}"
    token_ttl: 15m
    token_max_ttl: 60m
  # git-mirror: the Git mirror guest's token identity. It stays on the default
  # machine class (08b) and is rotated with the openbao_secrets domain identities
  # (05c), so its env-document pair is republished on each rotation.
  - name: "{{ openbao_github_git_mirror_approle_name }}"
    policy: "{{ openbao_github_git_mirror_policy_name }}"
    token_ttl: 15m
    token_max_ttl: 60m
  # openhands: service-runtime identity for the dedicated GitHub App mount,
  # bound to the OpenHands guest's /32, with a 1h token and the rotated-domain secret_id from the 08a overrides.
  - name: "{{ openbao_openhands_approle_name }}"
    policy: "{{ openbao_openhands_policy_name }}"
    secret_id_bound_cidrs: "{{ openbao_openhands_secret_id_cidr }}"
    token_ttl: 1h
    token_max_ttl: 1h
  # ai-readonly / ai-elevated ACTOR roles: standing (ambient) READ tiers. Both
  # attach the shared global KV and non-secret metadata policy plus read-all;
  # ai-elevated also keeps its read-only extras (secret/platform/*).
  # Redeemed interactively by `aikey`; nothing re-mints it.
  - name: "{{ openbao_ai_readonly_approle_name }}"
    token_policies: "{{ openbao_ai_trusted_read_all_policies }}"
    secret_id_ttl: "0s"
    secret_id_num_uses: 0
  # ai-elevated additionally attaches ssh-sign-automation-ai: the STANDING
  # ability to mint 1h ai-agent SSH certs. Deliberate, documented tradeoff
  # (agents must pull SSH access friction-free) — bounded by non-root
  # principals, default-deny host opt-in, cert TTL, and audit-logged signs.
  # unifi-read joins the same standing read tier through its own exact-leaf
  # policy, NOT through openbao_ai_domains: a `unifi` domain entry would render
  # read-unifi over the whole secret/unifi/* subtree and put the write, admin
  # and terrakube credential leaves on every elevated actor too.
  - name: "{{ openbao_ai_elevated_approle_name }}"
    token_policies: >-
      {{ openbao_ai_trusted_read_all_policies
         + (openbao_ai_readonly_extra_subtrees | map('regex_replace', '^(.+)$', 'read-\1') | list)
         + [openbao_unifi_read_policy_name]
         + (['ssh-sign-automation-ai'] if openbao_ssh_engine_enabled else []) }}
  # Enterprise GitHub tiers use raw token endpoints pinned by their policies.
  # Both roles are inert: a human unlocks one single-use secret_id per elevation.
  - name: "{{ openbao_github_enterprise_read_approle_name }}"
    policy: "{{ openbao_github_enterprise_read_policy_name }}"
    token_ttl: "{{ openbao_ai_admin_token_ttl }}"
    token_max_ttl: "{{ openbao_ai_admin_token_ttl }}"
    manage_secret_id: false
    secret_id_ttl: "{{ openbao_ai_elevated_secret_id_ttl }}"
    secret_id_num_uses: 1
  - name: "{{ openbao_github_enterprise_admin_approle_name }}"
    policy: "{{ openbao_github_enterprise_admin_policy_name }}"
    token_ttl: "{{ openbao_ai_admin_token_ttl }}"
    token_max_ttl: "{{ openbao_ai_admin_token_ttl }}"
    manage_secret_id: false
    secret_id_ttl: "{{ openbao_ai_elevated_secret_id_ttl }}"
    secret_id_num_uses: 1
  # The workstation-only Nautobot token publisher is inert: a human unlocks
  # one single-use secret_id for each token publication or rotation.
  - name: "{{ openbao_nautobot_token_publisher_approle_name }}"
    policy: "{{ openbao_nautobot_token_publisher_policy_name }}"
    token_ttl: "{{ openbao_ai_admin_token_ttl }}"
    token_max_ttl: "{{ openbao_ai_admin_token_ttl }}"
    manage_secret_id: false
    secret_id_ttl: "{{ openbao_ai_elevated_secret_id_ttl }}"
    secret_id_num_uses: 1
  # The workstation-only Hatchet worker-token publisher is inert the same way.
  - name: "{{ openbao_hatchet_token_publisher_approle_name }}"
    policy: "{{ openbao_hatchet_token_publisher_policy_name }}"
    token_ttl: "{{ openbao_ai_admin_token_ttl }}"
    token_max_ttl: "{{ openbao_ai_admin_token_ttl }}"
    manage_secret_id: false
    secret_id_ttl: "{{ openbao_ai_elevated_secret_id_ttl }}"
    secret_id_num_uses: 1
# openbao_base_approles_elevated (iac-platform-deploy through slack-ops) lives
# in 07f-elevated-approles.yml — split for the CI token-limits gate.
# openbao_seed_writer_approles lives in 07i-seed-writer-approles.yml.
openbao_base_approles: >-
  {{ openbao_base_approles_core + openbao_base_approles_elevated
     + openbao_hermes_private_agent_approles + openbao_sandbox_agent_approles
     + openbao_pepper_approles + openbao_workstation_ssh_key_reader_approles
     + openbao_app_agent_tier_reader_approles
     + openbao_dify_agent_approles + openbao_seed_writer_approles
     + openbao_window_service_approles }}
openbao_roster_agent_approles: >-
  {%- set _entries = [] -%}
  {%- for agent in openbao_roster_agent_valid_names -%}
  {%- set _ = _entries.append({'name': agent, 'policy': agent,
      'secret_id_num_uses': 0}) -%}
  {%- endfor -%}
  {{ _entries }}
# Full AppRole set = the static base above + the per-service ai-apply-<svc> actor
# roles generated from openbao_ai_domains. init.yml loops this combined list.
openbao_approles: >-
  {{ openbao_base_approles + openbao_live_only_approles + openbao_rotation_approles
     + openbao_workstation_approles
     + openbao_ai_apply_approles + openbao_github_write_scope_approles
     + openbao_roster_agent_approles + openbao_roster_key_reader_approles }}
