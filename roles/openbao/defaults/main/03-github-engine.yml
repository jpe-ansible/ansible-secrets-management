---
# --- GitHub secrets engine (ephemeral GitHub App installation tokens) ------
# Independent from the AWS engine: it has its own mount, catalog entry,
# configuration, permission sets, policy grant, and leases. The App private key
# is required only for first configuration/rotation and is never stored in KV.
openbao_github_engine_enabled: true
# The infra/admin App's mount. Everyday read and write tokens come from the
# `github` mount (03b-github-app-mounts.yml), backed by a different App.
openbao_github_mount: github-admin
openbao_github_plugin_name: vault-plugin-secrets-github
openbao_github_plugin_version: "2.3.2"
openbao_github_plugin_catalog_version: "v{{ openbao_github_plugin_version }}"
openbao_github_plugin_release_base_url: >-
  https://github.com/martinbaillie/vault-plugin-secrets-github/releases/download
openbao_github_plugin_release_tag: "v{{ openbao_github_plugin_version }}"
openbao_github_plugin_asset: vault-plugin-secrets-github-linux-amd64
openbao_github_plugin_command: >-
  {{ openbao_github_plugin_asset }}-v{{ openbao_github_plugin_version }}
openbao_github_plugin_asset_url: >-
  {{ openbao_github_plugin_release_base_url }}/{{ openbao_github_plugin_release_tag
  }}/{{ openbao_github_plugin_asset }}
openbao_github_plugin_checksums_filename: SHA256SUMS
openbao_github_plugin_checksums_url: >-
  {{ openbao_github_plugin_release_base_url }}/{{ openbao_github_plugin_release_tag
  }}/{{ openbao_github_plugin_checksums_filename }}
openbao_github_plugin_checksums_signature_url: >-
  {{ openbao_github_plugin_checksums_url }}.sig
openbao_github_app_id: "{{ lookup('env', 'OPENBAO_GITHUB_APP_ID') | default('', true) }}"
openbao_github_app_private_key: >-
  {{ lookup('env', 'OPENBAO_GITHUB_APP_PRIVATE_KEY') | default('', true) }}
# Mount names whose already-configured App gets its private key rewritten from
# the supplied one on this run. The supplied App ID must equal the stored one
# and the key must be non-empty. A mount not listed is written only on first
# configuration. Applies to openbao_github_mount and every
# openbao_github_app_mounts entry.
openbao_github_app_key_rotate_mounts: []
openbao_github_dryvist_installation_id: >-
  {{ openbao_platform_env['OPENBAO_GITHUB_ADMIN_DRYVIST_INSTALLATION_ID'] | default('', true) }}
openbao_github_personal_installation_id: >-
  {{ openbao_platform_env['OPENBAO_GITHUB_ADMIN_PERSONAL_INSTALLATION_ID'] | default('', true) }}
openbao_github_jacobpevans_installation_id: >-
  {{ openbao_platform_env['OPENBAO_GITHUB_ADMIN_JACOBPEVANS_INSTALLATION_ID'] | default('', true) }}
openbao_github_jacobpevans_ai_installation_id: >-
  {{ openbao_platform_env['OPENBAO_GITHUB_ADMIN_JACOBPEVANS_AI_INSTALLATION_ID'] | default('', true) }}
# The admin App's personal-account installation, under its own name.
# openbao_github_personal_installation_id is also set in 03b-github-app-mounts.yml
# for the user-owned App, and that later definition wins at load time.
openbao_github_admin_personal_installation_id: >-
  {{ openbao_platform_env['OPENBAO_GITHUB_ADMIN_PERSONAL_INSTALLATION_ID'] | default('', true) }}
openbao_github_jpe_ansible_installation_id: >-
  {{ openbao_platform_env['OPENBAO_GITHUB_ADMIN_JPE_ANSIBLE_INSTALLATION_ID'] | default('', true) }}
openbao_github_jpe_cribl_installation_id: >-
  {{ openbao_platform_env['OPENBAO_GITHUB_ADMIN_JPE_CRIBL_INSTALLATION_ID'] | default('', true) }}
openbao_github_jpe_nix_installation_id: >-
  {{ openbao_platform_env['OPENBAO_GITHUB_ADMIN_JPE_NIX_INSTALLATION_ID'] | default('', true) }}
openbao_github_jpe_private_installation_id: >-
  {{ openbao_platform_env['OPENBAO_GITHUB_ADMIN_JPE_PRIVATE_INSTALLATION_ID'] | default('', true) }}
openbao_github_jpe_ai_agents_installation_id: >-
  {{ openbao_platform_env['OPENBAO_GITHUB_ADMIN_JPE_AI_AGENTS_INSTALLATION_ID'] | default('', true) }}
openbao_github_jpe_claude_installation_id: >-
  {{ openbao_platform_env['OPENBAO_GITHUB_ADMIN_JPE_CLAUDE_INSTALLATION_ID'] | default('', true) }}
openbao_github_jpe_splunk_installation_id: >-
  {{ openbao_platform_env['OPENBAO_GITHUB_ADMIN_JPE_SPLUNK_INSTALLATION_ID'] | default('', true) }}
openbao_github_jpe_openbao_plugin_secrets_installation_id: >-
  {{ openbao_platform_env['OPENBAO_GITHUB_ADMIN_JPE_OPENBAO_PLUGIN_SECRETS_INSTALLATION_ID'] | default('', true) }}
# The standard read list: the one place a read tier's permissions are named.
# Applied to ALL repos of the installation (no repositories list on the read
# sets — the blast radius of a leaked read token is "can read", not "can
# change"). A derive_read mount's `read` set is this list cut to its App's grant.
openbao_github_read_permissions:
  contents: read
  metadata: read
  pull_requests: read
  issues: read
  actions: read
  checks: read
  statuses: read
  # Code-scanning and Dependabot findings. `checks`/`statuses` only expose the
  # pass/fail rollup of an analysis, not the alerts themselves, so without
  # these a read token gets 403 "Resource not accessible by integration" from
  # the code-scanning and Dependabot alert endpoints — which is most of the
  # point of a read tier for CI triage. Both are read-only here and well inside
  # the App's ceiling (it is granted security_events: write).
  security_events: read
  vulnerability_alerts: read
# repo-create tier: exactly one permission, exactly this value. Widening it
# defeats the narrow-tier design (add a new tier instead of broadening this
# one) — asserted verbatim in tasks/init/05-github-engine.yml.
openbao_github_repo_create_permissions:
  administration: write
# Personal-account write tier: a fixed App permission set, pinned to the
# personal App's installation. It is declared only when that installation ID
# is configured; the App's own grant remains the ceiling.
openbao_github_personal_write_set_name: personal-write
openbao_github_personal_write_permissions:
  contents: write
  pull_requests: write
  workflows: write
  checks: read
  statuses: read
  metadata: read
openbao_github_personal_permission_sets: >-
  {{ [{'name': openbao_github_personal_write_set_name,
       'tier': 'write',
       'installation_id': openbao_github_personal_installation_id,
       'permissions': openbao_github_personal_write_permissions}]
     if openbao_github_personal_installation_id | length > 0 else [] }}
# Pepper's set uses its own tier so github-mint cannot inherit this grant.
openbao_github_pepper_read_set_name: pepper-vault-read
openbao_github_pepper_read_tier: pepper-read
openbao_github_pepper_read_permissions:
  contents: read
  metadata: read
openbao_github_pepper_permission_sets: >-
  {{ [{'name': openbao_github_pepper_read_set_name,
       'tier': openbao_github_pepper_read_tier,
       'installation_id': openbao_github_pepper_installation_id,
       'repositories': openbao_github_pepper_repositories,
       'permissions': openbao_github_pepper_read_permissions}]
     if (openbao_github_pepper_installation_id | length > 0
         and openbao_github_pepper_app_id | length > 0
         and openbao_github_pepper_app_private_key | length > 0
         and openbao_github_pepper_repositories | length > 0
         and (openbao_github_pepper_repositories
              | select('match', '^[A-Za-z0-9_.-]+$') | list | length)
             == openbao_github_pepper_repositories | length)
     else [] }}
# org-admin tier: exactly one permission, organization-level. Org rulesets and
# other organization settings; asserted verbatim like the repo-create map.
openbao_github_org_admin_permissions:
  organization_administration: write
# Org Actions secrets use only the organization_secrets permission.
openbao_github_org_secrets_permissions:
  organization_secrets: write
# Runner registration is organization-scoped.  This is deliberately separate
# from repository read/write credentials: it cannot read source or name a
# repository, and only mints the short-lived registration token a runner needs.
openbao_github_runner_permissions:
  organization_self_hosted_runners: write
# A dispatch token is restricted to one repository in a known installation.
openbao_github_dispatch_owner: >-
  {{ openbao_platform_env['OPENBAO_GITHUB_DISPATCH_OWNER'] | default('', true) | trim }}
openbao_github_dispatch_repository: >-
  {{ openbao_platform_env['OPENBAO_GITHUB_DISPATCH_REPOSITORY'] | default('', true) | trim }}
openbao_github_dispatch_permissions:
  actions: write
  metadata: read
openbao_github_dispatch_permission_sets: >-
  {%- set _sets = [] -%}
  {%- for org in openbao_github_org_secrets_installations -%}
  {%- if _sets | length == 0 and openbao_github_dispatch_owner | length > 0
      and openbao_github_dispatch_repository | length > 0
      and org.name == openbao_github_dispatch_owner
      and org.installation_id | default('', true) | string | trim | length > 0 -%}
  {%- set _ = _sets.append({'name': 'workflow-dispatch', 'tier': 'agents',
      'installation_id': org.installation_id,
      'repositories': [openbao_github_dispatch_repository],
      'permissions': openbao_github_dispatch_permissions}) -%}
  {%- endif -%}
  {%- endfor -%}
  {{ _sets }}
# CI-metrics exporter (github_exporter role, prometheus host). Read-only,
# organization-scoped: `actions:read` for the workflow_runs/workflow_jobs/
# runners collectors, `administration:read` for the org-level runners listing.
# No `contents`/`pull_requests`/`issues` — this identity never reads source.
openbao_github_exporter_permissions:
  actions: read
  administration: read
# Must equal the telemetry collector's GitHub token login body.
openbao_github_telemetry_permissions:
  actions: read
  checks: read
  metadata: read
  pull_requests: read
  statuses: read
# Publish tier: the ONE set that both WRITES and is repository-scoped. The
# scope lives in the set itself — installation_id, the repository list and the
# permission map are all stored server-side, and the permission-set token path
# ignores request bodies at plugin v2.3.2, so a holder can widen none of them.
# That is why this is a set rather than a github-write realm: a publisher runs
# unattended and should carry no ability to name its own target.
openbao_github_docs_publisher_set_name: docs-publisher
openbao_github_docs_publisher_permissions:
  contents: write
  pull_requests: write
# The repository name is supplied by the iac secret store, NOT inline: this
# repository is public and the installation covers private repositories, the
# repository selection remains explicit. Unset yields no set at all
# rather than a set with an empty repository list — an omitted `repositories`
# on a permission set means the WHOLE installation, so an unconfigured
# publisher must not exist rather than exist unbounded. Explicit literals
# only, never a glob: the plugin comma-splits the value, so "a,evil" would
# ride an "a*" prefix.
openbao_github_docs_publisher_repos: >-
  {{ (lookup('env', 'OPENBAO_GITHUB_DOCS_PUBLISHER_REPOS') | default('', true)).split(',')
     | map('trim') | reject('equalto', '') | list }}
# App bucket the publisher policy may read (01c-app-secrets-generated.yml).
openbao_github_docs_publisher_kv_app: github-actions
# CI resolver tier: one explicitly repository-scoped stored set. With no
# repository list the set is omitted; an omitted repositories key would mean
# the whole installation.
openbao_github_ci_resolver_set_name: ci-resolver-dryvist
openbao_github_ci_resolver_permissions:
  actions: write
  checks: write
  contents: write
  pull_requests: write
# Explicit repository names only, supplied by the secret store; no globs.
openbao_github_ci_resolver_repos: >-
  {{ (lookup('env', 'OPENBAO_GITHUB_CI_RESOLVER_REPOS') | default('', true)).split(',')
     | map('trim') | reject('equalto', '') | list }}
openbao_github_ci_resolver_permission_sets: >-
  {{ [{'name': openbao_github_ci_resolver_set_name,
       'tier': 'ci-resolver',
       'installation_id': openbao_github_dryvist_installation_id,
       'repositories': openbao_github_ci_resolver_repos,
       'permissions': openbao_github_ci_resolver_permissions}]
     if openbao_github_ci_resolver_repos | length > 0 else [] }}
# While that repository list is empty the ci-resolver policy renders no grants,
# so it is not scheduled for writing: a stored policy is never replaced by an
# empty document, and the empty-policy check has nothing to refuse.
openbao_unscheduled_empty_policy_names: >-
  {{ [] if openbao_github_ci_resolver_repos | length > 0
     else [openbao_github_ci_resolver_policy_name] }}
# OpenHands uses one set on its dedicated App mount, bounded by that
# installation's repository selection.
openbao_github_openhands_set_name: openhands-pilot
openbao_github_openhands_permissions:
  checks: read
  contents: write
  metadata: read
  pull_requests: write
openbao_github_openhands_permission_sets: >-
  {{ [{'name': openbao_github_openhands_set_name,
       'tier': 'openhands',
       'installation_id': openbao_github_openhands_installation_id,
       'permissions': openbao_github_openhands_permissions}]
     if (openbao_github_openhands_installation_id | length > 0
         and openbao_github_openhands_app_id | length > 0
         and openbao_github_openhands_app_private_key | length > 0) else [] }}
# The docs site's router snapshot workflow opens its pull request in the docs
# SOURCE repository, so its set names that repository and nothing else. Same
# rule as the publisher set: an unset repository yields no set. Tier `agents`
# keeps it out of the ambient mint and orchestrator policies; only the
# docs-router-snapshot policy names it.
openbao_github_router_snapshot_set_name: docs-router-snapshot
# The installation follows the source repository's owner, so the set moves with
# the repository; an owner outside the installation catalog yields no set.
openbao_github_router_snapshot_installation_id: >-
  {{ openbao_github_org_secrets_installations
     | selectattr('name', 'equalto', (openbao_github_oidc_docs_repository.split('/') | first | lower))
     | map(attribute='installation_id') | first | default('', true) }}
openbao_github_router_snapshot_permission_sets: >-
  {{ [{'name': openbao_github_router_snapshot_set_name,
       'tier': 'agents',
       'installation_id': openbao_github_router_snapshot_installation_id,
       'repositories': [openbao_github_oidc_docs_repository.split('/') | last],
       'permissions': openbao_github_docs_publisher_permissions}]
     if openbao_github_router_snapshot_installation_id | string | length > 0 else [] }}
# The git mirror guest reads every repository of three owners, one installation
# each, through read-only sets with no repository list (so each covers the whole
# installation). Tier `agents` keeps them out of the ambient mint and orchestrator
# policies; only the git-mirror policy names them. A set is declared only while
# its owner's installation ID is configured.
openbao_github_git_mirror_permissions:
  contents: read
  metadata: read
openbao_github_git_mirror_set_names:
  - git-mirror-dryvist
  - git-mirror-JacobPEvans
  - git-mirror-JacobPEvans-personal
openbao_github_git_mirror_permission_sets: >-
  {{ [{'name': 'git-mirror-dryvist',
       'tier': 'agents',
       'installation_id': openbao_github_dryvist_installation_id,
       'permissions': openbao_github_git_mirror_permissions},
      {'name': 'git-mirror-JacobPEvans',
       'tier': 'agents',
       'installation_id': openbao_github_jacobpevans_installation_id,
       'permissions': openbao_github_git_mirror_permissions},
      {'name': 'git-mirror-JacobPEvans-personal',
       'tier': 'agents',
       'installation_id': openbao_github_admin_personal_installation_id,
       'permissions': openbao_github_git_mirror_permissions}]
     | selectattr('installation_id') | list }}
# The Hatchet eval worker can post commit statuses to one repository only.
openbao_github_role_eval_status_set_name: role-eval-status
openbao_github_role_eval_status_permissions:
  statuses: write
  metadata: read
openbao_github_role_eval_status_permission_sets:
  - name: "{{ openbao_github_role_eval_status_set_name }}"
    tier: agents
    installation_id: "{{ openbao_github_dryvist_installation_id }}"
    repositories: [ansible-proxmox-ai]
    permissions: "{{ openbao_github_role_eval_status_permissions }}"
# PR-automation workflow files: contents, pull requests and workflows write,
# nothing else, one set per Enterprise installation in
# openbao_github_org_secrets_installations (named <org>-workflows-write). Tier
# `admin`: only github-admin-policy grants it, so the everyday write,
# orchestrator and ambient policies cannot mint it. An installation without an
# ID gets no set. The personal account is covered by its own mount's
# personal-write set.
openbao_github_workflows_write_set_suffix: -workflows-write
openbao_github_workflows_write_permissions:
  contents: write
  pull_requests: write
  workflows: write
openbao_github_workflows_write_permission_sets: >-
  {%- set _sets = [] -%}
  {%- for org in openbao_github_org_secrets_installations -%}
  {%- if org.installation_id | default('', true) | string | length > 0 -%}
  {%- set _ = _sets.append({'name': org.name ~ openbao_github_workflows_write_set_suffix,
      'tier': 'admin', 'installation_id': org.installation_id,
      'permissions': openbao_github_workflows_write_permissions}) -%}
  {%- endif -%}
  {%- endfor -%}
  {{ _sets }}
openbao_github_docs_publisher_permission_sets: >-
  {{ [{'name': openbao_github_docs_publisher_set_name,
       'tier': 'publish',
       'installation_id': openbao_github_dryvist_installation_id,
       'repositories': openbao_github_docs_publisher_repos,
       'permissions': openbao_github_docs_publisher_permissions}]
     if openbao_github_docs_publisher_repos | length > 0 else [] }}
# Dify PR automation uses repository names relative to the JacobPEvans-ai
# installation. Both sets share this single allowlist; an omitted repository
# field would grant the whole installation, so no empty set is declared.
openbao_dify_pr_automation_repositories:
  - pr-automation-fixture
openbao_github_dify_pr_automation_read_set_name: dify-pr-automation-read
openbao_github_dify_pr_automation_write_set_name: dify-pr-automation-write
openbao_github_dify_pr_automation_read_permissions:
  contents: read
  pull_requests: read
  checks: read
  statuses: read
  metadata: read
openbao_github_dify_pr_automation_write_permissions: >-
  {{ openbao_github_dify_pr_automation_read_permissions
     | combine({'contents': 'write', 'pull_requests': 'write'}) }}
openbao_github_dify_pr_automation_permission_sets: >-
  {{ [{'name': openbao_github_dify_pr_automation_read_set_name,
       'tier': 'agents',
       'installation_id': openbao_github_jacobpevans_ai_installation_id,
       'repositories': openbao_dify_pr_automation_repositories,
       'permissions': openbao_github_dify_pr_automation_read_permissions},
      {'name': openbao_github_dify_pr_automation_write_set_name,
       'tier': 'agents',
       'installation_id': openbao_github_jacobpevans_ai_installation_id,
       'repositories': openbao_dify_pr_automation_repositories,
       'permissions': openbao_github_dify_pr_automation_write_permissions}]
     if (openbao_github_jacobpevans_ai_installation_id | length > 0
         and openbao_dify_pr_automation_repositories | length > 0) else [] }}
# A set reaches ai-orchestrator only when its tier is in this list.
openbao_ai_orchestrator_github_tiers: [read]
# tier drives which identities may mint a set (see the github-*-policy
# templates): `read` sets are ambient; `admin` sets (installation-wide, full
# App ceiling) are minted only through the inert, human-gated github-admin
# identity. Per-repo WRITE tokens intentionally have NO set here — they use
# the raw github/token endpoint, parameter-pinned by the github-write policy
# to the known installations (a stored set cannot be narrowed by the request
# body at plugin v2.3.2, so per-repo token scoping must ride the raw
# endpoint).
openbao_github_base_permission_sets:
  - name: dryvist-full-automation
    tier: admin
    installation_id: "{{ openbao_github_dryvist_installation_id }}"
  - name: personal-full-automation
    tier: admin
    installation_id: "{{ openbao_github_personal_installation_id }}"
  # repo-create: administration:write ONLY — narrow enough to call
  # `POST /orgs/<organization>/repos` and nothing else (no contents, no pull_requests,
  # so this token cannot push). No `repositories` key: administration at the
  # org level cannot be scoped to a repo that does not exist yet. Organization-
  # level repository creation has no personal-account counterpart.
  - name: dryvist-repo-create
    tier: repo-create
    installation_id: "{{ openbao_github_dryvist_installation_id }}"
    permissions: "{{ openbao_github_repo_create_permissions }}"
  - name: dryvist-org-admin
    tier: org-admin
    installation_id: "{{ openbao_github_dryvist_installation_id }}"
    permissions: "{{ openbao_github_org_admin_permissions }}"
  - name: runner-register-dryvist
    tier: runner
    installation_id: "{{ openbao_github_dryvist_installation_id }}"
    permissions: "{{ openbao_github_runner_permissions }}"
  - name: exporter-dryvist
    tier: exporter
    installation_id: "{{ openbao_github_dryvist_installation_id }}"
    permissions: "{{ openbao_github_exporter_permissions }}"
openbao_github_org_secrets_installations:
  - name: dryvist
    installation_id: "{{ openbao_github_dryvist_installation_id }}"
  - name: jacobpevans
    installation_id: "{{ openbao_github_jacobpevans_installation_id }}"
  - name: jacobpevans-ai
    installation_id: "{{ openbao_github_jacobpevans_ai_installation_id }}"
  - name: jpe-ansible
    installation_id: "{{ openbao_github_jpe_ansible_installation_id }}"
  - name: jpe-cribl
    installation_id: "{{ openbao_github_jpe_cribl_installation_id }}"
  - name: jpe-nix
    installation_id: "{{ openbao_github_jpe_nix_installation_id }}"
  - name: jpe-private
    installation_id: "{{ openbao_github_jpe_private_installation_id }}"
  - name: jpe-splunk
    installation_id: "{{ openbao_github_jpe_splunk_installation_id }}"
  - name: jpe-openbao-plugin-secrets
    installation_id: "{{ openbao_github_jpe_openbao_plugin_secrets_installation_id }}"
  - name: jpe-ai-agents
    installation_id: "{{ openbao_github_jpe_ai_agents_installation_id }}"
  - name: jpe-claude
    installation_id: "{{ openbao_github_jpe_claude_installation_id }}"
# Additional organization-scoped runner sets are opt-in through the platform
# env document. Resolve each requested owner against the shared installation
# catalog so this list cannot introduce a separate installation-ID source.
openbao_github_runner_register_owners: >-
  {{ (openbao_platform_env['OPENBAO_GITHUB_RUNNER_REGISTER_OWNERS'] | default('', true)).split(',')
     | map('trim') | reject('equalto', '') | unique | list }}
openbao_github_runner_register_permission_sets: >-
  {%- set _sets = [] -%}
  {%- set _base_runner_names = openbao_github_base_permission_sets
       | selectattr('tier', 'equalto', 'runner') | map(attribute='name') | list -%}
  {%- for owner in openbao_github_runner_register_owners -%}
  {%- set _installation = openbao_github_org_secrets_installations
       | selectattr('name', 'equalto', owner) | list | first | default({}) -%}
  {%- if _installation.installation_id | default('', true) | string | length > 0
        and ('runner-register-' ~ owner) not in _base_runner_names -%}
  {%- set _ = _sets.append({'name': 'runner-register-' ~ owner,
      'tier': 'runner', 'installation_id': _installation.installation_id,
      'permissions': openbao_github_runner_permissions}) -%}
  {%- endif -%}
  {%- endfor -%}
  {{ _sets }}
openbao_github_runner_register_missing_owners: >-
  {%- set _missing = [] -%}
  {%- for owner in openbao_github_runner_register_owners -%}
  {%- set _installation = openbao_github_org_secrets_installations
       | selectattr('name', 'equalto', owner) | list | first | default({}) -%}
  {%- if _installation.installation_id | default('', true) | string | length == 0 -%}
  {%- set _ = _missing.append(owner) -%}
  {%- endif -%}
  {%- endfor -%}
  {{ _missing }}
openbao_github_org_secrets_permission_sets: >-
  {%- set _sets = [] -%}
  {%- for org in openbao_github_org_secrets_installations -%}
  {%- if org.installation_id | default('', true) | string | length > 0 -%}
  {%- set _ = _sets.append({'name': org.org_secrets_permission_set_name | default(org.name ~ '-org-secrets'),
      'tier': 'org-secrets', 'installation_id': org.installation_id,
      'permissions': openbao_github_org_secrets_permissions}) -%}
  {%- endif -%}
  {%- endfor -%}
  {{ _sets }}
# Full set list = the static base above plus repository-scoped tiers, which
# exist only when their repository lists are configured.
# Sets on the admin mount only; 05-github-engine.yml reconciles exactly these.
openbao_github_admin_permission_sets: >-
  {{ openbao_github_base_permission_sets + openbao_github_org_secrets_permission_sets
     + openbao_github_docs_publisher_permission_sets
     + openbao_github_dify_pr_automation_permission_sets
     + openbao_github_ci_resolver_permission_sets
     + openbao_github_router_snapshot_permission_sets
     + openbao_github_git_mirror_permission_sets
     + openbao_github_role_eval_status_permission_sets
     + openbao_github_workflows_write_permission_sets
     + openbao_github_dispatch_permission_sets
     + openbao_github_runner_register_permission_sets }}
# Every set on every GitHub mount, each tagged with its mount, for the policy
# templates.
openbao_github_permission_sets: >-
  {{ (openbao_github_admin_permission_sets
      | map('combine', {'mount': openbao_github_mount}) | list)
     + (openbao_github_read_permission_sets
        | map('combine', {'mount': openbao_github_everyday_mount}) | list)
     + (openbao_github_personal_permission_sets
        | map('combine', {'mount': openbao_github_personal_mount}) | list)
     + (openbao_github_openhands_permission_sets
        | map('combine', {'mount': openbao_github_openhands_mount}) | list)
     + (openbao_github_pepper_permission_sets
        | map('combine', {'mount': openbao_github_pepper_mount}) | list) }}
