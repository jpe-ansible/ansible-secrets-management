---
# Policy templates rendered + written on the bootstrap host. Each entry maps a
# policy name to its template; add a row to grow the RBAC surface.
#
# BEFORE ADDING A ROW, apply the plugins-first rule. A policy
# granting KV read for a resource that has a secrets engine is manual credential
# control and is rejected. GitHub App mounts and AWS (`aws`) are enabled by
# default. Estate identities use the existing `github-mint` capability policy
# attached via token_policies; operator tiers may have a dedicated policy for
# a parameter-pinned raw token endpoint. Neither uses a secret/github/* path.
# AWS is always aws/sts/<role>.
# Terrakube workspace policies: name = "terrakube-<workspace.name>", one row
# per openbao_terrakube_workspaces entry, same order. This used to be nine
# hand-written rows each referencing openbao_terrakube_workspaces[N] by
# position -- nothing structural kept a row's name in step with the index it
# pointed at, so inserting a workspace anywhere but the end (or a copy-paste
# index typo) would silently grant that workspace's KV paths to the WRONG job
# identity, passing review and converging clean. (This exact invariant is
# also asserted defensively in tasks/init/08-rbac-policies.yml; deriving here
# makes the drift structurally impossible instead of only detected after the
# fact.) Every existing name is unchanged by this derivation --
# proven in tests/test_terrakube_base_policies_derivation.py.
openbao_terrakube_base_policies: >-
  {%- set _entries = [] -%}
  {%- for ws in openbao_terrakube_workspaces -%}
  {%- set _ = _entries.append({'name': 'terrakube-' ~ ws.name,
      'template': 'terrakube-workspace-policy.hcl.j2', 'workspace': ws}) -%}
  {%- endfor -%}
  {{ _entries }}

# Declared per openbao_roster_key_reader_approle_names (05k), like the reader AppRoles (07f).
openbao_roster_key_reader_policies: >-
  {{ [{'name': openbao_roster_router_key_reader_name, 'template': 'llm-router-agent-keys-policy.hcl.j2'},
      {'name': openbao_roster_gateway_key_reader_name, 'template': 'agentgateway-agent-keys-policy.hcl.j2'}]
     | selectattr('name', 'in', openbao_roster_key_reader_approle_names) | list }}

# Only roster-owned MCP credentials need the owner-only deny overlay.
openbao_roster_owned_mcp_deny_policies: >-
  {{ ([{'name': openbao_roster_owned_mcp_deny_policy_name,
        'template': 'roster-owned-mcp-deny-policy.hcl.j2'}]
      if openbao_roster_owned_slug_names | length > 0 else []) }}

openbao_app_agent_tier_reader_policies: >-
  {%- set _entries = [] -%}
  {%- for reader in openbao_app_agent_tier_readers -%}
  {%- set _name = 'app-agent-' ~ reader.tier -%}
  {%- set _ = _entries.append({'name': _name,
      'template': 'app-agent-tier-reader-policy.hcl.j2', 'tier': reader.tier}) -%}
  {%- endfor -%}
  {{ _entries }}

openbao_roster_agent_policies: >-
  {%- set _entries = [] -%}
  {%- for agent in openbao_roster_agent_valid_names -%}
  {%- set _ = _entries.append({'name': agent,
      'template': 'roster-agent-policy.hcl.j2', 'agent': agent}) -%}
  {%- endfor -%}
  {{ _entries }}

openbao_dify_secret_id_issuer_policies: >-
  {{ ([{'name': openbao_seed_writer_dify_secret_id_issuer_policy_name,
        'template': 'seed-writer-dify-secret-id-issuer-policy.hcl.j2',
        'targets': openbao_dify_secret_id_issuer_targets}]
      if openbao_dify_secret_id_issuer_targets | length > 0 else []) }}

# Each org-scoped GitHub write set has its own token-path policy.
openbao_github_write_policies: >-
  {%- set _policies = [] -%}
  {%- for route in openbao_github_write_routes -%}
  {%- for permission_set in openbao_github_write_permission_sets
      | selectattr('tier', 'equalto', route.prefix) -%}
  {%- set _ = _policies.append({'name': permission_set.name,
      'org': permission_set.org_name, 'set': permission_set,
      'mount': route.mount, 'template': 'github-write-route-policy.hcl.j2'}) -%}
  {%- endfor -%}
  {%- endfor -%}
  {{ _policies }}
openbao_github_openhands_write_policies: >-
  {{ openbao_github_write_policies
     | selectattr('set.tier', 'equalto', openbao_github_openhands_write_set_prefix) | list }}
openbao_agentgateway_openhands_mint_policies: >-
  {{ ([{'name': openbao_agentgateway_openhands_mint_policy_name,
        'template': 'agentgateway-openhands-mint-policy.hcl.j2'}]
      if openbao_agentgateway_openhands_mint_secret_id_cidr | length > 0 else []) }}
openbao_ci_benchmark_lanes_policies: >-
  {{ ([{'name': openbao_ci_benchmark_lanes_policy_name,
        'template': 'ci-benchmark-lanes-policy.hcl.j2'}]
      if openbao_ci_benchmark_lanes_configured | bool else []) }}

openbao_base_policies: >-
  {{ openbao_terrakube_base_policies + openbao_base_policies_static
     + openbao_roster_owned_mcp_deny_policies
     + openbao_workstation_ssh_key_reader_policies
     + openbao_app_agent_tier_reader_policies
     + openbao_dify_secret_id_issuer_policies
     + openbao_dify_agent_policies + openbao_window_service_policies
     + openbao_pr_reconcile_policies
     + openbao_github_write_policies
     + openbao_agentgateway_openhands_mint_policies
     + openbao_ci_benchmark_lanes_policies }}

# Static policy catalog, loaded with the other defaults.
openbao_base_policies_static:
  - name: "{{ openbao_terraform_apply_policy_name }}"
    template: terraform-apply-policy.hcl.j2
  - name: "{{ openbao_flow_lock_policy_name }}"
    template: flow-lock-policy.hcl.j2
  - name: "{{ openbao_ai_sessions_backup_policy_name }}"
    template: ai-sessions-backup-policy.hcl.j2
  - name: "{{ openbao_packer_policy_name }}"
    template: packer-policy.hcl.j2
  - name: "{{ openbao_azure_iac_admin_policy_name }}"
    template: azure-iac-admin-policy.hcl.j2
  - name: "{{ openbao_backblaze_admin_policy_name }}"
    template: backblaze-admin-policy.hcl.j2
  # UniFi controller credential tiers: one exact-leaf read policy per tier
  # (read / write / admin credentials each live on their own KV leaf), plus the
  # terrakube workspace leaf read through that workspace's own policy. Exact
  # leaves, not an openbao_ai_domains entry — see 05b.
  - name: "{{ openbao_unifi_read_policy_name }}"
    template: unifi-tier-policy.hcl.j2
    tier: read
  - name: "{{ openbao_unifi_write_policy_name }}"
    template: unifi-tier-policy.hcl.j2
    tier: write
  - name: "{{ openbao_unifi_admin_policy_name }}"
    template: unifi-tier-policy.hcl.j2
    tier: admin
  - name: "{{ openbao_ansible_converge_policy_name }}"
    template: ansible-converge-policy.hcl.j2
  # Attached to the dedicated Authelia signing-writer AppRole only (07i), never
  # to semaphore: the shared converge policy above is carried by semaphore too.
  - name: "{{ openbao_authelia_signing_writer_policy_name }}"
    template: authelia-signing-writer-policy.hcl.j2
  # Attached to iac-platform-deploy only (07f). Denies the signing leaf that its
  # read-apps grant would otherwise reach.
  - name: "{{ openbao_iac_platform_deploy_signing_deny_policy_name }}"
    template: iac-platform-deploy-signing-deny-policy.hcl.j2
  # Placed next to ansible-converge because it is that policy's delta, not an
  # independent grant set. Safe to insert here despite the Terrakube
  # index-drift hazard above: the assert in tasks/init/08-rbac-policies.yml
  # selects on `workspace` being defined, and this entry has no `workspace`.
  - name: "{{ openbao_semaphore_policy_name }}"
    template: semaphore-policy.hcl.j2
  # Placed next to ansible-converge for the same reason as semaphore above: it
  # is a strict SUBSET of that policy, not an independent grant set. No
  # `workspace` key, so the Terrakube index-drift assert ignores it.
  - name: openbao-node-converge
    template: openbao-node-converge-policy.hcl.j2
  - name: "{{ openbao_observability_policy_name }}"
    template: observability-policy.hcl.j2
  - name: "{{ openbao_local_cloud_policy_name }}"
    template: local-cloud-policy.hcl.j2
  - name: "{{ openbao_monitoring_policy_name }}"
    template: monitoring-policy.hcl.j2
  - name: "{{ openbao_media_policy_name }}"
    template: media-policy.hcl.j2
  - name: "{{ openbao_ntfy_policy_name }}"
    template: ntfy-policy.hcl.j2
  - name: "{{ openbao_apps_policy_name }}"
    template: apps-policy.hcl.j2
  - name: "{{ openbao_cribl_edge_mac_a_policy_name }}"
    template: cribl-edge-reader-policy.hcl.j2
    bucket: cribl-edge-macbook
  - name: "{{ openbao_cribl_edge_mac_b_policy_name }}"
    template: cribl-edge-reader-policy.hcl.j2
    bucket: cribl-edge-mac-studio
  - name: "{{ openbao_hatchet_killtest_policy_name }}"
    template: cribl-edge-reader-policy.hcl.j2
    path: "{{ openbao_hatchet_killtest_kv_path }}"
  - name: "{{ openbao_local_llm_policy_name }}"
    template: local-llm-policy.hcl.j2
  - name: "{{ openbao_local_llm_workstation_policy_name }}"
    template: local-llm-workstation-policy.hcl.j2
  - name: github-agent-ci-fix
    template: github-agent-router-key-policy.hcl.j2
    path: "{{ openbao_kv_mount }}/data/apps/github-actions-ci-fix"
  - name: github-agent-pr-review
    template: github-agent-router-key-policy.hcl.j2
    path: "{{ openbao_kv_mount }}/data/apps/github-actions-pr-review"
  - name: "{{ openbao_ci_ai_review_policy_name }}"
    template: ci-ai-review-policy.hcl.j2
  - name: "{{ openbao_ci_evals_policy_name }}"
    template: ci-evals-policy.hcl.j2
  - name: docs-router-snapshot
    template: docs-router-snapshot-policy.hcl.j2
  - name: "{{ openbao_hatchet_eval_status_policy_name }}"
    template: hatchet-eval-status-policy.hcl.j2
  - name: "{{ openbao_hermes_policy_name }}"
    template: hermes-policy.hcl.j2
  - name: "{{ openbao_hermes_write_policy_name }}"
    template: hermes-write-policy.hcl.j2
  - name: "{{ openbao_hermes_private_agent_policy_name }}"
    template: hermes-private-agent-policy.hcl.j2
  - name: "{{ openbao_pepper_policy_name }}"
    template: pepper-policy.hcl.j2
  - name: "{{ openbao_llm_router_write_policy_name }}"
    template: llm-router-write-policy.hcl.j2
  - name: "{{ openbao_ai_donna_policy_name }}"
    template: ai-donna-policy.hcl.j2
  - name: "{{ openbao_config_read_policy_name }}"
    template: config-read-policy.hcl.j2
  - name: "{{ openbao_approle_audit_policy_name }}"
    template: approle-audit-policy.hcl.j2
  - name: "{{ openbao_config_write_policy_name }}"
    template: config-write-policy.hcl.j2
  - name: "{{ openbao_ai_public_policy_name }}"
    template: ai-public-policy.hcl.j2
  # GitHub token tiers (workstation git/gh). Engine mints only — each template
  # names its own boundary: read-* sets, the parameter-pinned raw token path,
  # or the human-gated *-full-automation sets.
  - name: "{{ openbao_github_read_policy_name }}"
    template: github-read-policy.hcl.j2
  - name: "{{ openbao_github_write_policy_name }}"
    template: github-write-policy.hcl.j2
  - name: "{{ openbao_github_admin_policy_name }}"
    template: github-admin-policy.hcl.j2
  - name: "{{ openbao_github_repo_create_policy_name }}"
    template: github-repo-create-policy.hcl.j2
  - name: "{{ openbao_github_org_admin_policy_name }}"
    template: github-org-admin-policy.hcl.j2
  - name: "{{ openbao_github_admin_issuer_policy_name }}"
    template: github-admin-issuer-policy.hcl.j2
  - name: "{{ openbao_github_runner_policy_name }}"
    template: github-runner-policy.hcl.j2
  - name: "{{ openbao_uicheck_policy_name }}"
    template: uicheck-policy.hcl.j2
  - name: "{{ openbao_github_exporter_policy_name }}"
    template: github-exporter-policy.hcl.j2
  - name: "{{ openbao_github_docs_publisher_policy_name }}"
    template: github-docs-publisher-policy.hcl.j2
  - name: "{{ openbao_github_ci_resolver_policy_name }}"
    template: github-ci-resolver-policy.hcl.j2
  - name: "{{ openbao_github_git_mirror_policy_name }}"
    template: git-mirror-policy.hcl.j2
  - name: "{{ openbao_openhands_policy_name }}"
    template: openhands-policy.hcl.j2
  - name: "{{ openbao_github_hermes_public_policy_name }}"
    template: hermes-public-policy.hcl.j2
  - name: "{{ openbao_github_hermes_private_policy_name }}"
    template: hermes-private-policy.hcl.j2
  - name: "{{ openbao_github_work_read_policy_name }}"
    template: github-work-read-policy.hcl.j2
  - name: "{{ openbao_github_work_write_policy_name }}"
    template: github-work-write-policy.hcl.j2
  - name: "{{ openbao_reconcile_policy_name }}"
    template: openbao-reconcile-policy.hcl.j2
  - name: "{{ openbao_tofu_state_admin_policy_name }}"
    template: tofu-state-admin-policy.hcl.j2
  - name: "{{ openbao_github_mount_config_policy_name }}"
    template: github-mount-config-policy.hcl.j2
  - name: "{{ openbao_policy_sync_policy_name }}"
    template: policy-sync-policy.hcl.j2
  - name: "{{ openbao_policy_sync_unlock_policy_name }}"
    template: policy-sync-unlock-policy.hcl.j2
  # approle-issuer: the secret_id minting half, split off openbao-reconcile so
  # a leaked reconcile credential is not a credential factory. See the template.
  - name: "{{ openbao_approle_issuer_policy_name }}"
    template: approle-issuer-policy.hcl.j2
  # human-unlock: the operator-held complement of approle-issuer — mints the
  # human-gated tiers and nothing else. Attached to a userpass user, not an
  # AppRole, so it has no row in openbao_approles.
  - name: "{{ openbao_human_unlock_policy_name }}"
    template: human-unlock-policy.hcl.j2
  # Normal Authelia OIDC login for the OpenBao UI. Its narrow KV write
  # exceptions are separate from the userpass human-unlock policy.
  - name: "{{ openbao_operator_human_policy_name }}"
    template: operator-human-policy.hcl.j2
  # Global KV and non-secret system metadata reads for trusted AI actor roles.
  - name: "{{ openbao_ai_global_read_policy_name }}"
    template: ai-global-read-policy.hcl.j2
  # human-unlock-untrusted: the phone-approved grant for the untrusted client.
  # Per-service apply-role secret_ids only; see the template.
  - name: "{{ openbao_human_unlock_untrusted_policy_name }}"
    template: human-unlock-untrusted-policy.hcl.j2
  - name: "{{ openbao_ai_orchestrator_policy_name }}"
    template: ai-orchestrator-policy.hcl.j2
  - name: "{{ openbao_open_llm_policy_name }}"
    template: open-llm-policy.hcl.j2
  - name: "{{ openbao_herdr_hail_policy_name }}"
    template: herdr-hail-policy.hcl.j2
  - name: "{{ openbao_claude_code_router_key_policy_name }}"
    template: claude-code-router-key-policy.hcl.j2
  - name: "{{ openbao_bao_elevate_client_policy_name }}"
    template: bao-elevate-client-policy.hcl.j2
  - name: "{{ openbao_sandbox_agent_read_policy_name }}"
    template: sandbox-agent-read-policy.hcl.j2
  - name: "{{ openbao_sandbox_agent_write_policy_name }}"
    template: sandbox-agent-write-policy.hcl.j2
  - name: "{{ openbao_sandbox_zcode_read_policy_name }}"
    template: sandbox-zcode-read-policy.hcl.j2
  - name: "{{ openbao_sandbox_zcode_write_policy_name }}"
    template: sandbox-zcode-write-policy.hcl.j2
  - name: "{{ openbao_sandbox_opencode_read_policy_name }}"
    template: sandbox-opencode-read-policy.hcl.j2
  - name: "{{ openbao_sandbox_opencode_write_policy_name }}"
    template: sandbox-opencode-write-policy.hcl.j2
  - name: "{{ openbao_sandbox_cursor_read_policy_name }}"
    template: sandbox-cursor-read-policy.hcl.j2
  - name: "{{ openbao_sandbox_cursor_write_policy_name }}"
    template: sandbox-cursor-write-policy.hcl.j2
  # ai-readonly / ai-elevated / ai-apply-<svc> no longer own standalone policies —
  # they are ACTOR roles that attach the base read-/write- capability leaves
  # (generated below into openbao_ai_capability_policies). ai-admin remains a
  # standalone policy shared only by the human-gated administrator roles; it is
  # NOT composed from capability leaves. The session role has a 12h hard cap.
  # Containment also comes from human unlock, alerting, and the enumerated paths.
  - name: "{{ openbao_ai_admin_policy_name }}"
    template: ai-admin-policy.hcl.j2
  # Explicit deny overlay limiting the human-unlocked admin roles.
  - name: "{{ openbao_ai_admin_guard_policy_name }}"
    template: ai-admin-guard-policy.hcl.j2
  # Exact path grants for the selected protected-policy and AppRole config
  # flow opened by ai-admin-session. The guard remains the hard deny layer.
  - name: "{{ openbao_ai_admin_window_policy_name }}"
    template: ai-admin-window-policy.hcl.j2
  - name: "{{ openbao_snapshot_policy_name }}"
    template: snapshot-policy.hcl.j2
  - name: "{{ openbao_apps_seed_policy_name }}"
    template: apps-seed-policy.hcl.j2
  - name: "{{ openbao_llm_gate_policy_name }}"
    template: llm-gate-policy.hcl.j2
  - name: "{{ openbao_vikunja_mcp_policy_name }}"
    template: vikunja-mcp-policy.hcl.j2
  - name: "{{ openbao_agent_workstation_policy_name }}"
    template: agent-workstation-policy.hcl.j2
  - name: "{{ openbao_ai_runner_policy_name }}"
    template: ai-runner-policy.hcl.j2
  - name: "{{ openbao_clickhouse_policy_name }}"
    template: clickhouse-policy.hcl.j2
  - name: "{{ openbao_clickhouse_ingest_policy_name }}"
    template: clickhouse-ingest-policy.hcl.j2
  - name: "{{ openbao_clickhouse_wall_policy_name }}"
    template: clickhouse-wall-policy.hcl.j2
  - name: "{{ openbao_slack_admin_policy_name }}"
    template: slack-admin-policy.hcl.j2
  - name: "{{ openbao_slack_ops_policy_name }}"
    template: slack-ops-policy.hcl.j2
  - name: "{{ openbao_slack_approvals_policy_name }}"
    template: slack-approvals-policy.hcl.j2
  - name: "{{ openbao_github_org_secrets_read_policy_name }}"
    template: github-org-secrets-read-policy.hcl.j2
  - name: "{{ openbao_splunk_mcp_rotate_policy_name }}"
    template: splunk-mcp-rotate-policy.hcl.j2
  - name: "{{ openbao_secret_age_audit_policy_name }}"
    template: secret-age-audit-policy.hcl.j2
  - name: "{{ openbao_ai_rotate_policy_name }}"
    template: ai-rotate-policy.hcl.j2
  - name: "{{ openbao_apps_rotate_policy_name }}"
    template: apps-rotate-policy.hcl.j2
  - name: "{{ openbao_media_rotate_policy_name }}"
    template: media-rotate-policy.hcl.j2
  - name: "{{ openbao_rustfs_rotate_policy_name }}"
    template: rustfs-rotate-policy.hcl.j2
  - name: "{{ openbao_approle_secret_id_rotate_policy_name }}"
    template: approle-secret-id-rotate-policy.hcl.j2
  - name: "{{ openbao_approle_secret_id_rotate_scheduled_policy_name }}"
    template: approle-secret-id-rotate-policy.hcl.j2
    scheduled_only: true
  # Enterprise App tokens use each raw endpoint, pinned by the dedicated tier policy.
  - name: "{{ openbao_github_enterprise_read_policy_name }}"
    template: github-enterprise-read-policy.hcl.j2
  - name: "{{ openbao_github_enterprise_admin_policy_name }}"
    template: github-enterprise-admin-policy.hcl.j2
  - name: "{{ openbao_nautobot_token_publisher_policy_name }}"
    template: nautobot-token-publisher-policy.hcl.j2
  - name: "{{ openbao_hatchet_token_publisher_policy_name }}"
    template: hatchet-token-publisher-policy.hcl.j2
