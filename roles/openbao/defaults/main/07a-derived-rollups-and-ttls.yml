---
# --- Derived rollups + generated policy/approle fragments (do NOT edit; add a
# service to openbao_ai_domains instead). read-all / read-write-all are lists of
# base policy NAMES attached to actor roles' token_policies — composition, not
# duplicated path rules. ---
openbao_ai_read_subtrees: "{{ (openbao_ai_domains + openbao_ai_readonly_extra_subtrees) | unique }}"
openbao_read_all_policies: "{{ openbao_ai_domains | map('regex_replace', '^(.+)$', 'read-\\1') | list }}"
openbao_read_write_all_policies: >-
  {{ (openbao_ai_domains | map('regex_replace', '^(.+)$', 'read-\1') | list)
     + (openbao_ai_domains | map('regex_replace', '^(.+)$', 'write-\1') | list) }}
# Base capability policy fragments for the render loop (one read leaf per read
# subtree, one write leaf per writable domain, plus the shared github-mint leaf).
openbao_ai_capability_policies: >-
  {{ (openbao_ai_read_subtrees | map('regex_replace', '^(.+)$',
        '{"name": "read-\1", "template": "kv-capability-policy.hcl.j2", "subtree": "\1", "mode": "read"}')
      | map('from_json') | list)
     + (openbao_ai_domains | map('regex_replace', '^(.+)$',
        '{"name": "write-\1", "template": "kv-capability-policy.hcl.j2", "subtree": "\1", "mode": "write"}')
      | map('from_json') | list)
     + [{"name": "github-mint", "template": "github-mint-policy.hcl.j2"}] }}
# User-cert-only view of openbao_ssh_roles. Several consumers (molecule
# verify's items2dict/map(attribute='principal')) read user-cert fields --
# principal, extensions -- unconditionally; a host-cert entry carries
# neither and would crash them rather than silently mis-render (hit in CI on
# PR #2203, molecule/openbao run 36232738114). Filtered once, here, rather
# than repeated at each call site.
#
# Two steps, deliberately: `rejectattr('cert_type', 'equalto', 'host')`
# directly on openbao_ssh_roles LOOKS equivalent and is NOT -- an item with
# no cert_type key at all raises AnsibleUndefinedVariable on the attribute
# fetch itself under this templating engine, before 'equalto' ever runs (the
# exact crash this derivation exists to avoid). `map(attribute=...,
# default=...)` and filtering by 'name' (always present on every entry) both
# tolerate a missing key; only a bare rejectattr/selectattr equality test on
# an optional key does not.
openbao_ssh_host_role_names: >-
  {{ openbao_ssh_roles | map(attribute='cert_type', default='user')
     | zip(openbao_ssh_roles | map(attribute='name'))
     | selectattr('0', 'equalto', 'host') | map(attribute='1') | list }}
openbao_ssh_user_roles: >-
  {{ openbao_ssh_roles | rejectattr('name', 'in', openbao_ssh_host_role_names
       + ['keygen']) | list }}
# ssh-sign-<role> capability leaves: one per USER-cert SSH signing role,
# granting ONLY the sign endpoint of that role. These are DELIBERATE
# enumerated grants outside secret/ — the kv-leaf self-escalation proof still
# holds for the KV rollups (read-all / read-write-all stay pure KV); an
# ssh-sign leaf adds exactly one non-KV path (<mount>/sign/<role>) and nothing
# else, asserted fail-closed in init.yml before rendering.
#
# Host-cert roles (openbao_ssh_host_role_names) get NO leaf of their own here
# — openbao_ssh_user_roles already excludes them. A standalone
# ssh-sign-host-cert policy would be a brand-new policy NAME, which only a
# privileged provisioning run may write; instead the template below folds an
# update-only host-cert grant directly into the existing signer roles named
# in openbao_ssh_host_cert_signer_roles, whose CONTENT the reconcile identity
# may already rewrite.
openbao_ssh_sign_policies: >-
  {{ openbao_ssh_user_roles | map(attribute='name') | map('regex_replace', '^(.+)$',
       '{"name": "ssh-sign-\1", "template": "ssh-sign-policy.hcl.j2", "ssh_role": "\1"}')
     | map('from_json') | list
     if openbao_ssh_engine_enabled else [] }}
# The two unattended user-cert roles whose sign policy also carries an
# update-only grant on every host-cert role's sign endpoint (issuance runs
# unattended in Semaphore). One list, read by ssh-sign-policy.hcl.j2 — never a
# literal 'ssh-sign-host-cert' name or a duplicated per-role grant.
openbao_ssh_host_cert_signer_roles:
  - automation-ansible
  - automation-semaphore
# Exact provider-key leaves. The provider list is the sole inventory; names,
# render rows, and AppRole attachments derive from it.
openbao_ai_api_key_policy_names: >-
  {{ openbao_ai_api_key_providers
     | map('regex_replace', '^(.+)$', 'ai-api-key-\1') | list }}
openbao_ai_api_key_policies: >-
  {{ openbao_ai_api_key_providers | map('regex_replace', '^(.+)$',
       '{"name": "ai-api-key-\1", "template": "ai-api-key-provider-policy.hcl.j2", "provider": "\1"}')
     | map('from_json') | list }}
# ai-apply-<svc> actor roles: one per writable domain, scoped to that service's
# read+write leaves plus per-run GitHub attribution and interactive SSH-cert
# signing (ssh-sign-automation-ai — 1h certs, non-root principals, audited).
# Inert (no standing secret_id).
# token_ttl/token_max_ttl are the "unlock window": one human unlock (a wrapped,
# single-use secret_id) yields ONE login whose token then lives the window, so
# an agent runs unattended for the whole window instead of re-asking per task.
# The literals here must stay in sync with openbao_ai_apply_token_ttl /
# openbao_ai_apply_token_max_ttl below (regex_replace can't interpolate a var
# inside its replacement string; the standalone vars document the intent).
openbao_ai_apply_approles: >-
  {{ openbao_ai_domains | map('regex_replace', '^(.+)$',
       '{"name": "ai-apply-\1", "token_policies": ["read-\1", "write-\1", "github-mint", "ssh-sign-automation-ai"],
         "token_ttl": "6h", "token_max_ttl": "12h",
         "manage_secret_id": false, "secret_id_ttl": "15m", "secret_id_num_uses": 1}')
     | map('from_json') | list }}
openbao_ai_admin_policy_name: ai-admin
openbao_ai_admin_approle_name: ai-admin
openbao_ai_admin_session_approle_name: ai-admin-session
openbao_ai_global_read_policy_name: ai-global-read
openbao_ai_trusted_read_all_policies: >-
  {{ openbao_read_all_policies + [openbao_ai_global_read_policy_name] }}
openbao_ai_admin_guard_policy_name: ai-admin-guard
openbao_ai_admin_window_policy_name: ai-admin-window-rbac
openbao_ai_admin_session_token_ttl: 1h
openbao_ai_admin_session_token_max_ttl: 12h
openbao_ai_admin_session_token_explicit_max_ttl: 12h
# The 12-hour admin session has an additional exact-path policy for the
# bounded RBAC selection flow. Keep identities that can change this window,
# the execution plane, or its children outside that grant. AppRoles and
# policies are partitioned by their own typed declarations; policy names are
# never used to classify AppRoles.
openbao_ai_admin_window_protected_approle_names: >-
  {{ [openbao_ai_admin_approle_name, openbao_ai_admin_session_approle_name,
      'admin', openbao_reconcile_approle_name, openbao_approle_issuer_approle_name,
      openbao_policy_sync_approle_name, openbao_semaphore_approle_name,
      openbao_ansible_converge_approle_name]
     + (openbao_window_service_approles | map(attribute='name') | list)
     | unique | list }}
# The AppRoles that can change this window, its guard, or policy text itself.
# Every policy any of them attaches is self-protecting, except the reconcile
# policy: syncing it is the window's own job (it stands in for policy-sync).
openbao_ai_admin_window_self_protecting_approle_names: >-
  {{ [openbao_ai_admin_approle_name, openbao_ai_admin_session_approle_name,
      'admin', openbao_approle_issuer_approle_name, openbao_policy_sync_approle_name]
     + (openbao_window_service_approles | map(attribute='name') | list)
     | unique | list }}
openbao_ai_admin_window_self_protecting_policy_names: >-
  {%- set _protected = [openbao_ai_admin_policy_name,
      openbao_ai_admin_guard_policy_name, openbao_ai_admin_window_policy_name,
      openbao_human_unlock_policy_name, openbao_human_unlock_untrusted_policy_name,
      openbao_approle_issuer_policy_name, openbao_policy_sync_policy_name,
      openbao_policy_sync_unlock_policy_name,
      openbao_tofu_state_admin_policy_name,
      'default'] -%}
  {# The service-token session inherits OpenBao's built-in default policy. #}
  {%- for _role in openbao_approles
      | selectattr('name', 'in', openbao_ai_admin_window_self_protecting_approle_names) -%}
  {%- set _ = _protected.extend(_role.token_policies
      | default([_role.policy] if _role.policy is defined else [])
      | reject('equalto', openbao_reconcile_policy_name)) -%}
  {%- endfor -%}
  {{ (_protected + (openbao_window_service_policies | map(attribute='name') | list)) | unique | list }}
# The human-gated policy universe, from the declared sources themselves: the
# reconcile exclusions, the self-protecting set, and every policy attached to
# any human-gated AppRole that is declared here. Each lands in exactly one of
# grant or guard deny.
openbao_ai_admin_window_human_gated_policy_names: >-
  {%- set _names = openbao_policies
      | selectattr('name', 'in', openbao_reconcile_policy_excluded_names)
      | map(attribute='name') | list
      + openbao_ai_admin_window_self_protecting_policy_names -%}
  {%- set _declared = openbao_policies | map(attribute='name') | list -%}
  {%- for _role in openbao_ai_admin_window_human_gated_approles -%}
  {%- set _ = _names.extend(_role.token_policies
      | default([_role.policy] if _role.policy is defined else [])
      | select('in', _declared)) -%}
  {%- endfor -%}
  {{ _names | unique | list }}
openbao_ai_admin_window_human_gated_policies: >-
  {{ openbao_policies
     | selectattr('name', 'in', openbao_ai_admin_window_human_gated_policy_names)
     | list }}
# openbao-reconcile remains in the human-gated population through its explicit
# entry in openbao_reconcile_excluded_policies; it stays grantable unless a
# current self-protecting attachment moves it into the guard deny set.
openbao_ai_admin_window_guard_deny_policy_names: >-
  {{ openbao_ai_admin_window_human_gated_policy_names
     | select('in', openbao_ai_admin_window_self_protecting_policy_names)
     | list }}
openbao_ai_admin_window_protected_policy_names: >-
  {{ openbao_ai_admin_window_guard_deny_policy_names }}
openbao_ai_admin_window_grant_policy_names: >-
  {{ openbao_ai_admin_window_human_gated_policy_names
     | reject('in', openbao_ai_admin_window_guard_deny_policy_names)
     | list }}
openbao_ai_admin_window_grant_policies: >-
  {{ openbao_ai_admin_window_human_gated_policies
     | selectattr('name', 'in', openbao_ai_admin_window_grant_policy_names)
     | list }}
# The only policies an OIDC role written through the window may attach: each
# declared OIDC role attaches exactly its own policy. Exact names only: OpenBao
# splits a comma string into policies, so a glob value would admit
# "<allowed>,<any policy>".
openbao_ai_admin_window_oidc_role_policies: >-
  {{ [openbao_ci_evals_policy_name, openbao_ci_ai_review_policy_name,
      openbao_ci_benchmark_lanes_policy_name, openbao_github_pr_reconcile_policy_name,
      openbao_github_docs_publisher_policy_name, openbao_uicheck_policy_name]
     + (openbao_github_write_oidc_roles | map(attribute='name') | list) }}
# Retain exact denies for named self-protecting roles even when their
# per-call secret_id flow has no manage_secret_id:false marker.
openbao_ai_admin_window_human_gated_approles: >-
  {{ openbao_approles
     | selectattr('name', 'in',
         ((openbao_approles
           | selectattr('manage_secret_id', 'defined')
           | rejectattr('manage_secret_id')
           | map(attribute='name') | list)
          + openbao_ai_admin_window_protected_approle_names) | unique | list)
     | list }}
openbao_ai_admin_window_guard_deny_approles: >-
  {{ openbao_ai_admin_window_human_gated_approles
     | selectattr('name', 'in', openbao_ai_admin_window_protected_approle_names)
     | list }}
openbao_ai_admin_window_grant_approles: >-
  {{ openbao_ai_admin_window_human_gated_approles
     | rejectattr('name', 'in', openbao_ai_admin_window_protected_approle_names)
     | list }}
# Keep the task/selection API names aligned with the exact grant partitions.
openbao_ai_admin_window_manageable_policies: "{{ openbao_ai_admin_window_grant_policies }}"
openbao_ai_admin_window_manageable_approles: "{{ openbao_ai_admin_window_grant_approles }}"
# Token/secret_id bounds for the elevated tiers, as the "unlock window" model:
# one human unlock (a wrapped, single-use secret_id) -> one login -> a token that
# lives the window, so an agent works unattended for the window instead of a
# human minting per task. secret_id_ttl bounds an UNUSED minted grant (the redeem
# window); num_uses=1 makes the wrapped secret_id single-login.
#   ai-apply-<svc>  6h default / 12h max   (single-domain write — routine workhorse)
#   ai-apply-all    1h default / 6h max    (cross-domain write — wider, so tighter)
#   ai-admin        1h                     (COMPLETE full admin — alerted every use)
#   ai-admin-session 1h default / 12h hard max (service-token session — same alerted policy)
# ai-apply-<svc> literals live in the generated openbao_ai_apply_approles above
# and must match openbao_ai_apply_token_ttl / _max_ttl here.
openbao_ai_apply_token_ttl: 6h
openbao_ai_apply_token_max_ttl: 12h
openbao_ai_apply_all_token_ttl: 1h
openbao_ai_apply_all_token_max_ttl: 6h
openbao_ai_admin_token_ttl: 1h
openbao_ai_elevated_secret_id_ttl: 15m
openbao_snapshot_policy_name: snapshot
openbao_snapshot_approle_name: snapshot
# apps-seed — the automated WRITER for per-app service secrets under
# secret/apps/* (create/update/read only, no other domain). Terraform
# (terraform-proxmox vault-secrets) authenticates as this role to generate +
# store each app's credentials at the source. Doppler-published creds
# (APPS_SEED_VAULT_ROLE_ID / _SECRET_ID), the same delivery as terraform-apply.
openbao_apps_seed_policy_name: apps-seed
openbao_apps_seed_approle_name: apps-seed
# llm-gate — the Mac Studio's llm-large Caddy gate. Dedicated least-privilege
# reader for EXACTLY the two secrets it injects into Caddy: the bearer token
# (secret/ai/llm) and the Route53 ACME creds (secret/platform/acme). role_id/
# secret_id are delivered to the Studio's auto-readable keychain and consumed
# by openbao-run (the doppler-free replacement for the gate's ~/.doppler token).
openbao_llm_gate_policy_name: llm-gate
openbao_llm_gate_approle_name: llm-gate
# vikunja-mcp — the workstation Vikunja MCP launch. Reads EXACTLY
# secret/ai/mcp/vikunja (the token + URL the vikunja role publishes), nothing
# else in the ai subtree.
openbao_vikunja_mcp_policy_name: vikunja-mcp
openbao_vikunja_mcp_approle_name: vikunja-mcp
# ai-runner — the headless AI job-runner guests (ai_runner role in
# ansible-proxmox-ai, WS7A). Own least-privilege reader for EXACTLY the three
# third-party KV secrets the runner's job worker consumes: the Vikunja
# dispatch-queue token and the Anthropic + OpenAI model-provider keys. None of
# the three has an OpenBao secrets engine (Vikunja is self-hosted; Anthropic
# and OpenAI are third-party SaaS with no plugin), so KV is the correct tier
# per the plugins-first rule — NOT a duplicate of local-llm's
# broad ai/* read, and NOT any GitHub/AWS grant (the worker consumes neither).
openbao_ai_runner_policy_name: ai-runner
openbao_ai_runner_approle_name: ai-runner
# secret_id CIDR binding for the runner guest's fixed reservation. Real CIDRs
# are never committed (public repo) — delivered via env, the same channel and
# pattern as OPENBAO_SSH_SOURCE_CIDRS. Empty fails the converge.
openbao_ai_runner_secret_id_cidr: >-
  {{ openbao_platform_bind_cidrs['OPENBAO_AI_RUNNER_SECRET_ID_CIDR'] }}

# clickhouse — dedicated reader for the application and reader passwords
# stored at the exact internal secret/ai/clickhouse leaf.
openbao_clickhouse_policy_name: clickhouse
openbao_clickhouse_approle_name: clickhouse

# clickhouse-ingest — read-only reader of the ClickHouse ingest writer password
# at the exact internal secret/ai/clickhouse-ingest leaf.
openbao_clickhouse_ingest_policy_name: clickhouse-ingest
openbao_clickhouse_ingest_approle_name: clickhouse-ingest

# clickhouse-wall — read-only reader of the ClickHouse wall reader password
# at the exact internal secret/ai/clickhouse-wall leaf.
openbao_clickhouse_wall_policy_name: clickhouse-wall
openbao_clickhouse_wall_approle_name: clickhouse-wall

# The set of non-root AppRoles to provision, each {name, policy}. Driving the
# bootstrap from this list keeps init.yml DRY as groups are added. Per-identity
# `secret_id_bound_cidrs` / `token_bound_cidrs` binding is resolved from the
# named CIDR classes in 08b-cidr-and-unlock.yml: a role declares which segment it
# lives on, the operator supplies that segment's CIDRs by env, and a class that
# is needed but empty FAILS the converge rather than silently producing the
# unbound role the binding exists to prevent.
