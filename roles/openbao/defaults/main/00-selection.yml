---
# Each kind declares its objects and the API paths its writes address.
openbao_select_profiles:
  policies:
    candidates: "{{ openbao_manageable_policies | default(openbao_policies) }}"
    declared: "{{ openbao_policies }}"
    prefix: sys/policies/acl/
    suffixes: [""]
    capability: update
  approles:
    candidates: "{{ openbao_manageable_approles | default(openbao_approles) }}"
    declared: "{{ openbao_approles }}"
    prefix: auth/approle/role/
    suffixes: ["", /policies]
    capability: update
  ssh_roles:
    candidates: "{{ openbao_ssh_roles }}"
    prefix: "{{ openbao_ssh_mount }}/roles/"
    suffixes: [""]
    capability: update
  github_permission_sets:
    candidates: "{{ openbao_github_admin_permission_sets }}"
    prefix: "{{ openbao_github_mount }}/permissionset/"
    suffixes: [""]
    capability: update
  rotation_exempt:
    candidates: "{{ openbao_rotation_exempt | map('community.general.dict_kv', 'name') | list }}"
    prefix: ""
    name_pattern: ':'
    name_replacement: /metadata/
    suffixes: [""]
    capability: patch
  kv_mounts:
    candidates: "{{ openbao_kv_mounts | map(attribute='path') | map('community.general.dict_kv', 'name') | list }}"
    prefix: sys/mounts/
    suffixes: [""]
    capability: update
  github_app_mounts:
    candidates: >-
      {{ openbao_github_app_mounts | map(attribute='mount')
      | map('community.general.dict_kv', 'name') | list }}
    prefix: sys/mounts/
    suffixes: [""]
    capability: update
  github_oidc_roles:
    candidates: "{{ openbao_github_openhands_write_oidc_roles | default([]) }}"
    prefix: "auth/{{ openbao_github_oidc_auth_path }}/role/"
    suffixes: [""]
    capability: update
  reconcile_policy:
    candidates:
      - name: "{{ openbao_reconcile_policy_name }}"
    prefix: sys/policies/acl/
    suffixes: [""]
    capability: update
