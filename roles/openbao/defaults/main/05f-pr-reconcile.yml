---
# The fleet PR reconcile workflow authenticates through GitHub Actions OIDC;
# it carries no stored runner credential. Its repository and owner list are read
# from the platform environment document.
openbao_github_pr_reconcile_policy_name: pr-reconcile-sweep
openbao_github_pr_reconcile_audience: openbao
openbao_github_pr_reconcile_repository: >-
  {{ openbao_platform_env['OPENBAO_GITHUB_PR_RECONCILE_REPOSITORY'] | default('', true) | trim }}
openbao_github_pr_reconcile_workflow_file: .github/workflows/pr-reconcile-sweep.yml
openbao_github_pr_reconcile_ref: refs/heads/main
openbao_github_pr_reconcile_workflow_ref: >-
  {{ openbao_github_pr_reconcile_repository ~ '/' ~ openbao_github_pr_reconcile_workflow_file
     ~ '@' ~ openbao_github_pr_reconcile_ref }}
openbao_github_pr_reconcile_event_names: [schedule, workflow_dispatch]
openbao_github_pr_reconcile_runner_environment: self-hosted
openbao_github_pr_reconcile_token_ttl: 5m
openbao_github_pr_reconcile_token_max_ttl: 10m

# Owners whose everyday-App installation the sweep may mint for, by name.
openbao_pr_reconcile_owners: >-
  {{ (openbao_platform_env['OPENBAO_GITHUB_PR_RECONCILE_OWNERS'] | default('', true)).split(',')
     | map('trim') | reject('equalto', '') | list }}
openbao_github_pr_reconcile_enabled: >-
  {{ openbao_github_pr_reconcile_repository | length > 0 and openbao_pr_reconcile_owners | length > 0 }}

# actions: write dispatches the CI-fix workflow; checks: read lists check runs before a fix or merge.
# PR labels and comments use pull_requests: write, so issues is not requested.
openbao_github_pr_reconcile_permissions:
  actions: write
  checks: read
  contents: write
  pull_requests: write
  statuses: write

# Push-to-base callers of the shared PR Reconcile reusable workflow mint a token
# for their own repository through this role (a reusable workflow, so its claim
# is job_workflow_ref): that workflow at main or a release tag, a push to develop
# or main, a self-hosted runner, and only the listed owners.
openbao_github_pr_reconcile_caller_policy_name: pr-reconcile
openbao_github_pr_reconcile_caller_workflow_refs:
  - JacobPEvans/.github-ai/.github/workflows/pr-reconcile.yml@refs/heads/main
  - JacobPEvans/.github-ai/.github/workflows/pr-reconcile.yml@refs/tags/v*
openbao_github_pr_reconcile_caller_event_names: [push]
openbao_github_pr_reconcile_caller_refs: [refs/heads/develop, refs/heads/main]
# Owners that have a push-to-base caller, by name; an owner is added as its callers roll out.
openbao_github_pr_reconcile_caller_owners: >-
  {{ (openbao_platform_env['OPENBAO_GITHUB_PR_RECONCILE_CALLER_OWNERS'] | default('', true)).split(',')
     | map('trim') | reject('equalto', '') | list }}
openbao_github_pr_reconcile_caller_enabled: >-
  {{ openbao_github_pr_reconcile_caller_owners | length > 0 }}
# A single-repository reconcile updates branches, labels and comments on pull
# requests and sets commit statuses; it never dispatches or reruns a workflow.
openbao_github_pr_reconcile_caller_permissions:
  contents: write
  pull_requests: write
  statuses: write

# Each policy is declared only while its inputs are set. Unset, it is retired
# (deleted if it exists) and its OIDC role is removed, so an empty owner list can
# never render an allow-anything org_name constraint.
openbao_pr_reconcile_policies: >-
  {{ ([{'name': openbao_github_pr_reconcile_policy_name,
        'template': 'pr-reconcile-sweep-policy.hcl.j2'}]
      if openbao_github_pr_reconcile_enabled | bool else [])
     + ([{'name': openbao_github_pr_reconcile_caller_policy_name,
          'template': 'pr-reconcile-policy.hcl.j2'}]
        if openbao_github_pr_reconcile_caller_enabled | bool else []) }}

# GitHub write jobs authenticate using their GitHub Actions reusable workflow
# identity. Each per-org role binds that org's own audience; the workflow-ref
# suffix is shared by every route.
openbao_github_openhands_write_token_ttl: "{{ openbao_github_pr_reconcile_token_ttl }}"
openbao_github_openhands_write_token_max_ttl: "{{ openbao_github_pr_reconcile_token_max_ttl }}"
openbao_github_openhands_write_workflow_ref_suffix: "@*"
openbao_github_write_workflow_ref_suffix: "{{ openbao_github_openhands_write_workflow_ref_suffix }}"
openbao_github_claude_write_token_ttl: 15m
openbao_github_claude_write_token_max_ttl: 15m
openbao_github_gate_checks_token_ttl: 15m
openbao_github_gate_checks_token_max_ttl: 15m
# The gate's check token binds only to the shared workflows on main or a
# release tag, never a pull request or branch ref.
openbao_github_gate_checks_workflow_ref_suffixes:
  - "@refs/heads/main"
  - "@refs/tags/v*"
openbao_github_openhands_workflows_token_ttl: 5m
openbao_github_openhands_workflows_token_max_ttl: 10m
openbao_github_write_oidc_roles: >-
  {%- set _roles = [] -%}
  {%- for route in openbao_github_write_routes -%}
  {%- if route.orgs | length > 0 and route.workflows | length > 0
      and route.app_id | string | length > 0 -%}
  {%- for permission_set in openbao_github_write_permission_sets
      | selectattr('tier', 'equalto', route.prefix) -%}
  {%- set _ = _roles.append({'name': permission_set.name,
      'org': permission_set.org_name, 'set': permission_set}) -%}
  {%- endfor -%}
  {%- endif -%}
  {%- endfor -%}
  {{ _roles }}
openbao_github_openhands_write_oidc_roles: >-
  {{ openbao_github_write_oidc_roles
     | selectattr('set.tier', 'equalto', openbao_github_openhands_write_set_prefix) | list }}
