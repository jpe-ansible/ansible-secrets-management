---
# --- Deliberate exceptions to the undeclared-live-identity assert -------------
# init/10-approles.yml compares every AppRole that actually exists in the store
# against openbao_approles (07b-base-approles.yml) and fails naming any live
# identity this list does not cover. That is the whole point: a role
# reconciliation never visits because it was never declared here keeps
# whatever weak bounds it was created with, forever, invisible to every
# future converge.
#
# There is no other way out of that failure. A role that legitimately should
# not be managed by this repo is named HERE, with a reason, so the exception
# is as visible as the declaration it stands in for -- never a variable
# tucked away where the failure message can't point at it. Empty is the
# healthy state; an entry here is a decision, not a default.
#
# Split into its own file (rather than living beside openbao_approles in
# 07b-base-approles.yml) purely to stay under this repo's per-file token
# budget -- Ansible's defaults/main/ directory auto-loads every file here, so
# the split is not a behavior change.
#
# Exceptions whose names must stay out of this public repository come from
# the iac secret store as a JSON list of {"name": ..., "reason": ...} objects,
# the same way write realm names do. Unset yields no extra entries.
openbao_approle_undeclared_exceptions_inline:
  - name: ansible
    reason: >-
      Retiring once its callers move off. Still signs SSH certificates for
      workstation runs.
openbao_approle_undeclared_exceptions: >-
  {{ openbao_approle_undeclared_exceptions_inline
     + (lookup('env', 'OPENBAO_APPROLE_UNDECLARED_EXCEPTIONS') | default('[]', true) | from_json) }}
# Retired identities: the converge deletes each one that is still live
# (init/10d-approle-undeclared-live.yml) before the assert above runs. A name
# may leave this list once no store holds it.
openbao_retired_approles: >-
  {{ ['open-llm-workstation', 'github-agents', 'github-admin-claude',
      'claude-identity', 'github-work', 'github-write-work', 'github-work-admin']
     + openbao_roster_key_reader_retired_names }}
# Retired per-owner Terrakube JWT roles and policies share this prefix. The
# trailing hyphen keeps the live `terrakube-tofu-github` role and policy out of it.
openbao_retired_terrakube_prefix: terrakube-tofu-github-
# Retired policies, deleted the same way (init/08b-rbac-policy-writes.yml).
openbao_retired_policies: >-
  {{ ['github-agents', 'github-admin-claude-issuer', 'github-work', 'github-write-work',
      'github-work-admin']
     + openbao_roster_key_reader_retired_names
     + openbao_roster_owned_mcp_deny_retired_names
     + ([] if openbao_github_pr_reconcile_enabled | bool
        else [openbao_github_pr_reconcile_policy_name])
     + ([] if openbao_github_pr_reconcile_caller_enabled | bool
        else [openbao_github_pr_reconcile_caller_policy_name]) }}
# Example shape (do not add speculatively):
#   - name: some-vendor-managed-role
#     reason: provisioned by <tool>, out of this repo's control
