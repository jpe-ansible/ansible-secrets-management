---
# OpenBao Raft-voter health telemetry — deploy a systemd timer that samples
# every voter's unauthenticated sys/health + sys/leader endpoints and ships
# one event per voter per cycle to Splunk HEC. Read-only: no Raft membership,
# policy, or AppRole change. Skipped under Docker (molecule) — no functional
# systemd init in the container, matching roles/openbao's own timer plays.

# The token comes from the controller environment. Without it the template
# renders an empty token over the live one and the sampler stops shipping.
- name: Refuse to render the voter-health EnvironmentFile without a HEC token
  ansible.builtin.assert:
    that:
      - openbao_voter_health_splunk_hec_token | length > 0
    fail_msg: >-
      SPLUNK_HEC_TOKEN is unset on the controller. Run under the secret-store
      environment that supplies it; rendering now would blank the live token.
    quiet: true
  when: openbao_voter_health_enabled | bool

- name: Render the OpenBao voter-health EnvironmentFile (HEC token + optional AppRole creds)
  ansible.builtin.template:
    src: openbao-voter-health.env.j2
    dest: "{{ openbao_voter_health_env_file }}"
    owner: root
    group: "{{ openbao_group | default('openbao') }}"
    mode: "0600"
  no_log: true
  notify: Restart openbao voter-health timer
  when: openbao_voter_health_enabled | bool

- name: Deploy the OpenBao voter-health sampling script
  ansible.builtin.template:
    src: openbao-voter-health.sh.j2
    dest: "{{ openbao_voter_health_script_path }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart openbao voter-health timer
  when: openbao_voter_health_enabled | bool

- name: Deploy the OpenBao voter-health systemd service unit
  ansible.builtin.template:
    src: openbao-voter-health.service.j2
    dest: "/etc/systemd/system/{{ openbao_voter_health_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart openbao voter-health timer
  when: openbao_voter_health_enabled | bool

- name: Deploy the OpenBao voter-health systemd timer unit
  ansible.builtin.template:
    src: openbao-voter-health.timer.j2
    dest: "/etc/systemd/system/{{ openbao_voter_health_service_name }}.timer"
    owner: root
    group: root
    mode: "0644"
  notify: Restart openbao voter-health timer
  when: openbao_voter_health_enabled | bool

- name: Enable and start the OpenBao voter-health timer
  ansible.builtin.systemd:
    name: "{{ openbao_voter_health_service_name }}.timer"
    state: started
    enabled: true
    daemon_reload: true
  when:
    - openbao_voter_health_enabled | bool
    - ansible_virtualization_type | default('') != 'docker'

- name: Assert the retired voter-health script path differs from the live path
  ansible.builtin.assert:
    that:
      - openbao_voter_health_retired_script_path != openbao_voter_health_script_path
    fail_msg: The retired voter-health path must differ from the live script path.
    quiet: true
  when: openbao_voter_health_enabled | bool

- name: Remove the retired OpenBao voter-health sampling script
  ansible.builtin.file:
    path: "{{ openbao_voter_health_retired_script_path }}"
    state: absent
  when: openbao_voter_health_enabled | bool
