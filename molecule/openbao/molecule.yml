---
# Molecule scenario for the openbao role.
# CI-only gate: local runs are known-broken in this repo (see AGENTS.md /
# project memory). Do not run locally.

platforms:
  - name: openbao-test${CI_INSTANCE_SUFFIX}
    # No stable version tags published; geerlingguy only ships :latest.
    # renovate: datasource=docker depName=mirror.gcr.io/geerlingguy/docker-debian12-ansible
    image: >-
      mirror.gcr.io/geerlingguy/docker-debian12-ansible:latest@sha256:39bdd16916ec475a12db0502550b72e4f4c2cc858a1939ad2a17f21f6eb51b65
    privileged: true
    command: ""
    pre_build_image: true
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    groups:
      - openbao_group
      - lxc_containers

provisioner:
  name: ansible
  # Placeholder values for the environment-specific Terrakube workspace names
  # the role reads from the runtime environment.
  env:
    OPENBAO_TERRAKUBE_NETWORK_WORKSPACE: example-network
    OPENBAO_TERRAKUBE_AWS_WORKSPACE: example-aws
  inventory:
    # container_ip is a HOSTVAR in production (load_tofu.yml sets it per host);
    # the role reads it via hostvars to build the Raft peer list, so it must be
    # a hostvar here too (a play var would not be visible through hostvars).
    host_vars:
      openbao-test${CI_INSTANCE_SUFFIX}:
        container_ip: "192.168.20.210"
  config_options:
    defaults:
      interpreter_python: auto_silent
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/roles

scenario:
  name: openbao
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
