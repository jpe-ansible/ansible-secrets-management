---
# Molecule scenario for the openbao_voter_health role.
# CI-only gate: local runs are known-broken in this repo (see AGENTS.md /
# project memory). Do not run locally.

platforms:
  - name: openbao-voter-health-test${CI_INSTANCE_SUFFIX}
    # No stable version tags published; geerlingguy only ships :latest.
    # renovate: datasource=docker depName=mirror.gcr.io/geerlingguy/docker-debian12-ansible
    image: >-
      mirror.gcr.io/geerlingguy/docker-debian12-ansible:latest@sha256:74c7e3326b2a35aa4f32c2e943e48a03da8698e2d0c484153bb24110387b285d
    privileged: true
    command: ""
    pre_build_image: true
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    groups:
      - openbao_group
      - lxc_containers

provisioner:
  name: ansible
  inventory:
    host_vars:
      openbao-voter-health-test${CI_INSTANCE_SUFFIX}:
        hostname: openbao-voter-health-test
  config_options:
    defaults:
      interpreter_python: auto_silent
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/roles

scenario:
  name: openbao_voter_health
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
